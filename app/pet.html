};

function openPanelForm() {
  const holder = document.getElementById('labForm');
  holder.innerHTML = `
    <div class="edit-form">
      <h3>➕ เพิ่มหมวดผลเลือด</h3>
      <div class="fld">
        <label>เลือกเทมเพลตสำเร็จรูป (ค่า + เกณฑ์ปกติมาให้เลย)</label>
        <label class="tpl-row"><input type="checkbox" id="tplCbc"> <b>CBC (Hematology)</b> — 18 ค่า</label>
        <label class="tpl-row"><input type="checkbox" id="tplChem"> <b>ค่าชีวเคมี (Blood Chemistry)</b> — 22 ค่า</label>
      </div>
      <div class="fld">
        <label>หรือสร้างหมวดว่างเอง (พิมพ์ชื่อ)</label>
        <input type="text" id="tplCustom" placeholder="เช่น Urinalysis, Thyroid Panel">
      </div>
      <div class="btns">
        <button class="btn" id="tplSave">เพิ่ม</button>
        <button class="btn-ghost" id="tplCancel">ยกเลิก</button>
      </div>
      <div class="saving" id="tplMsg" style="margin-top:8px"></div>
    </div>`;

  document.getElementById('tplCancel').onclick = () => { holder.innerHTML = ''; };
  document.getElementById('tplSave').onclick = async () => {
    const wantCbc = document.getElementById('tplCbc').checked;
    const wantChem = document.getElementById('tplChem').checked;
    const customName = document.getElementById('tplCustom').value.trim();
    if (!wantCbc && !wantChem && !customName) { alert('เลือกเทมเพลต หรือพิมพ์ชื่อหมวดอย่างน้อยหนึ่งอย่าง'); return; }

    // กันเพิ่มหมวดชื่อซ้ำกับที่มีอยู่แล้ว
    const existNames = new Set((PET.data.labPanels || []).map((p) => p.name.trim().toLowerCase()));
    const dup = [];
    if (wantCbc && existNames.has(LAB_TEMPLATES.cbc.name.toLowerCase())) dup.push('CBC (Hematology)');
    if (wantChem && existNames.has(LAB_TEMPLATES.chem.name.toLowerCase())) dup.push('Blood Chemistry');
    if (customName && existNames.has(customName.toLowerCase())) dup.push(customName);
    if (dup.length && !await TC.confirm(`มีหมวดชื่อ "${dup.join('", "')}" อยู่แล้ว\n\nเพิ่มต่อจะได้หมวดซ้ำ — ต้องการเพิ่มซ้ำจริงหรือไม่?`)) return;

    const btn = document.getElementById('tplSave');
    btn.disabled = true; btn.textContent = 'กำลังเพิ่ม...';
    try {
      const d = PET.data || {};
      const panels = [...(d.labPanels || [])];
      let cfg = [...(d.labConfig || [])];
      let firstId = null;
      const usedTemplate = wantCbc || wantChem;

      const addTemplate = (tplKey) => {
        const tpl = LAB_TEMPLATES[tplKey];
        const id = 'panel_' + Math.random().toString(36).slice(2, 7);
        if (!firstId) firstId = id;
        panels.push({ id, name: tpl.name });
        tpl.params.forEach((p) => cfg.push({
          panel: id, key: 'p_' + Math.random().toString(36).slice(2, 8),
          label: p.label, unit: p.unit, min: p.min, max: p.max,
        }));
      };
      if (wantCbc) addTemplate('cbc');
      if (wantChem) addTemplate('chem');
      if (customName) {
        const id = 'panel_' + Math.random().toString(36).slice(2, 7);
        if (!firstId) firstId = id;
        panels.push({ id, name: customName });
      }

      await TC.setPetPath(PET.id, ['labConfig'], cfg);
      PET.data = await TC.setPetPath(PET.id, ['labPanels'], panels);
      LAB_OPEN = firstId;

      if (usedTemplate) {
        alert('เพิ่มหมวดจากเทมเพลตแล้ว ✅\n\n⚠️ อย่าลืมตรวจสอบ "เกณฑ์ปกติ" ให้ตรงกับใบแล็บของน้อง — ' +
          'แต่ละแล็บ/เครื่องตรวจอาจใช้ช่วงค่าปกติต่างกัน แก้ได้ที่ ⚙️ ค่าตรวจ + เกณฑ์ปกติ ในแต่ละหมวด');
      }
      showTab('labs');
    } catch (e) {
      document.getElementById('tplMsg').textContent = e.message || 'เพิ่มไม่สำเร็จ';
      btn.disabled = false; btn.textContent = 'เพิ่ม';
    }
  };
}


/* ================= แท็บสรุป ================= */

// section ทั้งหมดในหน้าสรุป + ตัวสร้างกล่อง (parent เลือกแสดง/ซ่อน/จัดลำดับได้)
// section หลัก — สัตว์ทุกตัวมีเสมอ (สัตว์ใหม่เริ่มด้วยแค่ 2 อันนี้)
const SUMMARY_CORE = {
  danger: { label: '🚨 สัญญาณต้องไปหาหมอทันที',   build: (d) => dangerBox(d.dangerSigns || {}) },
  watch:  { label: '📋 สิ่งที่ต้องติดตาม',         build: (d) => watchBox(d.watchList || []) },
};

// เทมเพลตสำเร็จรูป — เลือกเพิ่มได้ทีหลัง (เหมือนเทมเพลตผลเลือด) · ลบได้ (ข้อมูลหายด้วย)
// "มี" section นี้ = เปิดไว้ใน display.builtins หรือมีข้อมูลอยู่แล้ว (เฟ่/เฟ่อเก่าไม่ต้อง migrate)
const SUMMARY_TEMPLATES = {
  leuco: {
    label: '💉 เกณฑ์ฉีด Leuco Plus',
    build: (d) => leucoBox(d),
    hasData: (d) => !!d.leucoPlus,
    clearPath: ['leucoPlus'], clearValue: null,
  },
  tumor: {
    label: '📈 ขนาดก้อนในตับ',
    build: (d) => tumorChart((d.vitals && d.vitals.liverTumor) || []),
    hasData: (d) => !!(d.vitals && d.vitals.liverTumor && d.vitals.liverTumor.length),
    clearPath: ['vitals', 'liverTumor'], clearValue: [],
  },
};

// เทมเพลตถูก "เปิด" สำหรับน้องตัวนี้ไหม (กดเพิ่มแล้ว หรือมีข้อมูลเดิมอยู่)
function templateOn(d, key) {
  const on = (d.display && d.display.builtins) || [];
  return on.includes(key) || SUMMARY_TEMPLATES[key].hasData(d);
}

// default order: สัตว์ใหม่โชว์ danger + watch + น้ำหนัก · เทมเพลตต่อท้ายเมื่อถูกเปิด
const SUMMARY_DEFAULT_ORDER = ['danger', 'watch', 'weight', 'leuco', 'tumor'];

// รวม section ทั้งหมด (core + น้ำหนัก + เทมเพลตที่เปิด + ที่ผู้ใช้เพิ่มเอง) → map key→{label, build}
function getSections(d) {
  const map = { ...SUMMARY_CORE };
  // น้ำหนัก — มีทุกตัว (default on) แต่ซ่อนได้ผ่าน ⚙️ ปรับหน้าสรุป · ไม่มีข้อมูลก็ไม่พัง
  map.weight = { label: '⚖️ น้ำหนัก (kg)', build: (dd) => weightChart(dd) };
  for (const key of Object.keys(SUMMARY_TEMPLATES)) {
    if (templateOn(d, key)) map[key] = SUMMARY_TEMPLATES[key];
  }
  const custom = (d.custom || {});
  for (const [id, sec] of Object.entries(custom)) {
    const icon = sec.type === 'graph' ? '📈' : sec.type === 'alert' ? '🚦' : '📋';
    map[id] = {
      label: `${icon} ${sec.title || 'หัวข้อ'}`,
      custom: true, type: sec.type,
      build: () => (sec.type === 'graph' ? customGraphBox(id, sec)
                  : sec.type === 'alert' ? customAlertBox(id, sec)
                  : customListBox(id, sec)),
    };
  }
  return map;
}

function summaryOrder(d) {
  const sections = getSections(d);
  const saved = (d.display && d.display.order) || [];
  const known = saved.filter((k) => sections[k]);
  // ต่อด้วย section ที่ยังไม่เคยจัด (built-in defaults + custom ที่เพิ่งเพิ่ม)
  const rest = [...SUMMARY_DEFAULT_ORDER, ...Object.keys(sections)]
    .filter((k) => sections[k] && !known.includes(k));
  return [...new Set([...known, ...rest])];
}

function renderSummary(root) {
  const d = PET.data || {};
  const hidden = (d.display && d.display.hidden) || [];

  const bar = document.createElement('div');
  bar.className = 'edit-bar';
  bar.style.justifyContent = 'flex-end';
  if (ROLE.canEdit) {
    bar.innerHTML = '<a class="sum-edit-toggle" id="tgSummaryCfg" style="margin:0">⚙️ ปรับหน้าสรุป</a>';
  }
  root.appendChild(bar);

  const cfgHolder = document.createElement('div');
  cfgHolder.id = 'summaryCfg';
  root.appendChild(cfgHolder);

  const wrap = document.createElement('div');
  wrap.className = 'stack';

  const sections = getSections(d);
  summaryOrder(d).forEach((key) => {
    if (hidden.includes(key) || !sections[key]) return;
    const el = sections[key].build(d);
    // ดูอย่างเดียว: ซ่อนกล่องที่ว่างเปล่า · แก้ได้: โชว์เพื่อกดเพิ่ม (ยกเว้น section ที่โปรไฟล์ไม่มีเลย)
    if (el) wrap.appendChild(el);
  });

  if (!wrap.children.length) wrap.innerHTML = '<div class="empty">ยังไม่มีข้อมูลสรุปสำหรับน้องตัวนี้</div>';
  root.appendChild(wrap);

  if (ROLE.canEdit) {
    document.getElementById('tgSummaryCfg').onclick = () => toggleSummaryCfg(d);
  }
}

let SUMMARY_CFG_OPEN = false;
function toggleSummaryCfg(d) {
  SUMMARY_CFG_OPEN = !SUMMARY_CFG_OPEN;
  const holder = document.getElementById('summaryCfg');
  if (!SUMMARY_CFG_OPEN) { holder.innerHTML = ''; return; }

  const sections = getSections(d);
  const hidden = new Set((d.display && d.display.hidden) || []);
  let curOrder = summaryOrder(d);
  const delCustom = new Set();     // custom id ที่จะลบตอนบันทึก
  const delTemplate = new Set();   // เทมเพลต (leuco/tumor) ที่จะลบ + ล้างข้อมูลตอนบันทึก

  // ลบได้: หัวข้อที่เพิ่มเอง (custom) และเทมเพลต (leuco/tumor) — core (danger/watch) ลบไม่ได้
  const canDelete = (key) => !!sections[key] && (sections[key].custom || key in SUMMARY_TEMPLATES);

  const rowHTML = (key, i) => {
    const sec = sections[key]; if (!sec) return '';
    return `<div class="cfg-row" data-key="${key}">
      <label style="display:flex;align-items:center;gap:10px;flex:1;margin:0;cursor:pointer;min-width:0">
        <input type="checkbox" ${hidden.has(key) ? '' : 'checked'} data-vis="${key}">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sec.label}</span>
      </label>
      <span style="display:flex;gap:4px">
        <button class="btn-ghost cfg-up" data-i="${i}" ${i === 0 ? 'disabled' : ''} style="padding:4px 9px">↑</button>
        <button class="btn-ghost cfg-dn" data-i="${i}" ${i === curOrder.length - 1 ? 'disabled' : ''} style="padding:4px 9px">↓</button>
        ${canDelete(key)
          ? `<button class="btn-ghost cfg-del" data-key="${key}" style="padding:4px 9px;border-color:var(--red);color:var(--red)">🗑</button>`
          : `<button class="btn-ghost" style="padding:4px 9px;visibility:hidden" tabindex="-1" aria-hidden="true">🗑</button>`}
      </span>
    </div>`;
  };


  holder.innerHTML = `
    <div class="edit-form">
      <h3>⚙️ ปรับหน้าสรุป</h3>
      <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px">ติ๊กเพื่อแสดง/ซ่อน · ลูกศรจัดลำดับ · 🗑 ลบหัวข้อที่เพิ่มเอง</p>
      <div id="cfgRows"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn-ghost" id="cfgAddList">➕ เพิ่มหัวข้อแบบลิสต์</button>
        <button class="btn-ghost" id="cfgAddGraph">➕ เพิ่มหัวข้อแบบกราฟ</button>
        <button class="btn-ghost" id="cfgAddAlert">🚦 เพิ่มไฟเตือนจากค่าผลเลือด</button>
      </div>
      <div class="btns"><button class="btn" id="cfgSave">บันทึก</button>
        <button class="btn-ghost" id="cfgCancel">ปิด</button></div>
      <div class="saving" id="cfgMsg" style="margin-top:8px"></div>
    </div>`;

  const rowsEl = holder.querySelector('#cfgRows');
  const rerenderRows = () => {
    const checked = {};
    holder.querySelectorAll('[data-vis]').forEach((c) => { checked[c.dataset.vis] = c.checked; });
    rowsEl.innerHTML = curOrder.map(rowHTML).join('');
    // คืนค่า checkbox
    holder.querySelectorAll('[data-vis]').forEach((c) => { if (c.dataset.vis in checked) c.checked = checked[c.dataset.vis]; });
    wireCfgBtns();
  };
  const wireCfgBtns = () => {
    holder.querySelectorAll('.cfg-up').forEach((b) => b.onclick = () => {
      const i = Number(b.dataset.i); [curOrder[i - 1], curOrder[i]] = [curOrder[i], curOrder[i - 1]]; rerenderRows();
    });
    holder.querySelectorAll('.cfg-dn').forEach((b) => b.onclick = () => {
      const i = Number(b.dataset.i); [curOrder[i + 1], curOrder[i]] = [curOrder[i], curOrder[i + 1]]; rerenderRows();
    });
    holder.querySelectorAll('.cfg-del').forEach((b) => b.onclick = async () => {
      const key = b.dataset.key;
      if (!await TC.confirm(`ลบหัวข้อ "${(sections[key] || {}).label || ''}" ทิ้ง? (ข้อมูลในหัวข้อนี้จะหายด้วย)`)) return;
      if (key in SUMMARY_TEMPLATES) delTemplate.add(key); else delCustom.add(key);
      curOrder = curOrder.filter((k) => k !== key);
      rerenderRows();
    });
  };
  rerenderRows();

  // เพิ่มหัวข้อใหม่ (custom) — บันทึกทันทีแล้วเปิด cfg ใหม่
  const addCustom = async (type) => {
    const title = await TC.prompt(type === 'graph' ? 'ชื่อหัวข้อกราฟ (เช่น น้ำหนัก, ขนาดก้อน)' : 'ชื่อหัวข้อลิสต์ (เช่น สิ่งที่หมอสั่ง)');
    if (!title || !title.trim()) return;
    const id = 'c_' + Math.random().toString(36).slice(2, 8);
    const custom = JSON.parse(JSON.stringify(d.custom || {}));
    custom[id] = { type, title: title.trim(), unit: '', items: [] };
    try {
      PET.data = await TC.setPetPath(PET.id, ['custom'], custom);
      SUMMARY_CFG_OPEN = false;
      showTab('summary');
      setTimeout(() => document.getElementById('tgSummaryCfg')?.click(), 30);
    } catch (e) { document.getElementById('cfgMsg').textContent = e.message; }
  };
  document.getElementById('cfgAddList').onclick = () => addCustom('list');
  document.getElementById('cfgAddGraph').onclick = () => addCustom('graph');

  // เพิ่มไฟเตือนจากค่าผลเลือด — สร้างโครงเปล่าแล้วเปิดฟอร์มตั้งเกณฑ์ทันที
  document.getElementById('cfgAddAlert').onclick = async () => {
    const title = await TC.prompt('ชื่อหัวข้อไฟเตือน (เช่น เกณฑ์ฉีด Leuco Plus, ระวังค่าตับ)');
    if (!title || !title.trim()) return;
    const id = 'c_' + Math.random().toString(36).slice(2, 8);
    const custom = JSON.parse(JSON.stringify(d.custom || {}));
    custom[id] = { type: 'alert', title: title.trim(), sourceKey: '', direction: 'below', danger: '', warn: '', rules: [] };
    try {
      PET.data = await TC.setPetPath(PET.id, ['custom'], custom);
      SUMMARY_CFG_OPEN = false;
      showTab('summary');
      setTimeout(() => editCustomAlert(id), 40);   // เปิดฟอร์มตั้งเกณฑ์ให้เลือกค่าผลเลือดเลย
    } catch (e) { document.getElementById('cfgMsg').textContent = e.message; }
  };

  document.getElementById('cfgCancel').onclick = () => { SUMMARY_CFG_OPEN = false; holder.innerHTML = ''; };
  document.getElementById('cfgSave').onclick = async () => {
    const newHidden = [...holder.querySelectorAll('[data-vis]')].filter((c) => !c.checked).map((c) => c.dataset.vis);
    const display = JSON.parse(JSON.stringify(d.display || {}));
    display.hidden = newHidden;
    display.order = curOrder;
    // ลบเทมเพลตที่กด 🗑: ถอดออกจาก builtins (ล้างข้อมูลด้านล่างอีกที)
    if (delTemplate.size) {
      display.builtins = ((display.builtins) || []).filter((k) => !delTemplate.has(k));
    }
    try {
      // ลบ custom section ที่กด 🗑
      if (delCustom.size) {
        const custom = JSON.parse(JSON.stringify(d.custom || {}));
        delCustom.forEach((k) => delete custom[k]);
        PET.data = await TC.setPetPath(PET.id, ['custom'], custom);
      }
      // ล้างข้อมูลของเทมเพลตที่ลบ (leucoPlus → null · vitals.liverTumor → [])
      for (const k of delTemplate) {
        const t = SUMMARY_TEMPLATES[k];
        PET.data = await TC.setPetPath(PET.id, t.clearPath, t.clearValue);
      }
      PET.data = await TC.setPetPath(PET.id, ['display'], display);
      SUMMARY_CFG_OPEN = false;
      showTab('summary');
    } catch (e) { document.getElementById('cfgMsg').textContent = e.message; }
  };
}

/* ---- กล่อง custom แบบลิสต์ (เพิ่มเอง) ---- */
function customListBox(id, sec) {
  const editing = SUM_EDIT['cust_' + id];
  const items = sec.items || [];
  const el = document.createElement('div');
  el.className = 'watch-box';
  el.innerHTML = `
    <div class="edit-bar" style="margin-bottom:6px">
      <span class="title" style="margin:0">📋 ${TC.esc(sec.title)}</span>
      ${ROLE.canEdit ? `<a class="sum-edit-toggle" id="tgc-${id}">${editing ? '✓ เสร็จ' : '✏️ จัดการ'}</a>` : ''}
    </div>
    ${items.length ? `<ul>${items.map((t, i) => `<li>${TC.esc(t)}${editing ? `
      <span class="inline-actions"><a class="act-edit" data-e="${i}">แก้</a><a class="act-del" data-d="${i}">ลบ</a></span>` : ''}</li>`).join('')}</ul>`
      : '<div class="empty">ยังไม่มีรายการ</div>'}
    ${editing ? `<button class="btn-ghost" id="addc-${id}" style="margin-top:8px">➕ เพิ่มรายการ</button>` : ''}
    <div id="formc-${id}"></div>`;

  if (ROLE.canEdit) setTimeout(() => {
    el.querySelector(`#tgc-${id}`).onclick = () => { SUM_EDIT['cust_' + id] = !editing; showTab('summary'); };
    const add = el.querySelector(`#addc-${id}`);
    if (add) add.onclick = () => editCustomList(id, null);
    el.querySelectorAll('[data-e]').forEach((a) => a.onclick = () => editCustomList(id, Number(a.dataset.e)));
    el.querySelectorAll('[data-d]').forEach((a) => a.onclick = () => delCustomList(id, Number(a.dataset.d)));
  }, 0);
  return el;
}

function editCustomList(id, idx) {
  const items = ((PET.data.custom || {})[id] || {}).items || [];
  openForm(`formc-${id}`, {
    title: idx === null ? '➕ เพิ่มรายการ' : '✏️ แก้',
    fields: [{ key: 'text', label: 'ข้อความ', type: 'textarea' }],
    values: { text: idx === null ? '' : items[idx] },
    onSave: async (v) => {
      if (!v.text) throw new Error('กรุณากรอกข้อความ');
      const arr = [...items];
      if (idx === null) arr.push(v.text); else arr[idx] = v.text;
      PET.data = await TC.setPetPath(PET.id, ['custom', id, 'items'], arr);
      showTab('summary');
    },
  });
}
async function delCustomList(id, idx) {
  const items = ((PET.data.custom || {})[id] || {}).items || [];
  if (!await TC.confirm(`ลบ "${items[idx]}" ?`)) return;
  const arr = [...items]; arr.splice(idx, 1);
  try { PET.data = await TC.setPetPath(PET.id, ['custom', id, 'items'], arr); showTab('summary'); }
  catch (e) { alert(e.message); }
}

/* ---- กล่อง custom แบบกราฟ (เพิ่มเอง) — โครงเดียวกับก้อนในตับ ---- */
function customGraphBox(id, sec) {
  return genericGraphBox({
    title: sec.title, unit: sec.unit || '', rows: sec.items || [],
    editKey: 'cust_' + id,
    savePath: ['custom', id, 'items'],
  });
}

/* ---- ไฟเตือนจากค่าผลเลือด (เพิ่มเอง) — เลือกได้ว่าผูกกับค่าตรวจตัวไหน + ตั้งเกณฑ์เอง ----
 *  โครงเดียวกับ Leuco Plus แต่ไม่ล็อกที่ WBC · sec = {type:'alert', title, sourceKey, sourceLabel, direction, danger, warn, rules[]}
 *  direction: 'below' = ค่ายิ่งต่ำยิ่งอันตราย · 'above' = ค่ายิ่งสูงยิ่งอันตราย */

/** รวมค่าผลเลือดทั้งหมดของน้องตัวนี้ (จาก labConfig + ที่เคยกรอกจริง) → [{value:key, label, group}]
 *  group = ชื่อหมวด (labPanels) เพื่อจัดกลุ่มใน dropdown ไม่ให้เป็นลิสต์ยาวพรืด */
function labValueOptions(d) {
  const panelName = {};
  (d.labPanels || []).forEach((p) => { panelName[p.id] = p.name || p.id; });
  const seen = new Map();   // key → {label, group}
  (d.labConfig || []).forEach((c) => {
    if (c.key && !seen.has(c.key)) seen.set(c.key, { label: c.label || c.key, group: panelName[c.panel] || 'อื่นๆ' });
  });
  (d.labs || []).forEach((l) => Object.keys(l.values || {}).forEach((k) => {
    if (!seen.has(k)) seen.set(k, { label: k, group: 'อื่นๆ' });
  }));
  return [...seen.entries()].map(([value, info]) => ({ value, label: info.label, group: info.group }));
}

function customAlertBox(id, sec) {
  const d = PET.data || {};
  const key = sec.sourceKey || '';
  const label = sec.sourceLabel || (labValueOptions(d).find((o) => o.value === key) || {}).label || key;
  const dir = sec.direction || 'below';
  const danger = (sec.danger !== '' && sec.danger != null) ? Number(sec.danger) : null;
  const warn = (sec.warn !== '' && sec.warn != null) ? Number(sec.warn) : null;

  const labs = key ? (d.labs || []).filter((l) => l.values && l.values[key] != null) : [];
  labs.sort((a, b) => new Date(b.date) - new Date(a.date));
  const latest = labs[0];

  let cls = 'lp-gray', verdict, detail = '';
  if (!key) {
    verdict = 'ยังไม่ได้เลือกค่าผลเลือด — กด ✏️ ตั้งเกณฑ์';
  } else if (!latest) {
    verdict = `ยังไม่มีผล ${label}`;
  } else {
    const val = parseLabVal(latest.values[key]).n;   // รองรับ comma หลักพัน + ค่า < >
    if (val == null) {
      verdict = `ผล ${label} ล่าสุดอ่านเป็นตัวเลขไม่ได้ (${TC.esc(String(latest.values[key]))})`;
      detail = `ผลล่าสุด ${TC.thDate(latest.date)}`;
    } else {
      const cmp = dir === 'below' ? 'ต่ำกว่า' : 'สูงกว่า';
      const hit = (th) => th != null && (dir === 'below' ? val < th : val > th);
      if (hit(danger)) { cls = 'lp-red'; verdict = `🔴 ${label} ${val.toLocaleString()} — ${cmp} ${danger.toLocaleString()}`; }
      else if (hit(warn)) { cls = 'lp-yellow'; verdict = `🟡 ${label} ${val.toLocaleString()} — ${cmp} ${warn.toLocaleString()} ควรเฝ้าระวัง`; }
      else { cls = 'lp-green'; verdict = `🟢 ${label} ${val.toLocaleString()} — อยู่ในเกณฑ์`; }
      detail = `ผลล่าสุด ${TC.thDate(latest.date)}`;
    }
  }

  const el = document.createElement('div');
  el.className = `leuco-box ${cls}`;
  el.innerHTML = `
    <div class="edit-bar" style="margin-bottom:8px">
      <div class="lp-head" style="margin:0">🚦 ${TC.esc(sec.title || 'ไฟเตือนจากค่าผลเลือด')}</div>
      ${ROLE.canEdit ? '<a class="sum-edit-toggle" id="editAlert-' + id + '" style="color:var(--gold)">✏️ ตั้งเกณฑ์</a>' : ''}
    </div>
    <div class="lp-verdict">${TC.esc(verdict)}</div>
    ${detail ? `<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;font-family:var(--mono)">${TC.esc(detail)}</div>` : ''}
    ${(sec.rules || []).length ? `<ul class="lp-rules">${sec.rules.map((r) => `<li>${TC.esc(r)}</li>`).join('')}</ul>` : ''}
    <div id="formc-${id}"></div>`;
  if (ROLE.canEdit) setTimeout(() => {
    el.querySelector(`#editAlert-${id}`).onclick = () => editCustomAlert(id);
  }, 0);
  return el;
}

function editCustomAlert(id) {
  const sec = (PET.data.custom || {})[id] || {};
  const opts = [{ value: '', label: '— เลือกค่าผลเลือด —' }, ...labValueOptions(PET.data)];
  openForm(`formc-${id}`, {

      { key: 'title', label: 'ชื่อหัวข้อ', type: 'text', placeholder: 'เช่น เกณฑ์ฉีด Leuco Plus' },

        { value: 'below', label: 'ค่ายิ่งต่ำยิ่งอันตราย (เช่น WBC)' },
        { value: 'above', label: 'ค่ายิ่งสูงยิ่งอันตราย (เช่น ค่าตับ/ไต)' }] },
      { key: 'danger', label: '🔴 เกณฑ์อันตราย (เกินนี้ = แดง)', type: 'text', placeholder: 'เช่น 4000' },

      { key: 'rules', label: 'หมายเหตุ/คำแนะนำ (บรรทัดละข้อ)', type: 'textarea', placeholder: 'เช่น ต่ำกว่า 4,000 แม้อาการปกติ → ฉีด' },
    ],
    values: {

    onSave: async (v) => {
      if (!v.title) throw new Error('กรุณาตั้งชื่อหัวข้อ');
      if (v.danger && Number.isNaN(Number(v.danger))) throw new Error('เกณฑ์ 🔴 ต้องเป็นตัวเลข');
      if (v.warn && Number.isNaN(Number(v.warn))) throw new Error('เกณฑ์ 🟡 ต้องเป็นตัวเลข');
      const opt = opts.find((o) => o.value === v.sourceKey);
      const secNew = {
        ...(PET.data.custom || {})[id], type: 'alert', title: v.title,
        sourceKey: v.sourceKey, sourceLabel: (opt && opt.value) ? opt.label : '',
        direction: v.direction, danger: v.danger, warn: v.warn,
        rules: v.rules.split('\n').map((s) => s.trim()).filter(Boolean),
      };
      PET.data = await TC.setPetPath(PET.id, ['custom', id], secNew);

    },
  });
}

/* ---- ไฟเตือน Leuco Plus (เทียบ WBC ดิบ 🔴<4000 / 🟡4000-4499 / 🟢≥4500) ---- */
function leucoBox(d) {
  const lp = d.leucoPlus || {};   // เปิดเทมเพลตแต่ยังไม่ตั้งเกณฑ์ → ใช้ค่าเริ่มต้น กด ✏️ แก้เกณฑ์ ทีหลัง
  const labs = (d.labs || []).filter((l) => l.values && l.values.wbc != null);
  labs.sort((a, b) => new Date(b.date) - new Date(a.date));
  const latest = labs[0];

  let cls = 'lp-gray', verdict = 'ยังไม่มีผล WBC', detail = '';

  let wbc = latest ? parseLabVal(latest.values.wbc).n : null;   // รองรับ comma หลักพัน
  if (latest && wbc == null) { verdict = 'ผล WBC ล่าสุดอ่านเป็นตัวเลขไม่ได้'; }
  else if (latest) {
    if (lp.wbcInThousands) wbc = wbc * 1000;   // เผื่อโปรไฟล์ที่เก็บเป็นพัน
    const always = lp.alwaysBelow ?? 4000;
    const withSym = lp.withSymptomsBelow ?? 4500;

    if (wbc < always) { cls = 'lp-red'; verdict = `🔴 WBC ${wbc.toLocaleString()} — ต่ำกว่า ${always.toLocaleString()} ควรฉีด Leuco Plus แม้อาการปกติ`; }
    else if (wbc < withSym) { cls = 'lp-yellow'; verdict = `🟡 WBC ${wbc.toLocaleString()} — ต่ำกว่า ${withSym.toLocaleString()} ถ้ามีอาการอื่นร่วมด้วยควรฉีด`; }
    else { cls = 'lp-green'; verdict = `🟢 WBC ${wbc.toLocaleString()} — อยู่ในเกณฑ์ ยังไม่ต้องฉีด`; }

    detail = `ผลล่าสุด ${TC.thDate(latest.date)}`;
  }

  const el = document.createElement('div');
  el.className = `leuco-box ${cls}`;
  el.innerHTML = `
    <div class="edit-bar" style="margin-bottom:8px">
      <div class="lp-head" style="margin:0">💉 ${TC.esc(lp.title || 'เกณฑ์ฉีด Leuco Plus')}</div>
      ${ROLE.canEdit ? '<a class="sum-edit-toggle" id="editLeuco" style="color:var(--gold)">✏️ แก้เกณฑ์</a>' : ''}
    </div>
    <div class="lp-verdict">${TC.esc(verdict)}</div>
    ${detail ? `<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;font-family:var(--mono)">${TC.esc(detail)}</div>` : ''}
    ${(lp.rules || []).length ? `<ul class="lp-rules">${lp.rules.map((r) => `<li>${TC.esc(r)}</li>`).join('')}</ul>` : ''}
    <div id="leucoForm"></div>
  `;
  if (ROLE.canEdit) setTimeout(() => {
    el.querySelector('#editLeuco').onclick = () => editLeuco();
  }, 0);
  return el;
}

function editLeuco() {
  const lp = PET.data.leucoPlus || {};
  openForm('leucoForm', {
    title: '✏️ แก้เกณฑ์ฉีด Leuco Plus',
    fields: [
      { key: 'title', label: 'ชื่อหัวข้อ', type: 'text', placeholder: 'เกณฑ์ฉีด Leuco Plus' },
      { key: 'alwaysBelow', label: 'WBC ต่ำกว่าเท่าไร → ฉีดแม้อาการปกติ (🔴)', type: 'text', placeholder: '4000' },
      { key: 'withSymptomsBelow', label: 'WBC ต่ำกว่าเท่าไร + มีอาการ → ฉีด (🟡)', type: 'text', placeholder: '4500' },
      { key: 'rules', label: 'กฎ/หมายเหตุ (บรรทัดละข้อ)', type: 'textarea', placeholder: 'WBC ต่ำกว่า 4,500 + มีอาการอื่น → ฉีด\nWBC ต่ำกว่า 4,000 แม้อาการปกติ → ฉีด' },
    ],
    values: {
      title: lp.title || '', alwaysBelow: lp.alwaysBelow ?? '', withSymptomsBelow: lp.withSymptomsBelow ?? '',
      rules: (lp.rules || []).join('\n'),
    },
    onSave: async (v) => {
      const a = Number(v.alwaysBelow), w = Number(v.withSymptomsBelow);
      if (v.alwaysBelow && Number.isNaN(a)) throw new Error('ค่า 🔴 ต้องเป็นตัวเลข');
      if (v.withSymptomsBelow && Number.isNaN(w)) throw new Error('ค่า 🟡 ต้องเป็นตัวเลข');
      const lpNew = JSON.parse(JSON.stringify(lp));
      lpNew.title = v.title || 'เกณฑ์ฉีด Leuco Plus';
      if (v.alwaysBelow !== '') lpNew.alwaysBelow = a;
      if (v.withSymptomsBelow !== '') lpNew.withSymptomsBelow = w;
      lpNew.rules = v.rules.split('\n').map((s) => s.trim()).filter(Boolean);
      PET.data = await TC.setPetPath(PET.id, ['leucoPlus'], lpNew);
      showTab('summary');
    },
  });
}

// สถานะโหมดจัดการของแต่ละกล่องในแท็บสรุป (สลับด้วยปุ่ม ✏️ จัดการ)
let SUM_EDIT = { danger: false, watch: false, tumor: false };

/* ---- กล่องแดง: สัญญาณต้องไปหาหมอทันที (liverFailure + wbc) ---- */
function dangerBox(ds) {
  const editing = SUM_EDIT.danger;
  const el = document.createElement('div');
  el.className = 'alert-box';   // ไม่ใส่ form เป็น flex child แล้ว → ไม่บีบเนื้อหา
  const rows = [
    ...(ds.liverFailure || []).map((t, i) => ({ t, src: 'liverFailure', i })),
    ...(ds.wbc || []).map((t, i) => ({ t, src: 'wbc', i })),
  ];
  el.innerHTML = `
    <div class="icon">🚨</div>
    <div style="flex:1;min-width:0">
      <div class="edit-bar" style="margin-bottom:6px">
        <span class="title" style="margin:0">สัญญาณต้องไปหาหมอทันที</span>
        ${ROLE.canEdit ? `<a class="sum-edit-toggle" id="tgDanger">${editing ? '✓ เสร็จ' : '✏️ จัดการ'}</a>` : ''}
      </div>
      ${rows.length ? `<ul>${rows.map((r) => `<li>${TC.esc(r.t)}${editing ? `
        <span class="inline-actions"><a class="act-edit" data-e="${r.src}:${r.i}">แก้</a><a class="act-del" data-d="${r.src}:${r.i}">ลบ</a></span>` : ''}</li>`).join('')}</ul>`
        : '<div class="empty">ยังไม่มีรายการ</div>'}
      ${(ds.nosebleed || editing) ? `<div style="margin-top:10px;font-size:12.5px;color:#8a2b2b" class="pre-line"><b>เลือดกำเดา — ปฐมพยาบาล:</b>${editing ? ' <a class="act-edit" id="editNosebleed">แก้</a>' : ''}${ds.nosebleed ? '\n' + TC.esc(ds.nosebleed) : (editing ? '\n(ยังไม่มีข้อความ)' : '')}</div>
      <div id="nosebleedForm"></div>` : ''}
      ${editing ? '<button class="btn-ghost" id="btnAddDanger" style="margin-top:12px">➕ เพิ่มรายการ</button>' : ''}
      <div id="dangerForm"></div>
    </div>`;

  if (ROLE.canEdit) setTimeout(() => {
    el.querySelector('#tgDanger').onclick = () => { SUM_EDIT.danger = !SUM_EDIT.danger; showTab('summary'); };
    const add = el.querySelector('#btnAddDanger');
    if (add) add.onclick = () => editDanger(null, null);
    const nb = el.querySelector('#editNosebleed');
    if (nb) nb.onclick = () => editNosebleed();
    el.querySelectorAll('[data-e]').forEach((a) => a.onclick = () => { const [s, i] = a.dataset.e.split(':'); editDanger(s, Number(i)); });
    el.querySelectorAll('[data-d]').forEach((a) => a.onclick = () => { const [s, i] = a.dataset.d.split(':'); delDanger(s, Number(i)); });
  }, 0);
  return el;
}

function editNosebleed() {
  openForm('nosebleedForm', {
    title: '✏️ แก้ข้อความปฐมพยาบาลเลือดกำเดา',
    fields: [{ key: 'text', label: 'ขั้นตอนปฐมพยาบาล (ขึ้นหลายบรรทัดได้)', type: 'textarea',
      placeholder: 'เช่น เลือดกำเดาไม่หยุดใน 30 นาที: หักหลอดยา ดูดยา 1cc + น้ำ 2cc...' }],
    values: { text: (PET.data.dangerSigns || {}).nosebleed || '' },
    onSave: async (v) => {
      const dsNew = JSON.parse(JSON.stringify(PET.data.dangerSigns || {}));
      dsNew.nosebleed = v.text;
      PET.data = await TC.setPetPath(PET.id, ['dangerSigns'], dsNew);
      showTab('summary');
    },
  });
}

function editDanger(src, idx) {
  const ds = PET.data.dangerSigns || {};
  const cur = src ? (ds[src] || [])[idx] : '';
  openForm('dangerForm', {
    title: src ? '✏️ แก้สัญญาณอันตราย' : '➕ เพิ่มสัญญาณอันตราย',
    fields: [
      { key: 'group', label: 'กลุ่ม', type: 'select', options: [
        { value: 'liverFailure', label: 'ตับวาย' }, { value: 'wbc', label: 'เม็ดเลือดขาว (WBC)' }] },
      { key: 'text', label: 'ข้อความ', type: 'textarea', placeholder: 'เช่น BUN ต่ำมาก (ห้ามแตะ 10)' },
    ],
    values: { group: src || 'liverFailure', text: cur },
    onSave: async (v) => {
      if (!v.text) throw new Error('กรุณากรอกข้อความ');
      const data = PET.data;
      const dsNew = JSON.parse(JSON.stringify(data.dangerSigns || {}));
      dsNew.liverFailure = dsNew.liverFailure || []; dsNew.wbc = dsNew.wbc || [];
      if (src) dsNew[src].splice(idx, 1);            // ลบของเดิม (เผื่อย้ายกลุ่ม)
      dsNew[v.group] = dsNew[v.group] || [];
      dsNew[v.group].push(v.text);
      PET.data = await TC.setPetPath(PET.id, ['dangerSigns'], dsNew);
      showTab('summary');
    },
  });
}

async function delDanger(src, idx) {
  const ds = PET.data.dangerSigns || {};
  if (!await TC.confirm(`ลบ "${(ds[src] || [])[idx]}" ?`)) return;
  const dsNew = JSON.parse(JSON.stringify(ds));
  dsNew[src].splice(idx, 1);
  try { PET.data = await TC.setPetPath(PET.id, ['dangerSigns'], dsNew); showTab('summary'); }
  catch (e) { alert(e.message); }
}

async function delWatch(idx) {

  return genericGraphBox({
    title: 'ขนาดก้อนในตับ', unit: 'cm', rows: rows || [],
    editKey: 'tumor', savePath: ['vitals', 'liverTumor'],
  });
}

/* ---- กล่องกราฟทั่วไป (ก้อนในตับ + custom graph ใช้ร่วมกัน) ----
 * opts: { title, unit, rows:[{date,size,note,alert}], editKey, savePath }
 */
function genericGraphBox(opts) {
  const { title, unit, rows, editKey, savePath } = opts;
  const editing = SUM_EDIT[editKey];
  const el = document.createElement('div');
  el.className = 'chart-wrap';
  const uid = editKey.replace(/[^a-z0-9]/gi, '');
  el.innerHTML = `
    <div class="edit-bar">
      <span class="section-label" style="margin:0">📈 ${TC.esc(title)}${unit ? ` (${TC.esc(unit)})` : ''}</span>
      ${ROLE.canEdit ? `<a class="sum-edit-toggle" id="tg-${uid}">${editing ? '✓ เสร็จ' : '✏️ จัดการ'}</a>` : ''}
    </div>
    <div id="form-${uid}"></div>
    <div class="tumor-box"><canvas></canvas></div>
    <div class="tumor-note" id="notes-${uid}"></div>
    ${editing ? `<button class="btn-ghost" id="add-${uid}" style="margin-top:12px">➕ เพิ่มบันทึก</button><div id="list-${uid}" style="margin-top:10px"></div>` : ''}`;

  if (ROLE.canEdit) setTimeout(() => {
    el.querySelector(`#tg-${uid}`).onclick = () => { SUM_EDIT[editKey] = !editing; showTab('summary'); };
    if (!editing) return;
    el.querySelector(`#add-${uid}`).onclick = () => editGraphEntry(savePath, uid, null);
    const sorted = rows.map((r, i) => ({ ...r, _i: i })).sort((a, b) => new Date(b.date) - new Date(a.date));
    el.querySelector(`#list-${uid}`).innerHTML = sorted.map((r) => `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:6px;background:var(--surface2)">
        <span style="font-size:12.5px">${r.alert ? '⚠️ ' : ''}<b>${TC.thDateShort(r.date)}</b> · ${r.size != null ? r.size + (unit ? ' ' + unit : '') : '—'}${r.note ? ' · ' + TC.esc(r.note) : ''}</span>
        <span class="inline-actions" style="margin:0;white-space:nowrap">
          <a class="act-edit" data-e="${r._i}">แก้</a><a class="act-del" data-d="${r._i}">ลบ</a></span>
      </div>`).join('');
    el.querySelectorAll(`#list-${uid} [data-e]`).forEach((a) => a.onclick = () => editGraphEntry(savePath, uid, Number(a.dataset.e)));
    el.querySelectorAll(`#list-${uid} [data-d]`).forEach((a) => a.onclick = () => delGraphEntry(savePath, Number(a.dataset.d)));
  }, 0);

  const pts = rows.filter((r) => r.size != null).sort((a, b) => new Date(a.date) - new Date(b.date));
  setTimeout(() => {
    if (!pts.length) { el.querySelector('.tumor-box').innerHTML = '<div class="empty">ยังไม่มีค่าที่วัดได้</div>'; }
    else {
      new Chart(el.querySelector('canvas'), {
        type: 'line',
        data: { labels: pts.map((p) => TC.thDateShort(p.date)),
          datasets: [{ data: pts.map((p) => p.size),
            borderColor: '#5b86bf', backgroundColor: 'rgba(169,196,232,0.25)',
            pointBackgroundColor: pts.map((p) => (p.alert ? '#d96a6a' : '#5b86bf')),
            pointRadius: 4, tension: 0.3, fill: true }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { color: '#8c7f6f' }, grid: { color: '#efe0cd' } },
            x: { ticks: { color: '#8c7f6f', font: { size: 10 } }, grid: { display: false } } } },
      });
    }
    const notes = rows.filter((r) => r.note).slice(-3).reverse();
    el.querySelector(`#notes-${uid}`).innerHTML = notes
      .map((n) => `<div>${n.alert ? '⚠️ ' : '· '}<b>${TC.thDateShort(n.date)}</b> — ${TC.esc(n.note)}</div>`).join('');
  }, 0);

  return el;
}

// อ่าน/เขียนอาร์เรย์ที่ savePath (เช่น ['vitals','liverTumor'] หรือ ['custom','c_x','items'])
function readPath(path) {
  let cur = PET.data;
  for (const k of path) { cur = (cur || {})[k]; }
  return Array.isArray(cur) ? cur : [];
}

function editGraphEntry(savePath, uid, idx) {
  const rows = readPath(savePath);
  const cur = idx === null ? {} : rows[idx];
  openForm(`form-${uid}`, {
    title: idx === null ? '➕ เพิ่มบันทึก' : '✏️ แก้บันทึก',
    fields: [
      { key: 'date', label: 'วันที่', type: 'date' },
      { key: 'size', label: 'ค่า/ตัวเลข — เว้นว่างได้ถ้าไม่ได้วัด', type: 'text', placeholder: 'เช่น 1.4' },
      { key: 'note', label: 'หมายเหตุ', type: 'textarea' },
      { key: 'alert', label: 'ทำเครื่องหมายเตือน (⚠️)', type: 'select', options: [
        { value: '', label: 'ไม่' }, { value: '1', label: 'ใช่ — เน้นเป็นจุดเตือน' }] },
    ],
    values: { date: cur.date || '', size: cur.size ?? '', note: cur.note || '', alert: cur.alert ? '1' : '' },
    onSave: async (v) => {
      if (!v.date) throw new Error('กรุณาเลือกวันที่');
      const entry = { date: v.date, size: v.size === '' ? null : Number(v.size) };
      if (v.note) entry.note = v.note;
      if (v.alert) entry.alert = true;
      const arr = [...rows];
      if (idx === null) arr.push(entry); else arr[idx] = entry;
      arr.sort((a, b) => new Date(a.date) - new Date(b.date));
      PET.data = await TC.setPetPath(PET.id, savePath, arr);
      showTab('summary');
    },
  });
}

async function delGraphEntry(savePath, idx) {
  const rows = readPath(savePath);
  if (!await TC.confirm(`ลบบันทึก ${TC.thDateShort(rows[idx].date)} ?`)) return;
  const arr = [...rows]; arr.splice(idx, 1);
  try { PET.data = await TC.setPetPath(PET.id, savePath, arr); showTab('summary'); }
  catch (e) { alert(e.message); }
}
</script>
