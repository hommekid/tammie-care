<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard 🐾 · Tammie Care</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#fdf4eb">
<link rel="stylesheet" href="theme.css?v=41">
<style>
  .panel { display: none; }
  .panel.active { display: block; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .soon { text-align: center; padding: 44px 20px; color: var(--text-muted); font-family: var(--cute); }
  .soon .big { font-size: 34px; display: block; margin-bottom: 8px; }
  .tumor-note { font-size: 12px; color: var(--text-dim); margin-top: 10px; line-height: 1.6; }
  .tc-header > div:first-of-type { min-width: 0; }   /* ให้บล็อกชื่อใช้พื้นที่ได้เต็ม กันคำตัดบรรทัดถี่ */
  .name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }   /* ปุ่มอยู่บรรทัดเดียวกับชื่อ */
  .name-row h1 { margin: 0; }
  /* มือถือ: ปุ่มในหัวเหลือไอคอน (ซ่อนข้อความ) กันหัวแน่น + ชื่อเล็กลงนิด */
  @media (max-width: 560px) {
    .tc-header .lbl { display: none; }
    .tc-header h1 { font-size: 18px; }
    #timelineLink, #editProfileBtn { padding: 6px 9px; font-size: 16px; }
  }
</style>
</head>
<body>

<header class="tc-header">
  <a class="back" href="index.html">←</a>
  <img class="avatar" id="avatar" alt="" style="display:none">
  <div style="flex:1;min-width:0">
    <div class="name-row" id="nameRow">
      <h1 id="petName">กำลังโหลด...</h1>
      <a class="btn-ghost" id="timelineLink" href="#" style="text-decoration:none" title="รายงานสุขภาพตามช่วงเวลา (พิมพ์ PDF ไปหาหมอได้)">📄<span class="lbl"> รายงาน</span></a>
    </div>
    <div class="sub" id="petSub"></div>
    <div class="sub" id="petWeight" style="display:none;margin-top:2px"></div>
  </div>
  <span id="rolePill"></span>
</header>

<div class="dash-tabs" id="tabs"></div>

<div class="container" id="content">
  <div class="loading">กำลังโหลด...</div>
</div>

<footer>🐾 Tammie Care · <a href="index.html">หน้าแรก</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script src="config.js"></script>
<script src="lib.js?v=41"></script>
<script>
// แท็บตามลำดับเดิมของ V1 — Phase นี้ทำ "สรุป" ก่อน ที่เหลือทยอยพอร์ต
const TABS = [
  { key: 'summary',  label: '📋 สรุป' },
  { key: 'calendar', label: '🗓️ ปฏิทิน' },
  { key: 'labs',     label: '🧪 ผลเลือด' },
  { key: 'meds',     label: '💊 อาหารและยา' },
  { key: 'appts',    label: '📅 นัดหมาย' },
];

let PET = null;
let ROLE = { canEdit: false, isAdmin: false, role: null };

(async function main() {
  const user = await TC.requireAuth();
  if (!user) return;

  const id = new URLSearchParams(location.search).get('id');
  if (!id) { location.replace('index.html'); return; }

  ROLE = await TC.getMyRole();
  const role = ROLE;
  if (role.role === 'vet') {
    document.getElementById('rolePill').innerHTML =
      '<span class="pill pill-vet">🩺 ดูอย่างเดียว</span>';
  }

  try {
    PET = await TC.getPet(id);
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="loading">ไม่พบข้อมูล หรือคุณไม่มีสิทธิ์เข้าถึงสัตว์ตัวนี้</div>';
    document.getElementById('petName').textContent = 'เข้าถึงไม่ได้';
    return;
  }

  renderHeader();
  renderTabs();
  // มาจาก "✏️ แก้ข้อมูล" ในหน้าจัดการ → เปิดฟอร์มแก้โปรไฟล์เลย (ถ้าเป็น admin)
  if (new URLSearchParams(location.search).get('edit') === 'profile' && ROLE.isAdmin) {
    showTab('summary');
    openProfileEdit();
  } else {
    showTab('summary');
  }
})();

function renderHeader() {
  const d = PET.data || {}, prof = d.profile || {}, card = d.card || {};
  document.getElementById('petName').textContent = PET.name;
  document.getElementById('timelineLink').href = `timeline.html?id=${PET.id}`;

  const bits = [];
  if (card.nickname || prof.nickname) bits.push(card.nickname || prof.nickname);
  if (card.breed || prof.breed) bits.push(card.breed || prof.breed);
  const age = TC.ageText(card.birthDate || prof.birthDate);
  if (age) bits.push(`อายุ ${age}`);
  document.getElementById('petSub').textContent = bits.join(' · ');

  // น้ำหนักล่าสุด (optional) — โชว์เฉพาะเมื่อมีข้อมูลและไม่ได้ซ่อน section น้ำหนัก · แตะเพื่อบันทึกเร็ว
  const hidden = (d.display && d.display.hidden) || [];
  const wLatest = ((d.vitals && d.vitals.weight) || [])
    .filter((r) => r.size != null).sort((a, b) => new Date(b.date) - new Date(a.date))[0];
  const wEl = document.getElementById('petWeight');
  if (wLatest && !hidden.includes('weight')) {
    wEl.style.display = '';
    wEl.innerHTML = `⚖️ น้ำหนักล่าสุด ${wLatest.size} kg · ${TC.thDateShort(wLatest.date)}`
      + (ROLE.canEdit ? ' <span style="color:var(--sky)">✎ บันทึก</span>' : '');
    wEl.style.cursor = ROLE.canEdit ? 'pointer' : 'default';
    wEl.onclick = ROLE.canEdit ? logWeight : null;
  } else {
    wEl.style.display = 'none'; wEl.innerHTML = '';
  }

  const photo = card.photo || prof.photo;
  if (photo) {
    const img = document.getElementById('avatar');
    img.style.display = '';
    TC.fillImg(img, photo);
  }

  // ปุ่มแก้โปรไฟล์ (เฉพาะ admin) — ใส่ครั้งเดียว
  if (ROLE.isAdmin && !document.getElementById('editProfileBtn')) {
    const b = document.createElement('a');
    b.id = 'editProfileBtn';
    b.className = 'sum-edit-toggle';
    b.style.cursor = 'pointer';
    b.innerHTML = '✏️<span class="lbl"> โปรไฟล์</span>';
    b.onclick = openProfileEdit;
    document.getElementById('nameRow').appendChild(b);   // อยู่บรรทัดเดียวกับชื่อ
  }
}

/* ---------- แก้โปรไฟล์/การ์ดสัตว์ ---------- */
let PROFILE_PHOTO = null;   // File ใหม่ที่เลือก (ยังไม่อัป)

function openProfileEdit() {
  const d = PET.data || {}, prof = d.profile || {}, card = d.card || {};
  const val = (k) => card[k] ?? prof[k] ?? '';
  PROFILE_PHOTO = null;

  const c = document.getElementById('content');
  document.querySelectorAll('.dtab').forEach((b) => b.classList.remove('active'));
  c.innerHTML = `
    <div class="edit-form" style="max-width:520px">
      <h3>✏️ แก้โปรไฟล์น้อง</h3>
      <div class="fld"><label>ชื่อ</label><input type="text" id="pfName" value="${TC.esc(PET.name || val('name'))}"></div>
      <div class="fld"><label>ชื่อเล่น</label><input type="text" id="pfNick" value="${TC.esc(val('nickname'))}"></div>
      <div class="fld"><label>อีโมจิ (ใช้ตอนไม่มีรูป)</label><input type="text" id="pfEmoji" value="${TC.esc(val('emoji') || '🐾')}" maxlength="4"></div>
      <div class="fld"><label>พันธุ์</label><input type="text" id="pfBreed" value="${TC.esc(val('breed'))}"></div>
      <div class="fld"><label>วันเกิด</label><input type="date" id="pfBirth" value="${TC.esc(val('birthDate'))}"></div>
      <div class="fld"><label>สถานะ</label>
        <select id="pfStatus">
          <option value="ok" ${(card.status||'ok')==='ok'?'selected':''}>✓ ปกติ</option>
          <option value="watch" ${card.status==='watch'?'selected':''}>⚠️ เฝ้าระวัง</option>
          <option value="alert" ${card.status==='alert'?'selected':''}>🚨 ต้องดูแล</option>
        </select></div>
      <div class="fld"><label>ข้อความสถานะ (โชว์ใต้การ์ดหน้าแรก)</label>
        <input type="text" id="pfStatusNote" value="${TC.esc(card.statusNote || '')}"></div>
      <div class="fld"><label>รูปโปรไฟล์</label>
        <div class="thumb-row" id="pfPhotoRow"></div>
        <input type="file" id="pfPhoto" accept="image/*" style="margin-top:6px"></div>
      <div class="btns">
        <button class="btn" id="pfSave">บันทึก</button>
        <button class="btn-ghost" id="pfCancel">ยกเลิก</button>
      </div>
      <div class="saving" id="pfMsg" style="margin-top:8px"></div>
    </div>`;

  // แสดงรูปปัจจุบัน
  const curPhoto = card.photo || prof.photo;
  const drawPhoto = async () => {
    const row = document.getElementById('pfPhotoRow');
    row.innerHTML = '';
    if (PROFILE_PHOTO) {
      row.innerHTML = `<div class="th"><img src="${URL.createObjectURL(PROFILE_PHOTO)}" alt=""></div>`;
    } else if (curPhoto) {
      const url = await TC.signedUrl(curPhoto);
      if (url) row.innerHTML = `<div class="th"><img src="${url}" alt=""></div>`;
    }
  };
  drawPhoto();

  document.getElementById('pfPhoto').onchange = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      PROFILE_PHOTO = await openCropper(file);   // ครอปเป็นสี่เหลี่ยมจัตุรัสก่อน
      drawPhoto();
    } catch (_) { /* ยกเลิกการครอป */ }
  };
  document.getElementById('pfCancel').onclick = () => { renderTabs(); showTab('summary'); };
  document.getElementById('pfSave').onclick = saveProfile;
}

/* ---------- ครอปรูปเป็นสี่เหลี่ยมจัตุรัส (สำหรับรูปโปรไฟล์วงกลม) ---------- */
// คืน Promise<Blob> · reject ถ้ายกเลิก · ไม่ใช้ไลบรารีนอก
function openCropper(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objURL = URL.createObjectURL(file);
    img.onload = () => {
      const V = Math.min(300, window.innerWidth - 80);   // ขนาดกรอบครอป
      const OUT = 600;                                    // ขนาดไฟล์ผลลัพธ์
      const minScale = V / Math.min(img.naturalWidth, img.naturalHeight);
      let scale = minScale, maxScale = minScale * 4;
      let left = (V - img.naturalWidth * scale) / 2;
      let top = (V - img.naturalHeight * scale) / 2;

      const ov = document.createElement('div');
      ov.className = 'cropper';
      ov.innerHTML = `
        <div class="crop-panel">
          <div class="crop-title">เลื่อน/ซูมให้พอดีกรอบ</div>
          <div class="crop-view" style="width:${V}px;height:${V}px">
            <img class="crop-img" draggable="false">
            <div class="crop-ring"></div>
          </div>
          <input type="range" class="crop-zoom" min="1" max="4" step="0.01" value="1">
          <div class="crop-btns">
            <button class="btn crop-ok">ใช้รูปนี้</button>
            <button class="btn-ghost crop-cancel">ยกเลิก</button>
          </div>
        </div>`;
      document.body.appendChild(ov);

      const imgEl = ov.querySelector('.crop-img');
      imgEl.src = objURL;

      const clamp = () => {
        const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
        left = Math.min(0, Math.max(V - w, left));   // ต้องคลุมกรอบเสมอ
        top = Math.min(0, Math.max(V - h, top));
      };
      const apply = () => {
        clamp();
        imgEl.style.width = img.naturalWidth * scale + 'px';
        imgEl.style.height = img.naturalHeight * scale + 'px';
        imgEl.style.left = left + 'px';
        imgEl.style.top = top + 'px';
      };
      apply();

      // ลาก (mouse + touch ผ่าน pointer events)
      let dragging = false, px = 0, py = 0;
      const view = ov.querySelector('.crop-view');
      view.addEventListener('pointerdown', (e) => { dragging = true; px = e.clientX; py = e.clientY; view.setPointerCapture(e.pointerId); });
      view.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        left += e.clientX - px; top += e.clientY - py; px = e.clientX; py = e.clientY; apply();
      });
      view.addEventListener('pointerup', () => { dragging = false; });

      // ซูม (คงจุดกึ่งกลางกรอบไว้)
      ov.querySelector('.crop-zoom').oninput = (e) => {
        const z = Number(e.target.value);
        const newScale = minScale * z;
        const cx = (V / 2 - left) / scale, cy = (V / 2 - top) / scale;   // จุดกลางในพิกัดรูป
        scale = Math.min(maxScale, Math.max(minScale, newScale));
        left = V / 2 - cx * scale; top = V / 2 - cy * scale; apply();
      };

      const cleanup = () => { URL.revokeObjectURL(objURL); ov.remove(); };
      ov.querySelector('.crop-cancel').onclick = () => { cleanup(); reject(new Error('cancel')); };
      ov.querySelector('.crop-ok').onclick = () => {
        // แปลงพื้นที่ในกรอบ → พิกัดรูปจริง แล้ววาดลง canvas
        const sx = -left / scale, sy = -top / scale, sSize = V / scale;
        const cv = document.createElement('canvas');
        cv.width = OUT; cv.height = OUT;
        cv.getContext('2d').drawImage(img, sx, sy, sSize, sSize, 0, 0, OUT, OUT);
        cv.toBlob((b) => { cleanup(); b ? resolve(b) : reject(new Error('crop fail')); }, 'image/jpeg', 0.9);
      };
    };
    img.onerror = () => { URL.revokeObjectURL(objURL); reject(new Error('เปิดรูปไม่ได้')); };
    img.src = objURL;
  });
}

async function saveProfile() {
  const btn = document.getElementById('pfSave');
  const msg = document.getElementById('pfMsg');
  const name = document.getElementById('pfName').value.trim();
  if (!name) { alert('กรุณากรอกชื่อน้อง'); return; }

  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    const card = { ...((PET.data || {}).card || {}) };
    card.name = name;
    card.nickname = document.getElementById('pfNick').value.trim();
    card.emoji = document.getElementById('pfEmoji').value.trim() || '🐾';
    card.breed = document.getElementById('pfBreed').value.trim();
    card.birthDate = document.getElementById('pfBirth').value;
    card.status = document.getElementById('pfStatus').value;
    card.statusNote = document.getElementById('pfStatusNote').value.trim();

    if (PROFILE_PHOTO) {
      msg.textContent = 'กำลังอัปรูป...';
      card.photo = await TC.uploadPhoto(PET.id, PROFILE_PHOTO, 'profile');
    }

    msg.textContent = 'กำลังบันทึก...';
    // RPC เดียวเขียน card + sync ชื่อ pets.name (admin เท่านั้น — เช็กใน DB)
    PET.data = await TC.setPetProfile(PET.id, card, name);
    PET.name = name;

    renderHeader();
    renderTabs();
    showTab('summary');
  } catch (e) {
    alert(e.message || 'บันทึกไม่สำเร็จ');
    btn.disabled = false; btn.textContent = 'บันทึก'; msg.textContent = '';
  }
}

function renderTabs() {
  const bar = document.getElementById('tabs');
  bar.innerHTML = '';
  TABS.forEach((t) => {
    const b = document.createElement('button');
    b.className = 'dtab';
    b.dataset.key = t.key;
    b.textContent = t.label;
    b.onclick = () => showTab(t.key);
    bar.appendChild(b);
  });
}

function showTab(key) {
  document.querySelectorAll('.dtab').forEach((b) => b.classList.toggle('active', b.dataset.key === key));
  const c = document.getElementById('content');
  c.innerHTML = '';
  if (key === 'summary') renderSummary(c);
  else if (key === 'meds') renderMeds(c);
  else if (key === 'appts') renderAppts(c);
  else if (key === "calendar") renderCalendar(c);
  else if (key === "labs") renderLabs(c);
  else c.innerHTML = `<div class="soon"><span class="big">🚧</span>แท็บนี้กำลังพอร์ตมาระบบใหม่<br>
    <span style="font-size:13px">ระหว่างนี้ดูได้จากเว็บเดิม</span></div>`;
}

/* ================= แท็บ 🌡️ อาการประจำวัน ================= */

// สี/ชื่อ default ของหมวดเดิม (ใช้เป็น fallback ถ้าโปรไฟล์ยังไม่กำหนดสีเอง)
const SYM_COLORS = { diarrhea: '#d98a3d', general: '#5b8def', nosebleed: '#e85555', vomiting: '#b06be8' };
const SYM_LABELS = { diarrhea: 'ท้องเสีย', general: 'อาการทั่วไป', nosebleed: 'เลือดกำเดา', vomiting: '🤢 อาเจียน' };
// จานสีสำรองสำหรับหมวดใหม่ที่ยังไม่เลือกสี (ไล่ตามลำดับ)
const SYM_PALETTE = ['#5b8def', '#d98a3d', '#e85555', '#b06be8', '#3fae86', '#e0a93e', '#5aa0c8', '#c96fa8'];
let SYM_COLOR_MAP = {};   // src → สี · เติมค่าโดย dailyCats() ทุกครั้งที่วาด
const symColor = (src) => SYM_COLOR_MAP[src] || SYM_COLORS[src] || '#e8b84b';
const sideLabel = (s) => (s === 'left' ? 'รูจมูกซ้าย' : s === 'right' ? 'รูจมูกขวา' : s || '');

/** หมวดอาการของโปรไฟล์นี้ — [{source, label, color}] · ใช้ display.tabs ถ้ามี ไม่มีก็อนุมานจาก symptoms
 *  side effect: เติม SYM_COLOR_MAP ให้ symColor() ใช้ได้ทั้งหน้า */
function dailyCats(d) {
  const tabs = (d.display && d.display.tabs) || null;
  let cats;
  if (tabs) {
    cats = tabs.filter((t) => t.source !== 'treatments')
               .map((t) => ({ source: t.source, label: t.label || SYM_LABELS[t.source] || t.source, color: t.color || SYM_COLORS[t.source] }));
    // กันหมวดที่มีข้อมูลแต่ไม่อยู่ใน tabs หายไป (เผื่อ tabs เก่าไม่ครบ)
    const have = new Set(cats.map((c) => c.source));
    Object.keys(d.symptoms || {}).forEach((k) => {
      if (!have.has(k) && (d.symptoms[k] || []).length) cats.push({ source: k, label: SYM_LABELS[k] || k, color: SYM_COLORS[k] });
    });
  } else {
    cats = Object.keys(d.symptoms || {}).map((k) => ({ source: k, label: SYM_LABELS[k] || k, color: SYM_COLORS[k] }));
  }
  // "อาการทั่วไป" (general) มีเป็น default เสมอ — ใช้ได้ทันที + เป็นปลายทางตอนลบหมวด · สีฟ้า
  if (!cats.some((c) => c.source === 'general')) {
    cats.unshift({ source: 'general', label: SYM_LABELS.general, color: SYM_COLORS.general });
  }
  cats.forEach((c, i) => { c.color = c.color || SYM_PALETTE[i % SYM_PALETTE.length]; SYM_COLOR_MAP[c.source] = c.color; });
  return cats;
}

/* ---------- ปฏิทินกลาง (ใช้ทั้งแท็บอาการและการรักษา) ---------- */

/**
 * สร้างปฏิทินหนึ่งชุดในกล่องที่กำหนด
 *   events   : [{date, ...}] แต่ละรายการต้องมี date รูปแบบ YYYY-MM-DD
 *   dotsOf   : (itemsของวันนั้น) => [สี...]  ใช้วาดจุดใต้ตัวเลขวัน
 *   onDetail : (iso, items, boxEl) => void  วาดรายละเอียดของวันที่เลือก
 * เปิดที่เดือนปัจจุบันเสมอ · ไฮไลต์วันนี้ · กดวันเดิมซ้ำ = ซ่อน
 */
const CAL_VIEW = {};   // จำเดือนที่ดูอยู่ + วันที่เลือก แยกตามปฏิทินแต่ละตัว

/** สั่งให้ปฏิทินไปโฟกัสวันที่นี้ตอนวาดรอบหน้า (ใช้หลังบันทึก) */
function setCalFocus(key, iso) {
  if (!iso) return;
  const d = new Date(iso);
  CAL_VIEW[key] = { ym: `${d.getFullYear()}-${d.getMonth()}`, sel: iso };
}

function buildCalendar(root, { key, events, dotsOf, onDetail }) {
  const now = new Date();
  const keys = new Set(events.map((e) => {
    const d = new Date(e.date); return `${d.getFullYear()}-${d.getMonth()}`;
  }));
  keys.add(`${now.getFullYear()}-${now.getMonth()}`);   // แทรกเดือนปัจจุบันถึงไม่มีข้อมูล

  const st = {
    months: [...keys].map((k) => k.split('-').map(Number)).sort((a, b) => (a[0] - b[0]) || (a[1] - b[1])),
    idx: 0, sel: null,
  };
  st.idx = Math.max(0, st.months.findIndex(([y, m]) => y === now.getFullYear() && m === now.getMonth()));

  // ถ้าเคยดูเดือนอื่นไว้ (หรือเพิ่งบันทึกรายการของเดือนอื่น) ให้กลับไปที่เดือนนั้น
  // ไม่งั้นทุกครั้งที่บันทึกจะเด้งกลับเดือนปัจจุบัน แล้วต้องกดย้อนเองใหม่
  const saved = key && CAL_VIEW[key];
  if (saved) {
    const i = st.months.findIndex(([y, m]) => `${y}-${m}` === saved.ym);
    if (i >= 0) { st.idx = i; st.sel = saved.sel || null; }
  }

  root.innerHTML = `
    <div class="card">
      <div class="cal-nav">
        <button class="calPrev" aria-label="เดือนก่อน">‹</button>
        <span class="cal-title"></span>
        <button class="calNext" aria-label="เดือนถัดไป">›</button>
      </div>
      <div class="cal-grid"></div>
    </div>
    <div class="dayBoxHolder"></div>`;

  const $ = (s) => root.querySelector(s);
  $('.calPrev').onclick = () => { if (st.idx > 0) { st.idx--; st.sel = null; draw(); } };
  $('.calNext').onclick = () => { if (st.idx < st.months.length - 1) { st.idx++; st.sel = null; draw(); } };

  function draw() {
    const [y, m] = st.months[st.idx];
    $('.cal-title').textContent = `${TC.TH_MONTHS[m]} ${y + 543}`;
    $('.calPrev').disabled = st.idx === 0;
    $('.calNext').disabled = st.idx === st.months.length - 1;

    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    const t = new Date();
    const todayISO = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;

    const byDay = {};
    events.forEach((e) => {
      const d = new Date(e.date);
      if (d.getFullYear() === y && d.getMonth() === m) (byDay[d.getDate()] ||= []).push(e);
    });

    let html = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map((s) => `<div class="cal-dow">${s}</div>`).join('');
    for (let i = 0; i < first; i++) html += '<div></div>';

    for (let day = 1; day <= days; day++) {
      const items = byDay[day] || [];
      const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const cls = ['cal-cell'];
      if (items.length) cls.push('has');
      if (iso === todayISO) cls.push('today');
      if (st.sel === iso) cls.push('sel');
      const dots = items.length ? dotsOf(items) : [];
      html += `<div class="${cls.join(' ')}" ${items.length ? `data-iso="${iso}"` : ''}>${day}
        ${dots.length ? `<span class="cell-dots">${dots.map((c) =>
          `<i class="cdot" style="background:${c}"></i>`).join('')}</span>` : ''}
      </div>`;
    }

    const grid = $('.cal-grid');
    grid.innerHTML = html;
    grid.querySelectorAll('[data-iso]').forEach((cell) => {
      cell.onclick = () => {
        st.sel = (st.sel === cell.dataset.iso) ? null : cell.dataset.iso;   // กดซ้ำ = ซ่อน
        draw();
      };
    });

    if (key) CAL_VIEW[key] = { ym: `${y}-${m}`, sel: st.sel };

    const box = $('.dayBoxHolder');
    box.innerHTML = '';
    if (st.sel) onDetail(st.sel, events.filter((e) => e.date === st.sel), box);
  }

  draw();
}

function openLightbox(url) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<span class="close">×</span><img src="${url}" alt="">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}

/** ใส่รูปจาก Storage ลงกล่อง (ต้องขอ signed URL ทีละใบเพราะ bucket เป็น private) */
function attachPhotos(holder, paths) {
  (paths || []).forEach(async (p) => {
    const url = await TC.signedUrl(p);
    if (!url) return;
    const img = document.createElement('img');
    img.src = url;
    img.onclick = () => openLightbox(url);
    holder.appendChild(img);
  });
}

/* ---------- แท็บอาการประจำวัน (ดู + แก้ไข) ---------- */

let SYM_EDIT = null;   // {src, idx|null, photos:[path...], files:[File...]}

const TREAT_SRC = 'treat';   // หมวดพิเศษ "หาหมอ" (การรักษา) บนปฏิทินรวม
const treatColor = (d) => (d.display && d.display.treatColor) || '#5fa57f';   // หาหมอ default = เขียว
const treatLabel = (d) => (d.display && d.display.treatLabel) || 'หาหมอ';      // ชื่อหมวดหาหมอ (แก้ได้)

/* ---------- ปฏิทินรวม: อาการประจำวัน + การรักษา (แทน 2 แท็บเดิม) ---------- */
function renderCalendar(root) {
  const d = PET.data || {};
  SYM_COLOR_MAP[TREAT_SRC] = treatColor(d);   // ให้ symColor('treat') ใช้ได้

  const symCats = dailyCats(d);                // หมวดอาการ (เติม SYM_COLOR_MAP ด้วย)
  const pickCats = symCats;                    // หมวดให้เลือกตอนเพิ่มอาการ
  const usedSym = symCats.filter((c) => ((d.symptoms || {})[c.source] || []).length);
  const treats = d.treatments || [];

  // legend: อาการทั่วไป → หาหมอ → หมวดอาการอื่นที่มีข้อมูล
  const legend = [];
  const genCat = usedSym.find((c) => c.source === 'general');
  if (genCat) legend.push({ src: 'general', label: genCat.label });
  if (treats.length) legend.push({ src: TREAT_SRC, label: treatLabel(d) });
  usedSym.filter((c) => c.source !== 'general').forEach((c) => legend.push({ src: c.source, label: c.label }));

  // รวม events: อาการ (flat) + การรักษา (วันละก้อน มี entries)
  const events = [];
  usedSym.forEach((c) => (d.symptoms[c.source] || []).forEach((it, idx) =>
    events.push({ ...it, _kind: 'sym', _src: c.source, _label: c.label, _idx: idx })));
  treats.forEach((r) => events.push({ date: r.date, _kind: 'treat', _src: TREAT_SRC, entries: r.entries || [] }));

  root.innerHTML = `
    <div class="edit-bar">
      <span class="section-label" style="margin:0">🗓️ ปฏิทินสุขภาพ</span>
      ${ROLE.canEdit ? '<button class="btn-ghost" id="btnAddSym">➕ อาการ</button>' : ''}
      ${ROLE.canEdit ? `<button class="btn-ghost" id="btnAddTx">🏥 ${TC.esc(treatLabel(d))}</button>` : ''}
      ${ROLE.canEdit ? '<a class="sum-edit-toggle" id="btnMngCats" style="margin:0">⚙️ จัดการหมวด/สี</a>' : ''}
      <span class="saving" id="symMsg"></span>
    </div>
    <div id="catCfg"></div>
    ${legend.length ? `<div class="legend">${legend.map((c) =>
      `<span><i class="dot" style="background:${symColor(c.src)}"></i> ${TC.esc(c.label)}</span>`).join('')}</div>` : ''}
    <div id="symForm"></div>
    <div id="txForm"></div>
    ${events.length ? '<div id="healthCal"></div>' : '<div class="empty">ยังไม่มีบันทึก — กด ➕ อาการ หรือ 🏥 หาหมอ</div>'}`;

  if (ROLE.canEdit) {
    document.getElementById('btnAddSym').onclick = () => openSymForm(pickCats, null);
    document.getElementById('btnAddTx').onclick = () => openTreatForm(null);
    document.getElementById('btnMngCats').onclick = () => toggleCatCfg(d);
  }

  if (!events.length) return;

  buildCalendar(document.getElementById('healthCal'), {
    key: 'calendar',
    events,
    dotsOf: (items) => [...new Set(items.map((i) => i._src))].map(symColor),
    onDetail: (iso, items, box) => {
      const syms = items.filter((it) => it._kind === 'sym');
      const treatDay = items.find((it) => it._kind === 'treat');
      const gi = treatDay ? treats.findIndex((r) => r.date === iso) : -1;
      const entries = treatDay ? treatDay.entries : [];

      box.innerHTML = `
        <div class="day-box">
          <div class="day-head">📅 ${TC.thDate(iso)} · ${syms.length + entries.length} รายการ</div>
          ${syms.map((it, i) => `
            <div class="sym-card" style="border-left-color:${symColor(it._src)}">
              <div class="sym-kind" style="color:${symColor(it._src)}">
                ${TC.esc(it._label)}${it._src === 'nosebleed' && it.side ? ' · ' + TC.esc(sideLabel(it.side)) : ''}
              </div>
              <div class="sym-detail">${TC.esc(it.detail || '')}</div>
              ${(it.photos || []).length ? `<div class="sym-photos" data-sp="${i}"></div>` : ''}
              ${ROLE.canEdit ? `<div class="inline-actions">
                <a class="act-edit" data-edit="${it._src}:${it._idx}">แก้</a>
                <a class="act-del" data-del="${it._src}:${it._idx}">ลบ</a></div>` : ''}
            </div>`).join('')}
          ${entries.map((e, i) => `
            <div class="tx-entry" style="border-left:3px solid ${symColor(TREAT_SRC)};padding-left:10px">
              <div class="tx-doctor">🏥 ${TC.esc(e.doctor || 'ไม่ระบุหมอ')}${e.specialty ? ' — ' + TC.esc(e.specialty) : ''}</div>
              <div class="tx-notes">${TC.esc(e.notes || '')}</div>
              ${(e.photos || []).length ? `<div class="sym-photos" data-tp="${i}"></div>` : ''}
              ${e.flow ? `<div class="tx-flow"><div class="tx-flow-label">🗺 ขั้นตอน/แผนการรักษา</div><div class="mmd" data-mf="${i}"></div></div>` : ''}
              ${ROLE.canEdit ? `<div class="inline-actions">
                <a class="act-edit" data-etx="${gi}:${i}">แก้</a>
                <a class="act-del" data-dtx="${gi}:${i}">ลบ</a></div>` : ''}
            </div>`).join('')}
        </div>`;

      syms.forEach((it, i) => {
        const h = box.querySelector(`.sym-photos[data-sp="${i}"]`);
        if (h) attachPhotos(h, it.photos);
      });
      entries.forEach((e, i) => {
        const h = box.querySelector(`.sym-photos[data-tp="${i}"]`);
        if (h) attachPhotos(h, e.photos);
        if (e.flow) drawFlow(box.querySelector(`.mmd[data-mf="${i}"]`), e.flow, i);
      });

      box.querySelectorAll('[data-edit]').forEach((a) => a.onclick = () => {
        const [src, idx] = a.dataset.edit.split(':'); openSymForm(pickCats, { src, idx: Number(idx) });
      });
      box.querySelectorAll('[data-del]').forEach((a) => a.onclick = () => {
        const [src, idx] = a.dataset.del.split(':'); delSymptom(src, Number(idx));
      });
      box.querySelectorAll('[data-etx]').forEach((a) => a.onclick = () => {
        const [g, i] = a.dataset.etx.split(':').map(Number); openTreatForm({ g, i });
      });
      box.querySelectorAll('[data-dtx]').forEach((a) => a.onclick = () => {
        const [g, i] = a.dataset.dtx.split(':').map(Number); delTreat(g, i);
      });
    },
  });
}

/* ---------- จัดการหมวดปฏิทิน: เพิ่ม/ลบ/แก้ชื่อ/เปลี่ยนสี ----------
 * หมวดอาการเก็บใน display.tabs = [{source, label, color}] · สีหาหมอเก็บ display.treatColor
 * ลบหมวดอาการ = ย้ายบันทึกไป "อาการทั่วไป" (general) ไม่ลบทิ้ง · general + หาหมอ ลบไม่ได้ */
let CAT_CFG_OPEN = false;
function toggleCatCfg(d) {
  CAT_CFG_OPEN = !CAT_CFG_OPEN;
  const holder = document.getElementById('catCfg');
  if (!CAT_CFG_OPEN) { holder.innerHTML = ''; return; }

  const counts = {};
  dailyCats(d).forEach((c) => { counts[c.source] = ((d.symptoms || {})[c.source] || []).length; });
  let rows = dailyCats(d).map((c) => ({ source: c.source, label: c.label, color: c.color }));
  let treatCol = treatColor(d);        // สีหมวด "หาหมอ"
  let treatLbl = treatLabel(d);        // ชื่อหมวด "หาหมอ" (แก้ได้)
  const moveSet = new Set();           // source ที่ถูกลบ → ย้ายบันทึกไป general ตอนบันทึก

  const swatch = 'width:38px;height:34px;padding:0;border:1px solid var(--border);border-radius:8px;background:none;cursor:pointer;flex:0 0 auto';
  const nameInp = "flex:1;min-width:0;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:'Sarabun',sans-serif;font-size:14px";
  const genLabel = () => (rows.find((r) => r.source === 'general') || {}).label || 'อาการทั่วไป';

  // แถวหมวดพิเศษ "หาหมอ" — เปลี่ยนสี+ชื่อได้ ลบไม่ได้ (แทรกต่อจากอาการทั่วไป)
  const treatRowHTML = () => `
    <div class="cfg-row" data-treat="1" style="gap:8px">
      <input type="color" value="${treatCol}" id="treatColor" style="${swatch}" title="เปลี่ยนสีหมวดหาหมอ">
      <input type="text" value="${TC.esc(treatLbl)}" id="treatLabelInp" style="${nameInp}" placeholder="หาหมอ">
      <button class="btn-ghost" style="padding:4px 9px;visibility:hidden" tabindex="-1" aria-hidden="true">🗑</button>
    </div>`;

  const draw = () => {
    // เรียง: อาการทั่วไป → หาหมอ → หมวดอื่น
    holder.querySelector('#catRows').innerHTML = rows.map((c, i) => {
      const locked = c.source === 'general';   // อาการทั่วไป = ปลายทาง fallback ลบไม่ได้
      const row = `<div class="cfg-row" data-i="${i}" style="gap:8px">
        <input type="color" value="${c.color}" data-color="${i}" style="${swatch}" title="เปลี่ยนสี">
        <input type="text" value="${TC.esc(c.label)}" data-label="${i}" style="${nameInp}" placeholder="ชื่อหมวด">
        ${locked
          ? '<button class="btn-ghost" style="padding:4px 9px;visibility:hidden" tabindex="-1" aria-hidden="true">🗑</button>'
          : `<button class="btn-ghost cat-del" data-i="${i}" style="padding:4px 9px;border-color:var(--red);color:var(--red)" title="ลบหมวด (ย้ายบันทึกไปทั่วไป)">🗑</button>`}
      </div>`;
      return locked ? row + treatRowHTML() : row;   // หาหมอ ต่อจากอาการทั่วไป
    }).join('');

    holder.querySelectorAll('[data-color]').forEach((inp) => inp.oninput = () => { rows[+inp.dataset.color].color = inp.value; });
    holder.querySelectorAll('[data-label]').forEach((inp) => inp.oninput = () => { rows[+inp.dataset.label].label = inp.value; });
    holder.querySelector('#treatColor').oninput = (e) => { treatCol = e.target.value; };
    holder.querySelector('#treatLabelInp').oninput = (e) => { treatLbl = e.target.value; };
    holder.querySelectorAll('.cat-del').forEach((b) => b.onclick = async () => {
      const i = +b.dataset.i, c = rows[i], n = counts[c.source] || 0;
      if (n && !await TC.confirm(
        `ลบหมวด "${c.label}"\n\nบันทึก ${n} รายการในหมวดนี้จะถูกย้ายไป "${genLabel()}" (ไม่หาย)`,
        { okLabel: 'ลบหมวด → ย้ายไปทั่วไป', danger: true })) return;
      if (n) moveSet.add(c.source);
      rows.splice(i, 1); draw();
    });
  };

  holder.innerHTML = `
    <div class="edit-form">
      <h3>⚙️ จัดการหมวด/สี</h3>
      <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px">แตะช่องสีเพื่อเปลี่ยนสีจุด · แก้ชื่อได้ · 🗑 ลบหมวด (บันทึกย้ายไป "อาการทั่วไป" ไม่หาย) · "หาหมอ" กับ "อาการทั่วไป" ลบไม่ได้</p>
      <div id="catRows"></div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <input type="color" id="newCatColor" value="#3fae86" style="${swatch}" title="สีหมวดใหม่">
        <input type="text" id="newCatName" placeholder="ชื่อหมวดอาการใหม่ (เช่น ไอ, คัน)" style="${nameInp}">
        <button class="btn-ghost" id="catAdd">➕ เพิ่ม</button>
      </div>
      <div class="btns"><button class="btn" id="catSave">บันทึก</button><button class="btn-ghost" id="catCancel">ปิด</button></div>
      <div class="saving" id="catMsg" style="margin-top:8px"></div>
    </div>`;
  draw();

  holder.querySelector('#catAdd').onclick = () => {
    const nameEl = holder.querySelector('#newCatName');
    const name = nameEl.value.trim();
    if (!name) return;
    rows.push({ source: 'cat_' + Math.random().toString(36).slice(2, 7), label: name, color: holder.querySelector('#newCatColor').value });
    nameEl.value = '';
    draw();
  };
  holder.querySelector('#catCancel').onclick = () => { CAT_CFG_OPEN = false; holder.innerHTML = ''; };
  holder.querySelector('#catSave').onclick = async () => {
    const msg = holder.querySelector('#catMsg');
    rows.forEach((c) => { c.label = c.label.trim(); });
    if (rows.some((c) => !c.label)) { msg.textContent = 'ชื่อหมวดห้ามว่าง'; return; }
    try {
      // ย้ายบันทึกของหมวดที่ถูกลบไป general (ต่อท้าย) แล้วลบ key เดิม
      if (moveSet.size) {
        const sym = JSON.parse(JSON.stringify(d.symptoms || {}));
        sym.general = sym.general || [];
        moveSet.forEach((src) => { sym.general.push(...(sym[src] || [])); delete sym[src]; });
        PET.data = await TC.setPetPath(PET.id, ['symptoms'], sym);
        // มีการย้าย → การันตีว่ามีหมวด general อยู่ในลิสต์ (ไม่งั้นบันทึกที่ย้ายมาจะไม่โผล่)
        if (!rows.some((r) => r.source === 'general')) {
          rows.push({ source: 'general', label: SYM_LABELS.general, color: SYM_COLORS.general });
        }
      }
      const others = (((d.display || {}).tabs) || []).filter((t) => t.source === 'treatments');
      const display = JSON.parse(JSON.stringify(d.display || {}));
      display.tabs = [...rows.map((c) => ({ source: c.source, label: c.label, color: c.color })), ...others];
      display.treatColor = treatCol;
      display.treatLabel = treatLbl.trim() || 'หาหมอ';
      PET.data = await TC.setPetPath(PET.id, ['display'], display);
      CAT_CFG_OPEN = false;
      showTab('calendar');
    } catch (e) { msg.textContent = e.message; }
  };
}

/** เปิดฟอร์มเพิ่ม/แก้บันทึกอาการ · edit = {src, idx} ถ้าเป็นการแก้ */
function openSymForm(cats, edit) {
  const d = PET.data || {};
  const cur = edit ? (d.symptoms[edit.src] || [])[edit.idx] : null;
  SYM_EDIT = {
    src: edit ? edit.src : cats[0].source,
    idx: edit ? edit.idx : null,
    photos: [...((cur && cur.photos) || [])],
    files: [],
  };

  const today = new Date();
  const todayISO = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

  document.getElementById('symForm').innerHTML = `
    <div class="edit-form">
      <h3>${edit ? '✏️ แก้บันทึกอาการ' : '➕ เพิ่มบันทึกอาการ'}</h3>
      <div class="fld">
        <label>หมวดอาการ</label>
        <select id="fSrc">${cats.map((c) =>
          `<option value="${c.source}" ${c.source === SYM_EDIT.src ? 'selected' : ''}>${TC.esc(c.label)}</option>`).join('')}</select>
      </div>
      <div class="fld">
        <label>วันที่</label>
        <input type="date" id="fDate" value="${cur ? cur.date : todayISO}">
      </div>
      <div class="fld" id="fSideWrap" style="display:none">
        <label>รูจมูก</label>
        <select id="fSide">
          <option value="">ไม่ระบุ</option>
          <option value="left" ${cur && cur.side === 'left' ? 'selected' : ''}>ซ้าย</option>
          <option value="right" ${cur && cur.side === 'right' ? 'selected' : ''}>ขวา</option>
        </select>
      </div>
      <div class="fld">
        <label>รายละเอียด</label>
        <textarea id="fDetail" placeholder="อาการเป็นยังไง กินอะไรมา ทำอะไรไปบ้าง...">${cur ? TC.esc(cur.detail || '') : ''}</textarea>
      </div>
      <div class="fld">
        <label>รูปภาพ (เลือกได้หลายรูป · ระบบย่อขนาดให้อัตโนมัติ)</label>
        <input type="file" id="fPhotos" accept="image/*" multiple>
        <div class="thumb-row" id="fThumbs"></div>
      </div>
      <div class="btns">
        <button class="btn" id="fSave">${edit ? 'บันทึกการแก้ไข' : 'บันทึก'}</button>
        <button class="btn-ghost" id="fCancel">ยกเลิก</button>
      </div>
    </div>`;

  const srcSel = document.getElementById('fSrc');
  const syncSide = () => {
    document.getElementById('fSideWrap').style.display = srcSel.value === 'nosebleed' ? '' : 'none';
  };
  srcSel.onchange = syncSide;
  syncSide();

  document.getElementById('fPhotos').onchange = (e) => {
    SYM_EDIT.files.push(...e.target.files);
    e.target.value = '';
    drawThumbs();
  };
  document.getElementById('fCancel').onclick = () => { SYM_EDIT = null; showTab('calendar'); };

}

/** รูปเดิม (มี path แล้ว) + รูปใหม่ที่เพิ่งเลือก (ยังไม่อัป) */
function drawThumbs() {
  const box = document.getElementById('fThumbs');
  if (!box) return;
  box.innerHTML = '';

  SYM_EDIT.photos.forEach(async (p, i) => {
    const url = await TC.signedUrl(p);
    const div = document.createElement('div');
    div.className = 'th';
    div.innerHTML = `<img src="${url || ''}" alt=""><button class="rm" title="เอาออก">×</button>`;
    div.querySelector('.rm').onclick = () => { SYM_EDIT.photos.splice(i, 1); drawThumbs(); };
    box.appendChild(div);
  });

  SYM_EDIT.files.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'th';
    const url = URL.createObjectURL(f);
    div.innerHTML = `<img src="${url}" alt=""><button class="rm" title="เอาออก">×</button>`;
    div.querySelector('.rm').onclick = () => { SYM_EDIT.files.splice(i, 1); drawThumbs(); };
    box.appendChild(div);
  });
}

async function saveSymptom() {
  const btn = document.getElementById('fSave');
  const msg = document.getElementById('symMsg');
  const src = document.getElementById('fSrc').value;
  const date = document.getElementById('fDate').value;
  const detail = document.getElementById('fDetail').value.trim();
  const side = document.getElementById('fSide') ? document.getElementById('fSide').value : '';

  if (!date) { alert('กรุณาเลือกวันที่'); return; }
  if (!detail && !SYM_EDIT.photos.length && !SYM_EDIT.files.length) {
    alert('กรุณากรอกรายละเอียด หรือแนบรูปอย่างน้อยหนึ่งรูป'); return;
  }

  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก...';

  try {
    // อัปรูปใหม่ก่อน แล้วค่อยเขียนข้อมูล — ถ้าอัปพัง จะได้ไม่บันทึก path ที่ไม่มีจริง
    const uploaded = [];
    for (const f of SYM_EDIT.files) {
      msg.textContent = `กำลังอัปรูป ${uploaded.length + 1}/${SYM_EDIT.files.length}...`;
      uploaded.push(await TC.uploadPhoto(PET.id, f, src, date));
    }
    msg.textContent = 'กำลังบันทึก...';

    const entry = { date, detail };
    if (src === 'nosebleed' && side) entry.side = side;
    const photos = [...SYM_EDIT.photos, ...uploaded];
    if (photos.length) entry.photos = photos;

    const d = PET.data || {};
    d.symptoms = d.symptoms || {};

    // ถ้าเปลี่ยนหมวดตอนแก้ไข ต้องย้ายข้าม array (ลบของเดิม เพิ่มเข้าหมวดใหม่)
    const movedCat = SYM_EDIT.idx !== null && SYM_EDIT.src !== src;
    if (movedCat) {
      const oldArr = [...(d.symptoms[SYM_EDIT.src] || [])];
      oldArr.splice(SYM_EDIT.idx, 1);
      await TC.setPetPath(PET.id, ['symptoms', SYM_EDIT.src], oldArr);
      d.symptoms[SYM_EDIT.src] = oldArr;
    }

    const arr = [...(d.symptoms[src] || [])];
    if (SYM_EDIT.idx !== null && !movedCat) arr[SYM_EDIT.idx] = entry;
    else arr.unshift(entry);
    arr.sort((a, b) => new Date(b.date) - new Date(a.date));   // ใหม่สุดอยู่บน เหมือน V1

    const fresh = await TC.setPetPath(PET.id, ['symptoms', src], arr);
    PET.data = fresh;   // ใช้ค่าที่ฐานข้อมูลตอบกลับ ไม่ใช่ค่าที่เดาเอง

    setCalFocus('calendar', date);
    SYM_EDIT = null;
    showTab('calendar');
    document.getElementById('symMsg').textContent = '✅ บันทึกแล้ว';
    setTimeout(() => { const m = document.getElementById('symMsg'); if (m) m.textContent = ''; }, 2500);
  } catch (err) {
    alert(err.message || 'บันทึกไม่สำเร็จ');
    btn.disabled = false;
    btn.textContent = 'บันทึก';
    msg.textContent = '';
  }
}

async function delSymptom(src, idx) {
  const item = (PET.data.symptoms[src] || [])[idx];
  if (!item) return;
  if (!await TC.confirm(`ลบบันทึกวันที่ ${TC.thDate(item.date)} ?\n\n${(item.detail || '').slice(0, 80)}`)) return;

  const arr = [...(PET.data.symptoms[src] || [])];
  arr.splice(idx, 1);
  try {
    PET.data = await TC.setPetPath(PET.id, ['symptoms', src], arr);
    showTab('calendar');
    // หมายเหตุ: ไม่ลบไฟล์รูปใน Storage — เผื่อกดพลาดจะได้กู้ได้ (ค่อยทำตัวเก็บกวาดทีหลัง)
  } catch (err) {
    alert(err.message || 'ลบไม่สำเร็จ');
  }
}

/* ================= ฟอร์มกลาง (ใช้ร่วมทุกหมวด) ================= */
/*
 * fields: [{key, label, type, options?, placeholder?, half?}]
 *   type: text | date | textarea | select | photos
 * onSave(values, uploadedPhotos) — โยน error ได้ ฟอร์มจะโชว์ข้อความให้เอง
 */
let FORM = null;   // {photos:[path], files:[File], prefix, dateKey}

function openForm(holderId, { title, fields, values = {}, prefix = 'photo', onSave }) {
  const holder = document.getElementById(holderId);
  const photoField = fields.find((f) => f.type === 'photos');
  FORM = { photos: [...((photoField && values[photoField.key]) || [])], files: [], prefix, fields };

  const fieldHTML = (f) => {
    let v = values[f.key] ?? '';
    // เพิ่มใหม่แล้วช่องวันที่ว่าง → เติมวันนี้ให้ (เหมือนฟอร์มอาการ/ผลเลือด) กันลืมกรอกบนมือถือ
    if (f.type === 'date' && !v) {
      const t = new Date();
      v = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
    }
    if (f.type === 'photos') {
      return `<label>${TC.esc(f.label)}</label>
        <input type="file" id="ff-${f.key}" accept="image/*" multiple>
        <div class="thumb-row" id="ffThumbs"></div>`;
    }
    if (f.type === 'textarea') {
      return `<label>${TC.esc(f.label)}</label>
        <textarea id="ff-${f.key}" placeholder="${TC.esc(f.placeholder || '')}">${TC.esc(v)}</textarea>`;
    }
    if (f.type === 'select') {
      const opt = (o) => `<option value="${TC.esc(o.value)}" ${o.value === v ? 'selected' : ''}>${TC.esc(o.label)}</option>`;
      // ถ้า option มี .group → จัดกลุ่มด้วย <optgroup> (ตัวที่ไม่มี group เช่น "— เลือก —" อยู่บนสุด)
      const grouped = f.options.filter((o) => o.group);
      let optsHtml;
      if (grouped.length) {
        const order = [], byG = {};
        grouped.forEach((o) => { if (!byG[o.group]) { byG[o.group] = []; order.push(o.group); } byG[o.group].push(o); });
        optsHtml = f.options.filter((o) => !o.group).map(opt).join('')
          + order.map((g) => `<optgroup label="${TC.esc(g)}">${byG[g].map(opt).join('')}</optgroup>`).join('');
      } else {
        optsHtml = f.options.map(opt).join('');
      }
      return `<label>${TC.esc(f.label)}</label>
        <select id="ff-${f.key}">${optsHtml}</select>`;
    }
    return `<label>${TC.esc(f.label)}</label>
      <input type="${f.type}" id="ff-${f.key}" value="${TC.esc(v)}" placeholder="${TC.esc(f.placeholder || '')}">`;
  };

  holder.innerHTML = `
    <div class="edit-form">
      <h3>${TC.esc(title)}</h3>
      ${fields.map((f) => `<div class="fld">${fieldHTML(f)}</div>`).join('')}
      <div class="btns">
        <button class="btn" id="ffSave">บันทึก</button>
        <button class="btn-ghost" id="ffCancel">ยกเลิก</button>
      </div>
      <div class="saving" id="ffMsg" style="margin-top:8px"></div>
    </div>`;

  if (photoField) {
    document.getElementById(`ff-${photoField.key}`).onchange = (e) => {
      FORM.files.push(...e.target.files); e.target.value = ''; drawFormThumbs();
    };
    drawFormThumbs();
  }

  document.getElementById('ffCancel').onclick = () => { FORM = null; holder.innerHTML = ''; };
  document.getElementById('ffSave').onclick = async () => {
    const btn = document.getElementById('ffSave');
    const msg = document.getElementById('ffMsg');
    const vals = {};
    fields.forEach((f) => {
      if (f.type === 'photos') return;
      vals[f.key] = document.getElementById(`ff-${f.key}`).value.trim();
    });

    btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    try {
      const uploaded = [];
      for (const file of FORM.files) {
        msg.textContent = `กำลังอัปรูป ${uploaded.length + 1}/${FORM.files.length}...`;
        uploaded.push(await TC.uploadPhoto(PET.id, file, prefix, vals.date || ''));
      }
      msg.textContent = 'กำลังบันทึก...';
      await onSave(vals, [...FORM.photos, ...uploaded]);
      FORM = null;
      holder.innerHTML = '';
    } catch (err) {
      alert(err.message || 'บันทึกไม่สำเร็จ');
      btn.disabled = false; btn.textContent = 'บันทึก'; msg.textContent = '';
    }
  };

  holder.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function drawFormThumbs() {
  const box = document.getElementById('ffThumbs');
  if (!box) return;
  box.innerHTML = '';
  FORM.photos.forEach(async (p, i) => {
    const url = await TC.signedUrl(p);
    const div = document.createElement('div');
    div.className = 'th';
    div.innerHTML = `<img src="${url || ''}" alt=""><button class="rm">×</button>`;
    div.querySelector('.rm').onclick = () => { FORM.photos.splice(i, 1); drawFormThumbs(); };
    box.appendChild(div);
  });
  FORM.files.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'th';
    div.innerHTML = `<img src="${URL.createObjectURL(f)}" alt=""><button class="rm">×</button>`;
    div.querySelector('.rm').onclick = () => { FORM.files.splice(i, 1); drawFormThumbs(); };
    box.appendChild(div);
  });
}

/** ลิงก์ แก้/ลบ ใต้รายการ (โผล่เฉพาะคนที่มีสิทธิ์แก้) */
function actionsHTML(editAttr, delAttr) {
  if (!ROLE.canEdit) return '';
  return `<div class="inline-actions">
    <a class="act-edit" data-edit="${editAttr}">แก้</a>
    <a class="act-del" data-del="${delAttr}">ลบ</a>
  </div>`;
}

function wireActions(box, onEdit, onDel) {
  box.querySelectorAll('[data-edit]').forEach((a) => { a.onclick = () => onEdit(a.dataset.edit); });
  box.querySelectorAll('[data-del]').forEach((a) => { a.onclick = () => onDel(a.dataset.del); });
}

/** บันทึกอาร์เรย์กลับเข้า data แล้ววาดแท็บใหม่ */

let mermaidReady = false;
function initMermaid() {
  if (mermaidReady || !window.mermaid) return;
  // ธีมพาสเทลให้เข้ากับเว็บ (ค่าเดียวกับ V1)
  window.mermaid.initialize({
    startOnLoad: false, theme: 'base',
    themeVariables: {
      primaryColor: '#fbf4ec', primaryBorderColor: '#d99e3e', primaryTextColor: '#4a4035',
      lineColor: '#8c7f6f', secondaryColor: '#e6eef9', tertiaryColor: '#f8e0e0',
      fontFamily: 'Sarabun, sans-serif', fontSize: '14px',
    },
  });
  mermaidReady = true;
}

const TREAT_FIELDS = [
  { key: 'date', label: 'วันที่', type: 'date' },
  { key: 'doctor', label: 'หมอ', type: 'text', placeholder: 'เช่น อ.นิช' },
  { key: 'specialty', label: 'แผนก', type: 'text', placeholder: 'เช่น ทางเดินอาหาร' },
  { key: 'notes', label: 'บันทึก', type: 'textarea', placeholder: 'หมอบอกว่าอะไร ให้ยาอะไร ต้องทำอะไรต่อ...' },
  { key: 'photos', label: 'รูปภาพ (เลือกได้หลายรูป)', type: 'photos' },
  { key: 'flow', label: 'Flowchart (Mermaid) — เว้นว่างได้', type: 'textarea', placeholder: 'flowchart TD\n  A[ตรวจเลือด] --> B[ให้ยา]' },
];

function openTreatForm(edit) {
  const list = (PET.data || {}).treatments || [];
  const cur = edit ? { ...list[edit.g].entries[edit.i], date: list[edit.g].date } : {};

  openForm('txForm', {
    title: edit ? '✏️ แก้บันทึกการรักษา' : '➕ เพิ่มการรักษา',
    fields: TREAT_FIELDS,
    values: cur,
    prefix: 'treat',
    onSave: async (v, photos) => {
      if (!v.date) throw new Error('กรุณาเลือกวันที่');
      if (!v.doctor && !v.notes) throw new Error('กรุณากรอกชื่อหมอหรือบันทึกอย่างน้อยหนึ่งอย่าง');

      const entry = { doctor: v.doctor, specialty: v.specialty, notes: v.notes };
      if (photos.length) entry.photos = photos;
      if (v.flow) entry.flow = v.flow;

      const arr = JSON.parse(JSON.stringify(list));

      // ลบ entry เดิมออกก่อน (เผื่อมีการเปลี่ยนวันที่ ต้องย้ายข้ามกลุ่ม)
      if (edit) {
        arr[edit.g].entries.splice(edit.i, 1);
        if (!arr[edit.g].entries.length) arr.splice(edit.g, 1);
      }

      const gi = arr.findIndex((r) => r.date === v.date);
      if (gi >= 0) arr[gi].entries.push(entry);
      else arr.push({ date: v.date, entries: [entry] });

      arr.sort((a, b) => new Date(b.date) - new Date(a.date));
      setCalFocus('calendar', v.date);
      await saveArr('treatments', arr, 'calendar');
    },
  });
}

async function delTreat(g, i) {
  const list = (PET.data || {}).treatments || [];
  const e = (list[g] || {}).entries?.[i];
  if (!e) return;
  if (!await TC.confirm(`ลบบันทึกการรักษา ${TC.thDate(list[g].date)}\n${e.doctor || ''} ?`)) return;

  const arr = JSON.parse(JSON.stringify(list));
  arr[g].entries.splice(i, 1);
  if (!arr[g].entries.length) arr.splice(g, 1);
  try { await saveArr('treatments', arr, 'calendar'); }
  catch (err) { alert(err.message); }
}

/** เรนเดอร์ flowchart — ไวยากรณ์ผิดก็ไม่ทำให้หน้าพัง (แสดงข้อความแทน) */
async function drawFlow(el, code, i) {
  if (!el) return;
  initMermaid();
  if (!window.mermaid) { el.innerHTML = '<div class="empty">โหลดตัวเรนเดอร์ผังไม่ได้</div>'; return; }
  try {
    const { svg } = await window.mermaid.render(`mmd-${Date.now()}-${i}`, code);
    el.innerHTML = svg;
  } catch (err) {
    el.innerHTML = '<div class="empty">ผังนี้แสดงไม่ได้ (ไวยากรณ์ไม่ถูกต้อง)</div>';
  }
}

async function delFood(idx) {
  const food = (PET.data || {}).food || [];

/* ================= แท็บ 🧪 ผลเลือด ================= */
/*
 * โครงข้อมูล 3 ชั้น:
 *   labPanels[]  = หมวด {id, name}                (เช่น cbc, chem, cardiac)
 *   labConfig[]  = นิยามค่า {panel, key, label, unit, min, max}  (ช่วงปกติ min/max เว้นได้)
 *   labs[]       = ผลแต่ละครั้ง {date, panel, values:{key:number}, note}
 *
 * ความยืดหยุ่น (โจทย์: หมาแต่ละตัวตรวจคนละที่ ค่าไม่เหมือนกัน):
 *   - ฟอร์มเพิ่มผลโชว์ทุกค่าใน labConfig ของหมวดนั้น กรอกเท่าที่มี เว้นว่างได้
 *   - "➕ เพิ่มค่าที่ไม่มีในรายการ" ระหว่างกรอกได้เลย → เพิ่มเข้า labConfig อัตโนมัติ
 *   - "➕ เพิ่มหมวดใหม่" สำหรับที่ตรวจที่มีชุดตรวจต่างไป
 */

const LAB_PAGE_SIZE = 8;

function labConfigFor(panel) {
  return ((PET.data || {}).labConfig || []).filter((c) => c.panel === panel);
}
// แยกค่าผลเลือดที่อาจมีเครื่องหมาย < > (เครื่องนับไม่ได้) ออกเป็น {op, n}
//   ">2000" = ค่าจริงสูงกว่า 2000 · "<200" = ค่าจริงต่ำกว่า 200
function parseLabVal(v) {
  if (typeof v === 'number') return { op: '', n: v };
  // ตัด comma หลักพันทิ้งก่อนแปลงเป็นเลข ("1,000" → 1000) · เก็บค่าที่พิมพ์ไว้ตามเดิม แค่ตอนคำนวณมองข้าม
  const s = String(v ?? '').trim().replace(/,/g, '');
  const m = s.match(/^([<>]=?)\s*(-?\d+\.?\d*)/);
  if (m) return { op: m[1][0], n: Number(m[2]) };
  const num = Number(s);
  return { op: '', n: Number.isNaN(num) ? null : num };
}

function isBad(cfg, v) {
  const p = parseLabVal(v);
  if (p.n == null) return false;
  const min = (cfg.min != null && cfg.min !== '') ? Number(cfg.min) : null;
  const max = (cfg.max != null && cfg.max !== '') ? Number(cfg.max) : null;

  if (p.op === '>') return max != null && p.n >= max;   // ">2000" เกิน max = อันตราย
  if (p.op === '<') return min != null && p.n <= min;    // "<200" ต่ำกว่า min = อันตราย
  if (min != null && p.n < min) return true;
  if (max != null && p.n > max) return true;
  return false;
}
function labsOf(panel) {
  return ((PET.data || {}).labs || [])
    .filter((l) => l.panel === panel)
    .sort((a, b) => new Date(b.date) - new Date(a.date));   // ใหม่สุดก่อน
}

let LAB_OPEN = null;   // จำหมวดที่กางไว้ ข้ามการ re-render

function renderLabs(root) {
  const d = PET.data || {};
  const allPanels = d.labPanels || [];
  const hidden = (d.display && d.display.hiddenPanels) || [];
  const panels = allPanels.filter((p) => !hidden.includes(p.id));   // ซ่อนแล้วไม่โผล่ (ข้อมูลยังอยู่)

  root.innerHTML = `
    <div class="edit-bar">
      <span class="section-label" style="margin:0">🧪 ผลเลือด</span>
      ${ROLE.canEdit ? `
        <button class="btn-ghost" id="btnAddPanel">➕ เพิ่มหมวด</button>
        ${allPanels.length ? '<a class="sum-edit-toggle" id="btnMngPanel" style="margin:0">⚙️ ซ่อน/แสดงหมวด</a>' : ''}` : ''}
    </div>
    <div id="labForm"></div>
    <div id="labPanelCfg"></div>
    ${panels.length ? `<div id="labAccs"></div>` :
      (allPanels.length ? '<div class="empty">หมวดทั้งหมดถูกซ่อนอยู่ — กด ⚙️ ซ่อน/แสดงหมวด เพื่อแสดง</div>'
                        : '<div class="empty">ยังไม่มีผลเลือด</div>')}`;

  if (ROLE.canEdit) {
    document.getElementById('btnAddPanel').onclick = openPanelForm;
    const mng = document.getElementById('btnMngPanel');
    if (mng) mng.onclick = () => toggleLabPanelCfg(d, allPanels, hidden);
  }
  if (!panels.length) return;

  const wrap = document.getElementById('labAccs');
  panels.forEach((p) => wrap.appendChild(labAccordion(p)));

  // fill หมวดที่กางไว้ "หลัง" append เข้าหน้าแล้ว (element อยู่ใน document → getElementById เจอ)
  if (LAB_OPEN) {
    const openPanel = panels.find((p) => p.id === LAB_OPEN);
    const openAcc = [...wrap.children].find((el) => el.classList.contains('open'));
    if (openPanel && openAcc) fillLabBody(openAcc.querySelector('.lab-acc-body'), openPanel);
  }
}

let LAB_PANEL_CFG_OPEN = false;
function toggleLabPanelCfg(d, allPanels, hidden) {
  LAB_PANEL_CFG_OPEN = !LAB_PANEL_CFG_OPEN;
  const holder = document.getElementById('labPanelCfg');
  if (!LAB_PANEL_CFG_OPEN) { holder.innerHTML = ''; return; }

  holder.innerHTML = `
    <div class="edit-form">
      <h3>⚙️ ซ่อน/แสดงหมวด</h3>
      <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px">ติ๊กหมวดที่อยากให้แสดง — เอาติ๊กออกเพื่อซ่อน (ข้อมูลไม่หาย กลับมาแสดงได้)</p>
      ${allPanels.map((p) => `
        <label class="tpl-row"><input type="checkbox" data-pan="${p.id}" ${hidden.includes(p.id) ? '' : 'checked'}> ${TC.esc(p.name)}</label>
      `).join('')}
      <div class="btns"><button class="btn" id="panCfgSave">บันทึก</button>
        <button class="btn-ghost" id="panCfgCancel">ปิด</button></div>
      <div class="saving" id="panCfgMsg" style="margin-top:8px"></div>
    </div>`;

  document.getElementById('panCfgCancel').onclick = () => { LAB_PANEL_CFG_OPEN = false; holder.innerHTML = ''; };
  document.getElementById('panCfgSave').onclick = async () => {
    const newHidden = [...holder.querySelectorAll('[data-pan]')].filter((c) => !c.checked).map((c) => c.dataset.pan);
    try {
      const display = JSON.parse(JSON.stringify(d.display || {}));
      display.hiddenPanels = newHidden;
      PET.data = await TC.setPetPath(PET.id, ['display'], display);
      LAB_PANEL_CFG_OPEN = false;
      showTab('labs');
    } catch (e) { document.getElementById('panCfgMsg').textContent = e.message; }
  };
}

function labAccordion(panel) {
  const cfgs = labConfigFor(panel.id);
  const rows = labsOf(panel.id);
  const latest = rows[0];

  // นับค่าผิดปกติของผลล่าสุด
  let warn = 0;
  if (latest) cfgs.forEach((c) => { if (isBad(c, latest.values[c.key])) warn++; });

  const el = document.createElement('div');
  el.className = 'lab-acc' + (LAB_OPEN === panel.id ? ' open' : '');
  el.innerHTML = `
    <div class="lab-acc-head">
      <span class="lab-acc-title">${TC.esc(panel.name)}</span>
      <span class="lab-acc-meta">
        ${latest ? (warn ? `<span class="lab-flag-warn">⚠️ ${warn} ค่าผิดปกติ</span>`
                          : '<span class="lab-flag-ok">✓ ปกติ</span>') : '<span style="color:var(--text-muted)">ยังไม่มีผล</span>'}
        <span class="chev">›</span>
      </span>
    </div>
    <div class="lab-acc-body"></div>`;

  const head = el.querySelector('.lab-acc-head');
  head.onclick = () => {
    const open = el.classList.toggle('open');
    LAB_OPEN = open ? panel.id : null;
    if (open) fillLabBody(el.querySelector('.lab-acc-body'), panel);
  };
  // ⚠️ ไม่ fill ตรงนี้ เพราะ el ยังไม่ถูกใส่เข้าหน้า (detached) — fillLabBody ใช้
  //    document.getElementById ข้างใน จะหา element ไม่เจอ → error null
  //    ให้ renderLabs เรียก fillLabBody หลัง append เข้าหน้าแล้ว
  return el;
}

function fillLabBody(body, panel) {
  const cfgs = labConfigFor(panel.id);
  const rows = labsOf(panel.id);
  const latest = rows[0];
  if (!latest) {
    body.innerHTML = `<div class="empty">ยังไม่มีผลตรวจในหมวดนี้</div>
      ${ROLE.canEdit ? `<div class="inline-actions" style="margin-top:10px;gap:14px;flex-wrap:wrap">
        <a class="act-edit" id="labAddInline-${panel.id}" style="color:var(--sky);font-weight:600">➕ เพิ่มผลตรวจในหมวดนี้</a>
        <a class="act-edit" id="labParams-${panel.id}">⚙️ ค่าตรวจ + เกณฑ์ปกติ</a></div>
      <div id="labFormInline-${panel.id}"></div>
      <div id="paramForm-${panel.id}"></div>` : ''}`;
    if (ROLE.canEdit) {
      document.getElementById(`labAddInline-${panel.id}`).onclick = () =>
        openLabForm(null, `labFormInline-${panel.id}`, panel.id);
      document.getElementById(`labParams-${panel.id}`).onclick = () => openParamEditor(panel.id);
    }
    return;
  }

  // ค่าที่พล็อตกราฟได้ (มีตัวเลขตั้งแต่ 2 ครั้งขึ้นไป) — การ์ดพวกนี้กดดูกราฟได้
  const plottableKeys = new Set(cfgs.filter((c) =>
    rows.filter((r) => parseLabVal(r.values[c.key]).n != null).length >= 2).map((c) => c.key));

  // 1) การ์ดค่าล่าสุด — กดการ์ดที่กราฟได้เพื่อดูแนวโน้ม
  const cards = cfgs.filter((c) => latest.values[c.key] != null && latest.values[c.key] !== '')
    .map((c) => {
      const v = latest.values[c.key];
      const bad = isBad(c, v);
      const canGraph = plottableKeys.has(c.key);
      const rng = (c.min != null && c.min !== '') || (c.max != null && c.max !== '')
        ? `${c.min ?? ''}–${c.max ?? ''}${c.unit ? ' ' + c.unit : ''}` : (c.unit || '');
      return `<div class="lab-val ${bad ? 'bad' : ''} ${canGraph ? 'clickable' : ''}" ${canGraph ? `data-gk="${TC.esc(c.key)}"` : ''}>
        <div class="k">${TC.esc(c.label)}${canGraph ? ' <span class="graph-hint">📈</span>' : ''}</div>
        <div class="v">${TC.esc(String(v))}</div>
        <div class="rng">${TC.esc(rng)}</div>
      </div>`;
    }).join('');

  body.innerHTML = `
    ${ROLE.canEdit ? `<div class="inline-actions" style="margin-bottom:10px;gap:14px;flex-wrap:wrap">
      <a class="act-edit" id="labAddInline-${panel.id}" style="color:var(--sky);font-weight:600">➕ เพิ่มผลตรวจในหมวดนี้</a>
      <a class="act-edit" id="labEditLatest-${panel.id}">✏️ แก้ผลล่าสุด (${TC.thDateShort(latest.date)})</a>
      <a class="act-edit" id="labParams-${panel.id}">⚙️ ค่าตรวจ + เกณฑ์ปกติ</a>
    </div>
    <div id="labFormInline-${panel.id}"></div>
    <div id="paramForm-${panel.id}"></div>` : ''}
    <div class="lab-latest">${cards}</div>
    <div class="lab-latest-date">ผลล่าสุด ${TC.thDate(latest.date)}</div>
    ${latest.note ? `<div class="lab-note">${TC.esc(latest.note)}</div>` : ''}
    ${plottableKeys.size ? `
      <div class="lab-graph-head" id="labGraphHead-${panel.id}"></div>
      <div class="lab-chart-box"><canvas id="labChart-${panel.id}"></canvas></div>` : ''}
    <details class="lab-history">
      <summary>📋 ตารางทุกวันที่ (${rows.length} ครั้ง)</summary>
      <div id="labTbl-${panel.id}"></div>
    </details>`;

  if (plottableKeys.size) {
    const head = document.getElementById(`labGraphHead-${panel.id}`);
    const paint = (key) => {
      const cfg = cfgs.find((c) => c.key === key);
      head.textContent = `📈 แนวโน้ม ${cfg ? cfg.label : ''}`;
      body.querySelectorAll('.lab-val.clickable').forEach((el) =>
        el.classList.toggle('sel', el.dataset.gk === key));
      drawLabChart(panel.id, key);
    };
    body.querySelectorAll('.lab-val[data-gk]').forEach((el) => {
      el.onclick = () => paint(el.dataset.gk);
    });
    // เปิดมาโชว์กราฟของค่าแรกที่กราฟได้ ให้ไม่ว่าง
    paint([...plottableKeys][0]);
  }

  renderLabTable(panel.id, 0);

  if (ROLE.canEdit) {
    // เพิ่มผลตรวจในหมวดนี้ — ฟอร์มโผล่ในหมวดเลย (ไม่เด้งขึ้นบน) + ล็อกหมวดนี้ไว้
    document.getElementById(`labAddInline-${panel.id}`).onclick = () =>
      openLabForm(null, `labFormInline-${panel.id}`, panel.id);
    document.getElementById(`labEditLatest-${panel.id}`).onclick = () => {
      const gi = (PET.data.labs || []).findIndex((l) => l === latest);
      openLabForm(gi, `labFormInline-${panel.id}`);
    };
    document.getElementById(`labParams-${panel.id}`).onclick = () => openParamEditor(panel.id);
  }
}

/* ---------- จัดการค่าตรวจ + เกณฑ์ปกติ (labConfig) ของหมวด ---------- */
function openParamEditor(panelId) {
  const holder = document.getElementById(`paramForm-${panelId}`);

  const rowHTML = (c, i) => `

      <input type="text" class="p-min" inputmode="decimal" value="${c.min ?? ''}" placeholder="ต่ำสุด">
      <input type="text" class="p-max" inputmode="decimal" value="${c.max ?? ''}" placeholder="สูงสุด">

        <a class="rm-param2" title="ลบค่านี้">×</a>
      </span>
    </div>`;

  const panel = ((PET.data || {}).labPanels || []).find((p) => p.id === panelId) || { name: '' };

  holder.innerHTML = `
    <div class="edit-form">
      <h3>⚙️ ตั้งค่าหมวดผลเลือด</h3>
      <div class="fld">
        <label>ชื่อหมวด</label>
        <input type="text" id="pName-${panelId}" value="${TC.esc(panel.name || '')}" placeholder="เช่น CBC (Hematology)">
      </div>
      <label style="font-size:12.5px;color:var(--text-dim);display:block;margin-bottom:4px">ค่าที่ตรวจ + เกณฑ์ปกติ (เว้นเกณฑ์ว่างได้ · นอกช่วง = แดง)</label>
      <div class="param-head">
        <span>ชื่อค่า</span><span>หน่วย</span><span>ปกติต่ำสุด</span><span>ปกติสูงสุด</span><span></span>
      </div>
      <div id="paramRows-${panelId}">${cfgs.map(rowHTML).join('')}</div>
      <button class="btn-ghost" id="pAdd-${panelId}" style="margin-top:8px">➕ เพิ่มค่าตรวจ</button>
      <div class="btns"><button class="btn" id="pSave-${panelId}">บันทึก</button>
        <button class="btn-ghost" id="pCancel-${panelId}">ยกเลิก</button>
        <button class="btn-ghost" id="pDel-${panelId}" style="margin-left:auto;border-color:var(--red);color:var(--red)">🗑 ลบทั้งหมวด</button></div>
      <div class="saving" id="pMsg-${panelId}"></div>
    </div>`;

  document.getElementById(`pDel-${panelId}`).onclick = () => delPanel(panelId, panel.name);

  // เก็บ key เดิมไว้จับคู่ตอนบันทึก (ค่าใหม่ยังไม่มี key)
  const keys = cfgs.map((c) => c.key);
  const newKeys = [];

  const wireRm = () => {
    holder.querySelectorAll('.rm-param2').forEach((x) => x.onclick = () => x.closest('.param-row').remove());
    // เลื่อนขึ้น/ลง — สลับแถวใน DOM (save อ่านตามลำดับ DOM)
    holder.querySelectorAll('.p-up').forEach((b) => b.onclick = () => {
      const row = b.closest('.param-row'), prev = row.previousElementSibling;
      if (prev) row.parentNode.insertBefore(row, prev);
    });
    holder.querySelectorAll('.p-dn').forEach((b) => b.onclick = () => {
      const row = b.closest('.param-row'), next = row.nextElementSibling;
      if (next) row.parentNode.insertBefore(next, row);
    });
  };
  wireRm();

  document.getElementById(`pAdd-${panelId}`).onclick = () => {
    const rows = document.getElementById(`paramRows-${panelId}`);
    const i = keys.length + newKeys.length;
    const nk = 'p_' + Math.random().toString(36).slice(2, 8);
    newKeys.push(nk);
    rows.insertAdjacentHTML('beforeend', rowHTML({ label: '', unit: '', min: '', max: '' }, i));
    // ผูก key ใหม่ให้แถวล่าสุด
    rows.lastElementChild.dataset.newkey = nk;
    wireRm();
  };

  document.getElementById(`pCancel-${panelId}`).onclick = () => { holder.innerHTML = ''; };

  document.getElementById(`pSave-${panelId}`).onclick = async () => {
    const btn = document.getElementById(`pSave-${panelId}`);
    btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    try {
      // อ่านทุกแถวที่เหลือ (ที่ไม่ถูกลบ) เป็น labConfig ใหม่ของหมวดนี้
      const newCfgForPanel = [];
      holder.querySelectorAll('.param-row').forEach((row) => {
        const label = row.querySelector('.p-label').value.trim();
        if (!label) return;   // ไม่มีชื่อ = ข้าม
        const i = Number(row.dataset.i);
        const key = row.dataset.newkey || keys[i] || ('p_' + Math.random().toString(36).slice(2, 8));
        const min = row.querySelector('.p-min').value.trim();
        const max = row.querySelector('.p-max').value.trim();
        newCfgForPanel.push({
          panel: panelId, key, label,
          unit: row.querySelector('.p-unit').value.trim(),
          min: min === '' ? '' : Number(min),
          max: max === '' ? '' : Number(max),
        });
      });

      // รวมกับ labConfig ของหมวดอื่น (แทนที่เฉพาะของหมวดนี้)
      const others = (PET.data.labConfig || []).filter((c) => c.panel !== panelId);
      let d = await TC.setPetPath(PET.id, ['labConfig'], [...others, ...newCfgForPanel]);

      // บันทึกชื่อหมวด (ถ้าเปลี่ยน)
      const newName = document.getElementById(`pName-${panelId}`).value.trim();
      if (newName && newName !== panel.name) {
        const panels = (d.labPanels || []).map((p) => p.id === panelId ? { ...p, name: newName } : p);
        d = await TC.setPetPath(PET.id, ['labPanels'], panels);
      }

      PET.data = d;
      LAB_OPEN = panelId;
      showTab('labs');
    } catch (e) {
      alert(e.message || 'บันทึกไม่สำเร็จ');
      btn.disabled = false; btn.textContent = 'บันทึก';
    }
  };

  holder.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function delPanel(panelId, name) {
  const n = ((PET.data || {}).labs || []).filter((l) => l.panel === panelId).length;

  // เตือน 2 ชั้น + พิมพ์ชื่อยืนยัน (ผลตรวจหลายปีมีค่าพอกับลบสัตว์)
  if (!await TC.confirm(`⚠️ ลบหมวด "${name}" ทั้งหมด\n\nผลตรวจในหมวดนี้ ${n} ครั้ง (ทุกวันที่) จะถูกลบไปด้วย และกู้คืนไม่ได้เลย\n\nถ้าแค่ไม่อยากให้แสดง ให้ใช้ "⚙️ ซ่อน/แสดงหมวด" แทน\n\nดำเนินการต่อ?`)) return;
  if (n > 0) {
    const typed = await TC.prompt(`ยืนยันการลบ — พิมพ์ชื่อหมวดให้ตรง (${name}) แล้วกดตกลง:`);
    if (typed === null) return;
    if (typed.trim() !== name) { alert('ชื่อไม่ตรง — ยกเลิกการลบ ปลอดภัยไว้ก่อน'); return; }
  }
  try {
    const d = PET.data;
    // ลบทั้ง panel + labConfig + labs ของหมวดนี้ (เขียนทีละ path)
    await TC.setPetPath(PET.id, ['labPanels'], (d.labPanels || []).filter((p) => p.id !== panelId));
    await TC.setPetPath(PET.id, ['labConfig'], (d.labConfig || []).filter((c) => c.panel !== panelId));
    PET.data = await TC.setPetPath(PET.id, ['labs'], (d.labs || []).filter((l) => l.panel !== panelId));
    LAB_OPEN = null;
    showTab('labs');
  } catch (e) { alert(e.message || 'ลบไม่สำเร็จ'); }
}

let labChartObj = {};
function drawLabChart(panelId, key) {
  const cfg = labConfigFor(panelId).find((c) => c.key === key);
  const rows = labsOf(panelId).filter((r) => r.values[key] != null && r.values[key] !== '')
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  const cv = document.getElementById(`labChart-${panelId}`);
  if (!cv) return;
  if (labChartObj[panelId]) labChartObj[panelId].destroy();

  labChartObj[panelId] = new Chart(cv, {
    type: 'line',
    data: {
      labels: rows.map((r) => TC.thDateShort(r.date)),
      datasets: [{
        data: rows.map((r) => parseLabVal(r.values[key]).n),   // ">2000" พล็อตที่ 2000
        borderColor: '#5b86bf', backgroundColor: 'rgba(169,196,232,0.22)',
        pointBackgroundColor: rows.map((r) => isBad(cfg, r.values[key]) ? '#d96a6a' : '#5b86bf'),
        pointRadius: 4, tension: 0.3, fill: true,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { title: (t) => t[0].label } } },
      scales: {
        y: { ticks: { color: '#8c7f6f' }, grid: { color: '#efe0cd' } },
        x: { ticks: { color: '#8c7f6f', font: { size: 10 } }, grid: { display: false } },
      },
    },
  });
}

function renderLabTable(panelId, page) {
  const holder = document.getElementById(`labTbl-${panelId}`);
  if (!holder) return;
  const cfgs = labConfigFor(panelId);
  const rows = labsOf(panelId);
  const pages = Math.ceil(rows.length / LAB_PAGE_SIZE);
  const slice = rows.slice(page * LAB_PAGE_SIZE, (page + 1) * LAB_PAGE_SIZE);

  holder.innerHTML = `
    <div class="lab-tbl-scroll">
      <table class="lab-tbl">
        <thead><tr><th>ค่า</th>${slice.map((r) => `<th>${TC.thDateShort(r.date)}</th>`).join('')}</tr></thead>
        <tbody>
          ${cfgs.map((c) => `<tr>
            <td>${TC.esc(c.label)}</td>
            ${slice.map((r) => {
              const v = r.values[c.key];
              const show = (v == null || v === '') ? '' : v;
              return `<td class="${isBad(c, v) ? 'bad' : ''}">${TC.esc(String(show))}</td>`;
            }).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    ${pages > 1 ? `<div class="lab-page">
      <button ${page === 0 ? 'disabled' : ''} data-pg="${page - 1}">‹ ก่อนหน้า</button>
      <span>${page + 1} / ${pages}</span>
      <button ${page >= pages - 1 ? 'disabled' : ''} data-pg="${page + 1}">ถัดไป ›</button>
    </div>` : ''}`;

  holder.querySelectorAll('[data-pg]').forEach((b) => {
    b.onclick = () => renderLabTable(panelId, Number(b.dataset.pg));
  });
}

/* ---------- เพิ่ม/แก้ผลตรวจ ---------- */

let LAB_EDIT = null;   // {panel, extraKeys:[{key,label,unit}...]}

function openLabForm(idx, holderId, forcePanel) {
  const d = PET.data || {};
  const panels = d.labPanels || [];
  if (!panels.length) { alert('ยังไม่มีหมวดผลเลือด — กด "➕ เพิ่มหมวด" ก่อน'); return; }

  const cur = idx == null ? null : d.labs[idx];
  const panel = cur ? cur.panel : (forcePanel || LAB_OPEN || panels[0].id);
  LAB_EDIT = { idx, extraKeys: [], holder: holderId || 'labForm' };

  drawLabForm(panel, cur);
}

function drawLabForm(panelId, cur) {
  const d = PET.data || {};
  const cfgs = labConfigFor(panelId);
  const today = new Date();
  const todayISO = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

  const inputRow = (c) => {
    const v = cur ? (cur.values[c.key] ?? '') : '';
    return `<div class="lab-input">
      <label>${TC.esc(c.label)}${c.unit ? ` <span style="color:var(--text-muted)">${TC.esc(c.unit)}</span>` : ''}</label>
      <input type="text" data-key="${TC.esc(c.key)}" value="${TC.esc(String(v))}">
    </div>`;
  };

  const _lfHolder = (LAB_EDIT && LAB_EDIT.holder) || 'labForm';
  document.getElementById(_lfHolder).innerHTML = `
    <div class="edit-form">
      <h3>${cur ? '✏️ แก้ผลตรวจ' : '➕ เพิ่มผลตรวจ'}</h3>
      <div class="fld">
        <label>วันที่ตรวจ</label>
        <input type="date" id="lfDate" value="${cur ? cur.date : todayISO}">
        <div id="lfDateHint"></div>
        ${(() => {
          const existing = labsOf(panelId).map((r) => r.date);   // เรียงใหม่สุดก่อนแล้ว
          if (!existing.length) return '';
          const SHOW = 12;
          const head = existing.slice(0, SHOW);
          const rest = existing.slice(SHOW);
          return `<div style="margin-top:8px;font-size:11.5px;color:var(--text-dim)">
            มีผลหมวดนี้แล้ว ${existing.length} วัน (กดเพื่อแก้):
            <div class="lab-date-chips">
              ${head.map((dt) => `<span class="lab-date-chip" data-dt="${dt}">${TC.thDateShort(dt)}</span>`).join('')}
              ${rest.length ? `<span class="lab-date-chip" id="lfMoreChips" style="border-style:dashed">+${rest.length} เพิ่มเติม</span>` : ''}
              <span class="lab-date-chips" id="lfRestChips" style="display:none">
                ${rest.map((dt) => `<span class="lab-date-chip" data-dt="${dt}">${TC.thDateShort(dt)}</span>`).join('')}
              </span>
            </div>
          </div>`;
        })()}
      </div>
      <div class="fld">
        <label>ค่าที่ตรวจได้ (กรอกเท่าที่มี เว้นว่างได้)</label>
        <div class="lab-input-grid" id="lfGrid">${cfgs.map(inputRow).join('')}</div>
        <button class="btn-ghost" id="lfAddParam" style="margin-top:10px">➕ เพิ่มค่าที่ไม่มีในรายการ</button>
      </div>
      <div class="fld">
        <label>หมายเหตุ (คำอธิบายจากใบแล็บ)</label>
        <textarea id="lfNote" placeholder="เช่น RBC: Codocyte · Blood parasite: Not Found">${cur ? TC.esc(cur.note || '') : ''}</textarea>
      </div>
      <div class="btns">
        <button class="btn" id="lfSave">บันทึก</button>
        <button class="btn-ghost" id="lfCancel">ยกเลิก</button>
        ${cur ? '<button class="btn-ghost" id="lfDelete" style="margin-left:auto;border-color:var(--red);color:var(--red)">🗑 ลบผลนี้</button>' : ''}
      </div>
      <div class="saving" id="lfMsg" style="margin-top:8px"></div>
    </div>`;

  // ไม่มีตัวเลือกหมวดในฟอร์มแล้ว — ฟอร์มเปิดอยู่ในหมวดของตัวเองเสมอ (panelId มาจากหมวดที่กาง)
  if (cur) document.getElementById('lfDelete').onclick = () => delLab(panelId, cur);

  // ปุ่มกางชิปที่เหลือ (กันชิปพรืดเมื่อมีผลเยอะ)
  const moreBtn = document.getElementById('lfMoreChips');
  if (moreBtn) moreBtn.onclick = () => {
    document.getElementById('lfRestChips').style.display = 'inline';
    moreBtn.remove();
  };

  // ชิปวันที่: กดเพื่อแก้ผลของวันนั้น
  document.querySelectorAll('.lab-date-chip').forEach((chip) => {
    chip.onclick = () => {
      const gi = (PET.data.labs || []).findIndex((l) => l.panel === panelId && l.date === chip.dataset.dt);
      if (gi >= 0) { LAB_EDIT = { idx: gi, extraKeys: [], holder: (LAB_EDIT && LAB_EDIT.holder) || 'labForm' }; drawLabForm(panelId, PET.data.labs[gi]); }
    };
  });

  // เตือนถ้าพิมพ์วันที่ตรงกับผลที่มีอยู่แล้ว (ตอนเพิ่มใหม่)
  const dateInp = document.getElementById('lfDate');
  const checkDup = () => {
    const hint = document.getElementById('lfDateHint');
    if (!hint || cur) return;   // ตอนแก้อยู่แล้วไม่ต้องเตือน
    const dup = labsOf(panelId).find((r) => r.date === dateInp.value);
    hint.innerHTML = dup
      ? `<div class="msg msg-info" style="margin:8px 0 0;padding:8px 12px;font-size:12.5px">
           วันนี้มีผลหมวดนี้อยู่แล้ว — บันทึกจะเพิ่มเป็นอีกรายการ ถ้าต้องการแก้ให้กดชิปวันด้านล่าง</div>`
      : '';
  };
  dateInp.addEventListener('change', checkDup);
  checkDup();

  document.getElementById('lfAddParam').onclick = () => addLabParam(panelId);
  document.getElementById('lfCancel').onclick = () => { LAB_EDIT = null; document.getElementById(_lfHolder).innerHTML = ''; };
  document.getElementById('lfSave').onclick = () => saveLab(panelId, cur);

  // วาดค่าที่เพิ่งเพิ่มระหว่างกรอก (กรณีกด addLabParam แล้ว re-draw)
  LAB_EDIT.extraKeys.forEach((ek) => appendParamInput(ek));

  document.getElementById(_lfHolder).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function addLabParam(panelId) {
  const label = await TC.prompt('ชื่อค่าที่ต้องการเพิ่ม (เช่น Troponin, Cortisol)');
  if (!label) return;
  const unit = await TC.prompt('หน่วย (เว้นว่างได้ เช่น ng/mL)') || '';
  const key = 'p_' + Math.random().toString(36).slice(2, 8);
  const ek = { key, label: label.trim(), unit: unit.trim(), min: '', max: '', _new: true };
  LAB_EDIT.extraKeys.push(ek);
  appendParamInput(ek);
}

function appendParamInput(ek) {
  const grid = document.getElementById('lfGrid');
  if (!grid || grid.querySelector(`[data-key="${ek.key}"]`)) return;
  const div = document.createElement('div');
  div.className = 'lab-input';
  div.innerHTML = `
    <label>${TC.esc(ek.label)}${ek.unit ? ` <span style="color:var(--text-muted)">${TC.esc(ek.unit)}</span>` : ''}
      <span class="rm-param" title="เอาออก">×</span></label>
    <input type="text" data-key="${TC.esc(ek.key)}">`;
  div.querySelector('.rm-param').onclick = () => {
    LAB_EDIT.extraKeys = LAB_EDIT.extraKeys.filter((x) => x.key !== ek.key);
    div.remove();
  };
  grid.appendChild(div);
}

async function saveLab(panelId, cur) {
  const btn = document.getElementById('lfSave');
  const msg = document.getElementById('lfMsg');
  const date = document.getElementById('lfDate').value;
  const note = document.getElementById('lfNote').value.trim();
  if (!date) { alert('กรุณาเลือกวันที่ตรวจ'); return; }

  // เก็บค่าจากทุกช่อง (เว้นว่าง = ไม่บันทึกค่านั้น)
  const values = {};
  document.querySelectorAll('#lfGrid [data-key]').forEach((inp) => {
    const v = inp.value.trim();
    if (v === '') return;
    const num = Number(v);
    values[inp.dataset.key] = Number.isNaN(num) ? v : num;   // ตัวเลขเก็บเป็น number, ที่เหลือเก็บ string
  });

  if (!Object.keys(values).length) { alert('กรุณากรอกค่าอย่างน้อยหนึ่งค่า'); return; }

  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    const d = PET.data || {};

    // ค่าใหม่ที่เพิ่งเพิ่ม → ผนวกเข้า labConfig ก่อน (ถ้ามีค่ากรอกจริง)
    const newCfgs = LAB_EDIT.extraKeys
      .filter((ek) => values[ek.key] != null)
      .map((ek) => ({ panel: panelId, key: ek.key, label: ek.label, unit: ek.unit, min: '', max: '' }));
    if (newCfgs.length) {
      const cfg = [...(d.labConfig || []), ...newCfgs];
      await TC.setPetPath(PET.id, ['labConfig'], cfg);
      d.labConfig = cfg;
    }

    const entry = { date, panel: panelId, values, note };
    const arr = [...(d.labs || [])];
    if (LAB_EDIT.idx != null) arr[LAB_EDIT.idx] = entry;
    else arr.push(entry);

    PET.data = await TC.setPetPath(PET.id, ['labs'], arr);
    LAB_OPEN = panelId;   // กางหมวดนี้ไว้หลังบันทึก
    LAB_EDIT = null;
    showTab('labs');
  } catch (err) {
    alert(err.message || 'บันทึกไม่สำเร็จ');
    btn.disabled = false; btn.textContent = 'บันทึก'; msg.textContent = '';
  }
}

async function delLab(panelId, cur) {
  if (!await TC.confirm(`ลบผลตรวจวันที่ ${TC.thDate(cur.date)} ?\n\nลบแล้วกู้คืนไม่ได้`)) return;
  const arr = (PET.data.labs || []).filter((l) => l !== cur);
  try {
    PET.data = await TC.setPetPath(PET.id, ['labs'], arr);
    LAB_OPEN = panelId;
    LAB_EDIT = null;
    showTab('labs');
  } catch (err) { alert(err.message || 'ลบไม่สำเร็จ'); }
}

      { label: '- Direct (TOTAL BILIRUBIN)', unit: 'mg/dL', min: '', max: '' },
      { label: '- Indirect (TOTAL BILIRUBIN)', unit: 'mg/dL', min: '', max: '' },
      { label: 'TOTAL CALCIUM', unit: 'mg/dL', min: 9.8, max: 12 }, { label: 'PHOSPHORUS', unit: 'mg/dL', min: 2.5, max: 5 },
      { label: 'SODIUM', unit: 'mEq/dL', min: 138, max: 152 }, { label: 'POTASSIUM', unit: 'mEq/dL', min: 3.5, max: 5.1 },
      { label: 'CHLORIDE', unit: 'mEq/dL', min: 109, max: 125 },
