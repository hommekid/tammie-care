<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard 🐾 · Tammie Care</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="theme-color" content="#fdf4eb">
<link rel="stylesheet" href="theme.css?v=8">
<style>
  .panel { display: none; }
  .panel.active { display: block; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .soon { text-align: center; padding: 44px 20px; color: var(--text-muted); font-family: var(--cute); }
  .soon .big { font-size: 34px; display: block; margin-bottom: 8px; }
  .tumor-note { font-size: 12px; color: var(--text-dim); margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>

<header class="tc-header">
  <a class="back" href="index.html">←</a>
  <img class="avatar" id="avatar" alt="" style="display:none">
  <div>
    <h1 id="petName">กำลังโหลด...</h1>
    <div class="sub" id="petSub"></div>
  </div>
  <div class="spacer"></div>
  <span id="rolePill"></span>
</header>

<div class="dash-tabs" id="tabs"></div>

<div class="container" id="content">
  <div class="loading">กำลังโหลด...</div>
</div>

<footer>🐾 Tammie Care · <a href="index.html">หน้าแรก</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script>
// แท็บตามลำดับเดิมของ V1 — Phase นี้ทำ "สรุป" ก่อน ที่เหลือทยอยพอร์ต
const TABS = [
  { key: 'summary', label: '📋 สรุป' },
  { key: 'daily',   label: '🌡️ อาการประจำวัน' },
  { key: 'treat',   label: '🏥 การรักษา' },
  { key: 'labs',    label: '🧪 ผลเลือด' },
  { key: 'meds',    label: '💊 ยา' },
  { key: 'appts',   label: '📅 นัดหมาย' },
];

let PET = null;
let ROLE = { canEdit: false, isAdmin: false, role: null };

(async function main() {
  const user = await TC.requireAuth();
  if (!user) return;

  const id = new URLSearchParams(location.search).get('id');
  if (!id) { location.replace('index.html'); return; }

  ROLE = await TC.getMyRole();
  const role = ROLE;
  if (role.role === 'vet') {
    document.getElementById('rolePill').innerHTML =
      '<span class="pill pill-vet">🩺 ดูอย่างเดียว</span>';
  }

  try {
    PET = await TC.getPet(id);
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="loading">ไม่พบข้อมูล หรือคุณไม่มีสิทธิ์เข้าถึงสัตว์ตัวนี้</div>';
    document.getElementById('petName').textContent = 'เข้าถึงไม่ได้';
    return;
  }

  renderHeader();
  renderTabs();
  showTab('summary');
})();

function renderHeader() {
  const d = PET.data || {}, prof = d.profile || {}, card = d.card || {};
  document.getElementById('petName').textContent = PET.name;

  const bits = [];
  if (card.nickname || prof.nickname) bits.push(card.nickname || prof.nickname);
  if (card.breed || prof.breed) bits.push(card.breed || prof.breed);
  const age = TC.calcAge(card.birthDate || prof.birthDate);
  if (age != null) bits.push(`อายุ ${age} ปี`);
  document.getElementById('petSub').textContent = bits.join(' · ');

  const photo = card.photo || prof.photo;
  if (photo) {
    const img = document.getElementById('avatar');
    img.style.display = '';
    TC.fillImg(img, photo);
  }
}

function renderTabs() {
  const bar = document.getElementById('tabs');
  bar.innerHTML = '';
  TABS.forEach((t) => {
    const b = document.createElement('button');
    b.className = 'dtab';
    b.dataset.key = t.key;
    b.textContent = t.label;
    b.onclick = () => showTab(t.key);
    bar.appendChild(b);
  });
}

function showTab(key) {
  document.querySelectorAll('.dtab').forEach((b) => b.classList.toggle('active', b.dataset.key === key));
  const c = document.getElementById('content');
  c.innerHTML = '';
  if (key === 'summary') renderSummary(c);
  else if (key === 'meds') renderMeds(c);
  else if (key === 'appts') renderAppts(c);
  else if (key === "daily") renderDaily(c);
  else if (key === "treat") renderTreat(c);
  else if (key === "labs") renderLabs(c);
  else c.innerHTML = `<div class="soon"><span class="big">🚧</span>แท็บนี้กำลังพอร์ตมาระบบใหม่<br>
    <span style="font-size:13px">ระหว่างนี้ดูได้จากเว็บเดิม</span></div>`;
}

/* ================= แท็บ 🌡️ อาการประจำวัน ================= */

const SYM_COLORS = { diarrhea: '#d98a3d', general: '#5b8def', nosebleed: '#e85555', vomiting: '#b06be8' };
const SYM_LABELS = { diarrhea: 'ท้องเสีย', general: 'อาการทั่วไป', nosebleed: 'เลือดกำเดา', vomiting: '🤢 อาเจียน' };
const symColor = (src) => SYM_COLORS[src] || '#e8b84b';
const sideLabel = (s) => (s === 'left' ? 'รูจมูกซ้าย' : s === 'right' ? 'รูจมูกขวา' : s || '');

/** หมวดอาการของโปรไฟล์นี้ — ใช้ display.tabs ถ้ามี ไม่มีก็อนุมานจาก symptoms */
function dailyCats(d) {
  const tabs = (d.display && d.display.tabs) || null;
  if (tabs) {
    return tabs.filter((t) => t.source !== 'treatments')
               .map((t) => ({ source: t.source, label: t.label || SYM_LABELS[t.source] || t.source }));
  }
  return Object.keys(d.symptoms || {})
    .map((k) => ({ source: k, label: SYM_LABELS[k] || k }));
}

/* ---------- ปฏิทินกลาง (ใช้ทั้งแท็บอาการและการรักษา) ---------- */

/**
 * สร้างปฏิทินหนึ่งชุดในกล่องที่กำหนด
 *   events   : [{date, ...}] แต่ละรายการต้องมี date รูปแบบ YYYY-MM-DD
 *   dotsOf   : (itemsของวันนั้น) => [สี...]  ใช้วาดจุดใต้ตัวเลขวัน
 *   onDetail : (iso, items, boxEl) => void  วาดรายละเอียดของวันที่เลือก
 * เปิดที่เดือนปัจจุบันเสมอ · ไฮไลต์วันนี้ · กดวันเดิมซ้ำ = ซ่อน
 */
const CAL_VIEW = {};   // จำเดือนที่ดูอยู่ + วันที่เลือก แยกตามปฏิทินแต่ละตัว

/** สั่งให้ปฏิทินไปโฟกัสวันที่นี้ตอนวาดรอบหน้า (ใช้หลังบันทึก) */
function setCalFocus(key, iso) {
  if (!iso) return;
  const d = new Date(iso);
  CAL_VIEW[key] = { ym: `${d.getFullYear()}-${d.getMonth()}`, sel: iso };
}

function buildCalendar(root, { key, events, dotsOf, onDetail }) {
  const now = new Date();
  const keys = new Set(events.map((e) => {
    const d = new Date(e.date); return `${d.getFullYear()}-${d.getMonth()}`;
  }));
  keys.add(`${now.getFullYear()}-${now.getMonth()}`);   // แทรกเดือนปัจจุบันถึงไม่มีข้อมูล

  const st = {
    months: [...keys].map((k) => k.split('-').map(Number)).sort((a, b) => (a[0] - b[0]) || (a[1] - b[1])),
    idx: 0, sel: null,
  };
  st.idx = Math.max(0, st.months.findIndex(([y, m]) => y === now.getFullYear() && m === now.getMonth()));

  // ถ้าเคยดูเดือนอื่นไว้ (หรือเพิ่งบันทึกรายการของเดือนอื่น) ให้กลับไปที่เดือนนั้น
  // ไม่งั้นทุกครั้งที่บันทึกจะเด้งกลับเดือนปัจจุบัน แล้วต้องกดย้อนเองใหม่
  const saved = key && CAL_VIEW[key];
  if (saved) {
    const i = st.months.findIndex(([y, m]) => `${y}-${m}` === saved.ym);
    if (i >= 0) { st.idx = i; st.sel = saved.sel || null; }
  }

  root.innerHTML = `
    <div class="card">
      <div class="cal-nav">
        <button class="calPrev" aria-label="เดือนก่อน">‹</button>
        <span class="cal-title"></span>
        <button class="calNext" aria-label="เดือนถัดไป">›</button>
      </div>
      <div class="cal-grid"></div>
    </div>
    <div class="dayBoxHolder"></div>`;

  const $ = (s) => root.querySelector(s);
  $('.calPrev').onclick = () => { if (st.idx > 0) { st.idx--; st.sel = null; draw(); } };
  $('.calNext').onclick = () => { if (st.idx < st.months.length - 1) { st.idx++; st.sel = null; draw(); } };

  function draw() {
    const [y, m] = st.months[st.idx];
    $('.cal-title').textContent = `${TC.TH_MONTHS[m]} ${y + 543}`;
    $('.calPrev').disabled = st.idx === 0;
    $('.calNext').disabled = st.idx === st.months.length - 1;

    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    const t = new Date();
    const todayISO = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;

    const byDay = {};
    events.forEach((e) => {
      const d = new Date(e.date);
      if (d.getFullYear() === y && d.getMonth() === m) (byDay[d.getDate()] ||= []).push(e);
    });

    let html = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map((s) => `<div class="cal-dow">${s}</div>`).join('');
    for (let i = 0; i < first; i++) html += '<div></div>';

    for (let day = 1; day <= days; day++) {
      const items = byDay[day] || [];
      const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const cls = ['cal-cell'];
      if (items.length) cls.push('has');
      if (iso === todayISO) cls.push('today');
      if (st.sel === iso) cls.push('sel');
      const dots = items.length ? dotsOf(items) : [];
      html += `<div class="${cls.join(' ')}" ${items.length ? `data-iso="${iso}"` : ''}>${day}
        ${dots.length ? `<span class="cell-dots">${dots.map((c) =>
          `<i class="cdot" style="background:${c}"></i>`).join('')}</span>` : ''}
      </div>`;
    }

    const grid = $('.cal-grid');
    grid.innerHTML = html;
    grid.querySelectorAll('[data-iso]').forEach((cell) => {
      cell.onclick = () => {
        st.sel = (st.sel === cell.dataset.iso) ? null : cell.dataset.iso;   // กดซ้ำ = ซ่อน
        draw();
      };
    });

    if (key) CAL_VIEW[key] = { ym: `${y}-${m}`, sel: st.sel };

    const box = $('.dayBoxHolder');
    box.innerHTML = '';
    if (st.sel) onDetail(st.sel, events.filter((e) => e.date === st.sel), box);
  }

  draw();
}

function openLightbox(url) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<span class="close">×</span><img src="${url}" alt="">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}

/** ใส่รูปจาก Storage ลงกล่อง (ต้องขอ signed URL ทีละใบเพราะ bucket เป็น private) */
function attachPhotos(holder, paths) {
  (paths || []).forEach(async (p) => {
    const url = await TC.signedUrl(p);
    if (!url) return;
    const img = document.createElement('img');
    img.src = url;
    img.onclick = () => openLightbox(url);
    holder.appendChild(img);
  });
}

/* ---------- แท็บอาการประจำวัน (ดู + แก้ไข) ---------- */

let SYM_EDIT = null;   // {src, idx|null, photos:[path...], files:[File...]}

function renderDaily(root) {
  const d = PET.data || {};
  const cats = dailyCats(d).filter((c) => ((d.symptoms || {})[c.source] || []).length);

  // หมวดที่เลือกได้ตอนเพิ่มบันทึก — รวมหมวดที่ยังไม่มีข้อมูลด้วย
  const allCats = dailyCats(d);
  const pickCats = allCats.length ? allCats
    : Object.keys(SYM_LABELS).map((k) => ({ source: k, label: SYM_LABELS[k] }));

  const events = [];
  cats.forEach((c) => (d.symptoms[c.source] || []).forEach((it, idx) =>
    events.push({ ...it, _src: c.source, _label: c.label, _idx: idx })));

  root.innerHTML = `
    <div class="edit-bar">
      <span class="section-label" style="margin:0">🌡️ อาการประจำวัน</span>
      ${ROLE.canEdit ? '<button class="btn-ghost" id="btnAddSym">➕ เพิ่มบันทึก</button>' : ''}
      <span class="saving" id="symMsg"></span>
    </div>
    ${cats.length ? `<div class="legend">${cats.map((c) =>
      `<span><i class="dot" style="background:${symColor(c.source)}"></i> ${TC.esc(c.label)}</span>`).join('')}</div>` : ''}
    <div id="symForm"></div>
    ${events.length ? '<div id="dailyCal"></div>' : '<div class="empty">ยังไม่มีบันทึกอาการ</div>'}`;

  if (ROLE.canEdit) {
    document.getElementById('btnAddSym').onclick = () => openSymForm(pickCats, null);
  }

  if (!events.length) return;

  buildCalendar(document.getElementById('dailyCal'), {
    key: 'daily',
    events,
    dotsOf: (items) => [...new Set(items.map((i) => i._src))].map(symColor),
    onDetail: (iso, items, box) => {
      box.innerHTML = `
        <div class="day-box">
          <div class="day-head">📅 ${TC.thDate(iso)} · ${items.length} รายการ</div>
          ${items.map((it, i) => `
            <div class="sym-card" style="border-left-color:${symColor(it._src)}">
              <div class="sym-kind" style="color:${symColor(it._src)}">
                ${TC.esc(it._label)}${it._src === 'nosebleed' && it.side ? ' · ' + TC.esc(sideLabel(it.side)) : ''}
              </div>
              <div class="sym-detail">${TC.esc(it.detail || '')}</div>
              ${(it.photos || []).length ? `<div class="sym-photos" data-i="${i}"></div>` : ''}
              ${ROLE.canEdit ? `<div class="inline-actions">
                <a class="act-edit" data-edit="${it._src}:${it._idx}">แก้</a>
                <a class="act-del" data-del="${it._src}:${it._idx}">ลบ</a>
              </div>` : ''}
            </div>`).join('')}
        </div>`;

      items.forEach((it, i) => {
        const h = box.querySelector(`.sym-photos[data-i="${i}"]`);
        if (h) attachPhotos(h, it.photos);
      });

      box.querySelectorAll('[data-edit]').forEach((a) => {
        a.onclick = () => {
          const [src, idx] = a.dataset.edit.split(':');
          openSymForm(pickCats, { src, idx: Number(idx) });
        };
      });
      box.querySelectorAll('[data-del]').forEach((a) => {
        a.onclick = () => {
          const [src, idx] = a.dataset.del.split(':');
          delSymptom(src, Number(idx));
        };
      });
    },
  });
}

/** เปิดฟอร์มเพิ่ม/แก้บันทึกอาการ · edit = {src, idx} ถ้าเป็นการแก้ */
function openSymForm(cats, edit) {
  const d = PET.data || {};
  const cur = edit ? (d.symptoms[edit.src] || [])[edit.idx] : null;
  SYM_EDIT = {
    src: edit ? edit.src : cats[0].source,
    idx: edit ? edit.idx : null,
    photos: [...((cur && cur.photos) || [])],
    files: [],
  };

  const today = new Date();
  const todayISO = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

  document.getElementById('symForm').innerHTML = `
    <div class="edit-form">
      <h3>${edit ? '✏️ แก้บันทึกอาการ' : '➕ เพิ่มบันทึกอาการ'}</h3>
      <div class="fld">
        <label>หมวดอาการ</label>
        <select id="fSrc">${cats.map((c) =>
          `<option value="${c.source}" ${c.source === SYM_EDIT.src ? 'selected' : ''}>${TC.esc(c.label)}</option>`).join('')}</select>
      </div>
      <div class="fld">
        <label>วันที่</label>
        <input type="date" id="fDate" value="${cur ? cur.date : todayISO}">
      </div>
      <div class="fld" id="fSideWrap" style="display:none">
        <label>รูจมูก</label>
        <select id="fSide">
          <option value="">ไม่ระบุ</option>
          <option value="left" ${cur && cur.side === 'left' ? 'selected' : ''}>ซ้าย</option>
          <option value="right" ${cur && cur.side === 'right' ? 'selected' : ''}>ขวา</option>
        </select>
      </div>
      <div class="fld">
        <label>รายละเอียด</label>
        <textarea id="fDetail" placeholder="อาการเป็นยังไง กินอะไรมา ทำอะไรไปบ้าง...">${cur ? TC.esc(cur.detail || '') : ''}</textarea>
      </div>
      <div class="fld">
        <label>รูปภาพ (เลือกได้หลายรูป · ระบบย่อขนาดให้อัตโนมัติ)</label>
        <input type="file" id="fPhotos" accept="image/*" multiple>
        <div class="thumb-row" id="fThumbs"></div>
      </div>
      <div class="btns">
        <button class="btn" id="fSave">${edit ? 'บันทึกการแก้ไข' : 'บันทึก'}</button>
        <button class="btn-ghost" id="fCancel">ยกเลิก</button>
      </div>
    </div>`;

  const srcSel = document.getElementById('fSrc');
  const syncSide = () => {
    document.getElementById('fSideWrap').style.display = srcSel.value === 'nosebleed' ? '' : 'none';
  };
  srcSel.onchange = syncSide;
  syncSide();

  document.getElementById('fPhotos').onchange = (e) => {
    SYM_EDIT.files.push(...e.target.files);
    e.target.value = '';
    drawThumbs();
  };
  document.getElementById('fCancel').onclick = () => { SYM_EDIT = null; showTab('daily'); };
  document.getElementById('fSave').onclick = saveSymptom;

  drawThumbs();
  document.getElementById('symForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/** รูปเดิม (มี path แล้ว) + รูปใหม่ที่เพิ่งเลือก (ยังไม่อัป) */
function drawThumbs() {
  const box = document.getElementById('fThumbs');
  if (!box) return;
  box.innerHTML = '';

  SYM_EDIT.photos.forEach(async (p, i) => {
    const url = await TC.signedUrl(p);
    const div = document.createElement('div');
    div.className = 'th';
    div.innerHTML = `<img src="${url || ''}" alt=""><button class="rm" title="เอาออก">×</button>`;
    div.querySelector('.rm').onclick = () => { SYM_EDIT.photos.splice(i, 1); drawThumbs(); };
    box.appendChild(div);
  });

  SYM_EDIT.files.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'th';
    const url = URL.createObjectURL(f);
    div.innerHTML = `<img src="${url}" alt=""><button class="rm" title="เอาออก">×</button>`;
    div.querySelector('.rm').onclick = () => { SYM_EDIT.files.splice(i, 1); drawThumbs(); };
    box.appendChild(div);
  });
}

async function saveSymptom() {
  const btn = document.getElementById('fSave');
  const msg = document.getElementById('symMsg');
  const src = document.getElementById('fSrc').value;
  const date = document.getElementById('fDate').value;
  const detail = document.getElementById('fDetail').value.trim();
  const side = document.getElementById('fSide') ? document.getElementById('fSide').value : '';

  if (!date) { alert('กรุณาเลือกวันที่'); return; }
  if (!detail && !SYM_EDIT.photos.length && !SYM_EDIT.files.length) {
    alert('กรุณากรอกรายละเอียด หรือแนบรูปอย่างน้อยหนึ่งรูป'); return;
  }

  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก...';

  try {
    // อัปรูปใหม่ก่อน แล้วค่อยเขียนข้อมูล — ถ้าอัปพัง จะได้ไม่บันทึก path ที่ไม่มีจริง
    const uploaded = [];
    for (const f of SYM_EDIT.files) {
      msg.textContent = `กำลังอัปรูป ${uploaded.length + 1}/${SYM_EDIT.files.length}...`;
      uploaded.push(await TC.uploadPhoto(PET.id, f, src, date));
    }
    msg.textContent = 'กำลังบันทึก...';

    const entry = { date, detail };
    if (src === 'nosebleed' && side) entry.side = side;
    const photos = [...SYM_EDIT.photos, ...uploaded];
    if (photos.length) entry.photos = photos;

    const d = PET.data || {};
    d.symptoms = d.symptoms || {};

    // ถ้าเปลี่ยนหมวดตอนแก้ไข ต้องย้ายข้าม array (ลบของเดิม เพิ่มเข้าหมวดใหม่)
    const movedCat = SYM_EDIT.idx !== null && SYM_EDIT.src !== src;
    if (movedCat) {
      const oldArr = [...(d.symptoms[SYM_EDIT.src] || [])];
      oldArr.splice(SYM_EDIT.idx, 1);
      await TC.setPetPath(PET.id, ['symptoms', SYM_EDIT.src], oldArr);
      d.symptoms[SYM_EDIT.src] = oldArr;
    }

    const arr = [...(d.symptoms[src] || [])];
    if (SYM_EDIT.idx !== null && !movedCat) arr[SYM_EDIT.idx] = entry;
    else arr.unshift(entry);
    arr.sort((a, b) => new Date(b.date) - new Date(a.date));   // ใหม่สุดอยู่บน เหมือน V1

    const fresh = await TC.setPetPath(PET.id, ['symptoms', src], arr);
    PET.data = fresh;   // ใช้ค่าที่ฐานข้อมูลตอบกลับ ไม่ใช่ค่าที่เดาเอง

    setCalFocus('daily', date);
    SYM_EDIT = null;
    showTab('daily');
    document.getElementById('symMsg').textContent = '✅ บันทึกแล้ว';
    setTimeout(() => { const m = document.getElementById('symMsg'); if (m) m.textContent = ''; }, 2500);
  } catch (err) {
    alert(err.message || 'บันทึกไม่สำเร็จ');
    btn.disabled = false;
    btn.textContent = 'บันทึก';
    msg.textContent = '';
  }
}

async function delSymptom(src, idx) {
  const item = (PET.data.symptoms[src] || [])[idx];
  if (!item) return;
  if (!confirm(`ลบบันทึกวันที่ ${TC.thDate(item.date)} ?\n\n${(item.detail || '').slice(0, 80)}`)) return;

  const arr = [...(PET.data.symptoms[src] || [])];
  arr.splice(idx, 1);
  try {
    PET.data = await TC.setPetPath(PET.id, ['symptoms', src], arr);
    showTab('daily');
    // หมายเหตุ: ไม่ลบไฟล์รูปใน Storage — เผื่อกดพลาดจะได้กู้ได้ (ค่อยทำตัวเก็บกวาดทีหลัง)
  } catch (err) {
    alert(err.message || 'ลบไม่สำเร็จ');
  }
}

/* ================= ฟอร์มกลาง (ใช้ร่วมทุกหมวด) ================= */
/*
 * fields: [{key, label, type, options?, placeholder?, half?}]
 *   type: text | date | textarea | select | photos
 * onSave(values, uploadedPhotos) — โยน error ได้ ฟอร์มจะโชว์ข้อความให้เอง
 */
let FORM = null;   // {photos:[path], files:[File], prefix, dateKey}

function openForm(holderId, { title, fields, values = {}, prefix = 'photo', onSave }) {
  const holder = document.getElementById(holderId);
  const photoField = fields.find((f) => f.type === 'photos');
  FORM = { photos: [...((photoField && values[photoField.key]) || [])], files: [], prefix, fields };

  const fieldHTML = (f) => {
    const v = values[f.key] ?? '';
    if (f.type === 'photos') {
      return `<label>${TC.esc(f.label)}</label>
        <input type="file" id="ff-${f.key}" accept="image/*" multiple>
        <div class="thumb-row" id="ffThumbs"></div>`;
    }
    if (f.type === 'textarea') {
      return `<label>${TC.esc(f.label)}</label>
        <textarea id="ff-${f.key}" placeholder="${TC.esc(f.placeholder || '')}">${TC.esc(v)}</textarea>`;
    }
    if (f.type === 'select') {
      return `<label>${TC.esc(f.label)}</label>
        <select id="ff-${f.key}">${f.options.map((o) =>
          `<option value="${TC.esc(o.value)}" ${o.value === v ? 'selected' : ''}>${TC.esc(o.label)}</option>`).join('')}</select>`;
    }
    return `<label>${TC.esc(f.label)}</label>
      <input type="${f.type}" id="ff-${f.key}" value="${TC.esc(v)}" placeholder="${TC.esc(f.placeholder || '')}">`;
  };

  holder.innerHTML = `
    <div class="edit-form">
      <h3>${TC.esc(title)}</h3>
      ${fields.map((f) => `<div class="fld">${fieldHTML(f)}</div>`).join('')}
      <div class="btns">
        <button class="btn" id="ffSave">บันทึก</button>
        <button class="btn-ghost" id="ffCancel">ยกเลิก</button>
      </div>
      <div class="saving" id="ffMsg" style="margin-top:8px"></div>
    </div>`;

  if (photoField) {
    document.getElementById(`ff-${photoField.key}`).onchange = (e) => {
      FORM.files.push(...e.target.files); e.target.value = ''; drawFormThumbs();
    };
    drawFormThumbs();
  }

  document.getElementById('ffCancel').onclick = () => { FORM = null; holder.innerHTML = ''; };
  document.getElementById('ffSave').onclick = async () => {
    const btn = document.getElementById('ffSave');
    const msg = document.getElementById('ffMsg');
    const vals = {};
    fields.forEach((f) => {
      if (f.type === 'photos') return;
      vals[f.key] = document.getElementById(`ff-${f.key}`).value.trim();
    });

    btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    try {
      const uploaded = [];
      for (const file of FORM.files) {
        msg.textContent = `กำลังอัปรูป ${uploaded.length + 1}/${FORM.files.length}...`;
        uploaded.push(await TC.uploadPhoto(PET.id, file, prefix, vals.date || ''));
      }
      msg.textContent = 'กำลังบันทึก...';
      await onSave(vals, [...FORM.photos, ...uploaded]);
      FORM = null;
      holder.innerHTML = '';
    } catch (err) {
      alert(err.message || 'บันทึกไม่สำเร็จ');
      btn.disabled = false; btn.textContent = 'บันทึก'; msg.textContent = '';
    }
  };

  holder.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function drawFormThumbs() {
  const box = document.getElementById('ffThumbs');
  if (!box) return;
  box.innerHTML = '';
  FORM.photos.forEach(async (p, i) => {
    const url = await TC.signedUrl(p);
    const div = document.createElement('div');
    div.className = 'th';
    div.innerHTML = `<img src="${url || ''}" alt=""><button class="rm">×</button>`;
    div.querySelector('.rm').onclick = () => { FORM.photos.splice(i, 1); drawFormThumbs(); };
    box.appendChild(div);
  });
  FORM.files.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'th';
    div.innerHTML = `<img src="${URL.createObjectURL(f)}" alt=""><button class="rm">×</button>`;
    div.querySelector('.rm').onclick = () => { FORM.files.splice(i, 1); drawFormThumbs(); };
    box.appendChild(div);
  });
}

/** ลิงก์ แก้/ลบ ใต้รายการ (โผล่เฉพาะคนที่มีสิทธิ์แก้) */
function actionsHTML(editAttr, delAttr) {
  if (!ROLE.canEdit) return '';
  return `<div class="inline-actions">
    <a class="act-edit" data-edit="${editAttr}">แก้</a>
    <a class="act-del" data-del="${delAttr}">ลบ</a>
  </div>`;
}

function wireActions(box, onEdit, onDel) {
  box.querySelectorAll('[data-edit]').forEach((a) => { a.onclick = () => onEdit(a.dataset.edit); });
  box.querySelectorAll('[data-del]').forEach((a) => { a.onclick = () => onDel(a.dataset.del); });
}

/** บันทึกอาร์เรย์กลับเข้า data แล้ววาดแท็บใหม่ */
async function saveArr(pathKey, arr, tabKey) {
  PET.data = await TC.setPetPath(PET.id, [pathKey], arr);
  showTab(tabKey);
}

let mermaidReady = false;
function initMermaid() {
  if (mermaidReady || !window.mermaid) return;
  // ธีมพาสเทลให้เข้ากับเว็บ (ค่าเดียวกับ V1)
  window.mermaid.initialize({
    startOnLoad: false, theme: 'base',
    themeVariables: {
      primaryColor: '#fbf4ec', primaryBorderColor: '#d99e3e', primaryTextColor: '#4a4035',
      lineColor: '#8c7f6f', secondaryColor: '#e6eef9', tertiaryColor: '#f8e0e0',
      fontFamily: 'Sarabun, sans-serif', fontSize: '14px',
    },
  });
  mermaidReady = true;
}

const TREAT_FIELDS = [
  { key: 'date', label: 'วันที่', type: 'date' },
  { key: 'doctor', label: 'หมอ', type: 'text', placeholder: 'เช่น อ.นิช' },
  { key: 'specialty', label: 'แผนก', type: 'text', placeholder: 'เช่น ทางเดินอาหาร' },
  { key: 'notes', label: 'บันทึก', type: 'textarea', placeholder: 'หมอบอกว่าอะไร ให้ยาอะไร ต้องทำอะไรต่อ...' },
  { key: 'photos', label: 'รูปภาพ (เลือกได้หลายรูป)', type: 'photos' },
  { key: 'flow', label: 'Flowchart (Mermaid) — เว้นว่างได้', type: 'textarea', placeholder: 'flowchart TD\n  A[ตรวจเลือด] --> B[ให้ยา]' },
];

function renderTreat(root) {
  const list = (PET.data || {}).treatments || [];
  const total = list.reduce((n, r) => n + (r.entries || []).length, 0);

  root.innerHTML = `
    <div class="edit-bar">
      <span class="section-label" style="margin:0">🏥 การรักษา (${list.length} วัน · ${total} รายการ)</span>
      ${ROLE.canEdit ? '<button class="btn-ghost" id="btnAddTx">➕ เพิ่มการรักษา</button>' : ''}
    </div>
    <div id="txForm"></div>
    ${list.length ? `<div class="legend"><span><i class="dot" style="background:#d99e3e"></i> วันที่ไปหาหมอ</span></div>
    <div id="treatCal"></div>` : '<div class="empty">ยังไม่มีบันทึกการรักษา</div>'}`;

  if (ROLE.canEdit) document.getElementById('btnAddTx').onclick = () => openTreatForm(null);
  if (!list.length) return;

  buildCalendar(document.getElementById('treatCal'), {
    key: 'treat',
    events: list,
    dotsOf: () => ['#d99e3e'],
    onDetail: (iso, items, box) => {
      // ต้องรู้ตำแหน่งจริงใน array เพื่อแก้/ลบได้ถูกตัว
      const gi = list.findIndex((r) => r.date === iso);
      const entries = (list[gi] || {}).entries || [];

      box.innerHTML = `
        <div class="day-box">
          <div class="day-head">🏥 ${TC.thDate(iso)} · ${entries.length} รายการ</div>
          ${entries.map((e, i) => `
            <div class="tx-entry">
              <div class="tx-doctor">${TC.esc(e.doctor || 'ไม่ระบุหมอ')}${e.specialty ? ' — ' + TC.esc(e.specialty) : ''}</div>
              <div class="tx-notes">${TC.esc(e.notes || '')}</div>
              ${(e.photos || []).length ? `<div class="sym-photos" data-i="${i}"></div>` : ''}
              ${e.flow ? `<div class="tx-flow"><div class="tx-flow-label">🗺 ขั้นตอน/แผนการรักษา</div><div class="mmd" data-i="${i}"></div></div>` : ''}
              ${actionsHTML(`${gi}:${i}`, `${gi}:${i}`)}
            </div>`).join('')}
        </div>`;

      entries.forEach((e, i) => {
        const h = box.querySelector(`.sym-photos[data-i="${i}"]`);
        if (h) attachPhotos(h, e.photos);
        if (e.flow) drawFlow(box.querySelector(`.mmd[data-i="${i}"]`), e.flow, i);
      });

      wireActions(box,
        (v) => { const [g, i] = v.split(':').map(Number); openTreatForm({ g, i }); },
        (v) => { const [g, i] = v.split(':').map(Number); delTreat(g, i); });
    },
  });
}

function openTreatForm(edit) {
  const list = (PET.data || {}).treatments || [];
  const cur = edit ? { ...list[edit.g].entries[edit.i], date: list[edit.g].date } : {};

  openForm('txForm', {
    title: edit ? '✏️ แก้บันทึกการรักษา' : '➕ เพิ่มการรักษา',
    fields: TREAT_FIELDS,
    values: cur,
    prefix: 'treat',
    onSave: async (v, photos) => {
      if (!v.date) throw new Error('กรุณาเลือกวันที่');
      if (!v.doctor && !v.notes) throw new Error('กรุณากรอกชื่อหมอหรือบันทึกอย่างน้อยหนึ่งอย่าง');

      const entry = { doctor: v.doctor, specialty: v.specialty, notes: v.notes };
      if (photos.length) entry.photos = photos;
      if (v.flow) entry.flow = v.flow;

      const arr = JSON.parse(JSON.stringify(list));

      // ลบ entry เดิมออกก่อน (เผื่อมีการเปลี่ยนวันที่ ต้องย้ายข้ามกลุ่ม)
      if (edit) {
        arr[edit.g].entries.splice(edit.i, 1);
        if (!arr[edit.g].entries.length) arr.splice(edit.g, 1);
      }

      const gi = arr.findIndex((r) => r.date === v.date);
      if (gi >= 0) arr[gi].entries.push(entry);
      else arr.push({ date: v.date, entries: [entry] });

      arr.sort((a, b) => new Date(b.date) - new Date(a.date));
      setCalFocus('treat', v.date);
      await saveArr('treatments', arr, 'treat');
    },
  });
}

async function delTreat(g, i) {
  const list = (PET.data || {}).treatments || [];
  const e = (list[g] || {}).entries?.[i];
  if (!e) return;
  if (!confirm(`ลบบันทึกการรักษา ${TC.thDate(list[g].date)}\n${e.doctor || ''} ?`)) return;

  const arr = JSON.parse(JSON.stringify(list));
  arr[g].entries.splice(i, 1);
  if (!arr[g].entries.length) arr.splice(g, 1);
  try { await saveArr('treatments', arr, 'treat'); }
  catch (err) { alert(err.message); }
}

/** เรนเดอร์ flowchart — ไวยากรณ์ผิดก็ไม่ทำให้หน้าพัง (แสดงข้อความแทน) */
async function drawFlow(el, code, i) {
  if (!el) return;
  initMermaid();
  if (!window.mermaid) { el.innerHTML = '<div class="empty">โหลดตัวเรนเดอร์ผังไม่ได้</div>'; return; }
  try {
    const { svg } = await window.mermaid.render(`mmd-${Date.now()}-${i}`, code);
    el.innerHTML = svg;
  } catch (err) {
    el.innerHTML = '<div class="empty">ผังนี้แสดงไม่ได้ (ไวยากรณ์ไม่ถูกต้อง)</div>';
  }
}

  const arr = [...meds];
  arr.splice(idx, 1);
  try { await saveArr('meds', arr, 'meds'); } catch (e) { alert(e.message); }

/* ================= แท็บ 📅 นัดหมาย ================= */

const APPT_FIELDS = [
  { key: 'date', label: 'วันที่นัด', type: 'date' },
  { key: 'doctor', label: 'หมอ / การตรวจ', type: 'text', placeholder: 'เช่น หมอปลาย หรือ ตรวจเลือด' },
  { key: 'note', label: 'หมายเหตุ', type: 'textarea', placeholder: 'เช่น เอาปัสสาวะไปด้วย' },
];

function renderAppts(root) {
  const list = (PET.data || {}).appointments || [];

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const withDiff = list.map((a, i) => {
    const d = new Date(a.date); d.setHours(0, 0, 0, 0);
    return { ...a, d, _idx: i, diff: Math.round((d - today) / 86400000) };
  });
  const upcoming = withDiff.filter((a) => a.diff >= 0).sort((a, b) => a.d - b.d);
  const past = withDiff.filter((a) => a.diff < 0).sort((a, b) => b.d - a.d);

  root.innerHTML = `
    <div class="edit-bar">
      <span class="section-label" style="margin:0">📅 ปฏิทินนัดหมาย</span>
      ${ROLE.canEdit ? '<button class="btn-ghost" id="btnAddAppt">➕ เพิ่มนัด</button>' : ''}
    </div>
    <div id="apptForm"></div>
    ${list.length ? `
      <div class="legend">
        <span><i class="dot" style="background:#d96a6a"></i> วันนี้/พรุ่งนี้</span>
        <span><i class="dot" style="background:#d99e3e"></i> นัดที่จะถึง</span>
        <span><i class="dot" style="background:#b6a795"></i> ผ่านมาแล้ว</span>
      </div>
      <div id="apptCal"></div>

      <div class="section-label" style="margin-top:26px">🔔 นัดที่จะถึง (${upcoming.length})</div>
      <div id="upcomingList">${upcoming.length ? upcoming.map(apptCard).join('') : '<div class="empty">ไม่มีนัดที่จะถึง</div>'}</div>
      ${past.length ? `
        <details class="past-appts">
          <summary>▸ นัดที่ผ่านมาแล้ว (${past.length})</summary>
          <div style="margin-top:10px" id="pastList">${past.map(apptCard).join('')}</div>
        </details>` : ''}
    ` : '<div class="empty">ยังไม่มีนัดหมาย</div>'}`;

  if (ROLE.canEdit) document.getElementById('btnAddAppt').onclick = () => openApptForm(null);
  if (!list.length) return;

  const hook = (el) => { if (el) wireActions(el, (i) => openApptForm(Number(i)), (i) => delAppt(Number(i))); };
  hook(document.getElementById('upcomingList'));
  hook(document.getElementById('pastList'));

  buildCalendar(document.getElementById('apptCal'), {
    key: 'appts',
    events: withDiff,
    // สีจุดบอกสถานะ: แดง = วันนี้/พรุ่งนี้ · ทอง = ยังมาไม่ถึง · เทา = ผ่านไปแล้ว
    dotsOf: (items) => [...new Set(items.map((a) =>
      a.diff < 0 ? '#b6a795' : a.diff <= 1 ? '#d96a6a' : '#d99e3e'))],
    onDetail: (iso, items, box) => {
      box.innerHTML = `
        <div class="day-box">
          <div class="day-head">📅 ${TC.thDate(iso)} · ${items.length} นัด</div>
          ${items.map(apptCard).join('')}
        </div>`;
      hook(box);
    },
  });
}

function apptCard(a) {
  const isPast = a.diff < 0;
  const cls = isPast ? 'past' : a.diff <= 1 ? 'today' : a.diff <= 7 ? 'soon' : '';
  const when = a.diff === 0 ? 'วันนี้' : a.diff === 1 ? 'พรุ่งนี้' : a.diff > 0 ? `อีก ${a.diff} วัน` : '';
  return `
    <div class="appt ${cls}">
      <div class="appt-top">
        <span class="appt-date">${TC.thDate(a.date)}</span>
        <span class="appt-doctor">${TC.esc(a.doctor || '')}</span>
        ${when ? `<span class="appt-when${a.diff <= 1 ? ' urgent' : ''}">${when}</span>` : ''}
      </div>
      ${a.note ? `<div class="appt-note">${TC.esc(a.note)}</div>` : ''}
      ${actionsHTML(a._idx, a._idx)}
    </div>`;
}

function openApptForm(idx) {
  const list = (PET.data || {}).appointments || [];
  openForm('apptForm', {
    title: idx === null ? '➕ เพิ่มนัดหมาย' : '✏️ แก้นัดหมาย',
    fields: APPT_FIELDS,
    values: idx === null ? {} : list[idx],
    onSave: async (v) => {
      if (!v.date) throw new Error('กรุณาเลือกวันที่นัด');
      const arr = [...list];
      const entry = { date: v.date, doctor: v.doctor, note: v.note };
      if (idx === null) arr.push(entry); else arr[idx] = entry;
      arr.sort((a, b) => new Date(a.date) - new Date(b.date));
      setCalFocus('appts', v.date);
      await saveArr('appointments', arr, 'appts');
    },
  });
}

async function delAppt(idx) {
  const list = (PET.data || {}).appointments || [];
  if (!list[idx]) return;
  if (!confirm(`ลบนัด ${TC.thDate(list[idx].date)} ${list[idx].doctor || ''} ?`)) return;
  const arr = [...list];
  arr.splice(idx, 1);
  try { await saveArr('appointments', arr, 'appts'); } catch (e) { alert(e.message); }
}


/* ================= แท็บ 🧪 ผลเลือด ================= */
/*
 * โครงข้อมูล 3 ชั้น:
 *   labPanels[]  = หมวด {id, name}                (เช่น cbc, chem, cardiac)
 *   labConfig[]  = นิยามค่า {panel, key, label, unit, min, max}  (ช่วงปกติ min/max เว้นได้)
 *   labs[]       = ผลแต่ละครั้ง {date, panel, values:{key:number}, note}
 *
 * ความยืดหยุ่น (โจทย์: หมาแต่ละตัวตรวจคนละที่ ค่าไม่เหมือนกัน):
 *   - ฟอร์มเพิ่มผลโชว์ทุกค่าใน labConfig ของหมวดนั้น กรอกเท่าที่มี เว้นว่างได้
 *   - "➕ เพิ่มค่าที่ไม่มีในรายการ" ระหว่างกรอกได้เลย → เพิ่มเข้า labConfig อัตโนมัติ
 *   - "➕ เพิ่มหมวดใหม่" สำหรับที่ตรวจที่มีชุดตรวจต่างไป
 */

const LAB_PAGE_SIZE = 8;

function labConfigFor(panel) {
  return ((PET.data || {}).labConfig || []).filter((c) => c.panel === panel);
}
function isBad(cfg, v) {
  if (v == null || v === '' || Number.isNaN(Number(v))) return false;
  const n = Number(v);
  if (cfg.min != null && cfg.min !== '' && n < Number(cfg.min)) return true;
  if (cfg.max != null && cfg.max !== '' && n > Number(cfg.max)) return true;
  return false;
}
function labsOf(panel) {
  return ((PET.data || {}).labs || [])
    .filter((l) => l.panel === panel)
    .sort((a, b) => new Date(b.date) - new Date(a.date));   // ใหม่สุดก่อน
}

let LAB_OPEN = null;   // จำหมวดที่กางไว้ ข้ามการ re-render

function renderLabs(root) {
  const d = PET.data || {};
  const panels = d.labPanels || [];

  root.innerHTML = `
    <div class="edit-bar">
      <span class="section-label" style="margin:0">🧪 ผลเลือด</span>
      ${ROLE.canEdit ? `
        <button class="btn-ghost" id="btnAddLab">➕ เพิ่มผลตรวจ</button>
        <button class="btn-ghost" id="btnAddPanel">➕ เพิ่มหมวด</button>` : ''}
    </div>
    <div id="labForm"></div>
    ${panels.length ? `<div id="labAccs"></div>` : '<div class="empty">ยังไม่มีผลเลือด</div>'}`;

  if (ROLE.canEdit) {
    document.getElementById('btnAddLab').onclick = () => openLabForm(null);
    document.getElementById('btnAddPanel').onclick = openPanelForm;
  }
  if (!panels.length) return;

  const wrap = document.getElementById('labAccs');
  panels.forEach((p) => wrap.appendChild(labAccordion(p)));
}

function labAccordion(panel) {
  const cfgs = labConfigFor(panel.id);
  const rows = labsOf(panel.id);
  const latest = rows[0];

  // นับค่าผิดปกติของผลล่าสุด
  let warn = 0;
  if (latest) cfgs.forEach((c) => { if (isBad(c, latest.values[c.key])) warn++; });

  const el = document.createElement('div');
  el.className = 'lab-acc' + (LAB_OPEN === panel.id ? ' open' : '');
  el.innerHTML = `
    <div class="lab-acc-head">
      <span class="lab-acc-title">${TC.esc(panel.name)}</span>
      <span class="lab-acc-meta">
        ${latest ? (warn ? `<span class="lab-flag-warn">⚠️ ${warn} ค่าผิดปกติ</span>`
                          : '<span class="lab-flag-ok">✓ ปกติ</span>') : '<span style="color:var(--text-muted)">ยังไม่มีผล</span>'}
        <span class="chev">›</span>
      </span>
    </div>
    <div class="lab-acc-body"></div>`;

  const head = el.querySelector('.lab-acc-head');
  head.onclick = () => {
    const open = el.classList.toggle('open');
    LAB_OPEN = open ? panel.id : null;
    if (open) fillLabBody(el.querySelector('.lab-acc-body'), panel);
  };
  if (LAB_OPEN === panel.id) fillLabBody(el.querySelector('.lab-acc-body'), panel);
  return el;
}

function fillLabBody(body, panel) {
  const cfgs = labConfigFor(panel.id);
  const rows = labsOf(panel.id);
  const latest = rows[0];
  if (!latest) { body.innerHTML = '<div class="empty">ยังไม่มีผลตรวจในหมวดนี้</div>'; return; }

  // 1) การ์ดค่าล่าสุด
  const cards = cfgs.filter((c) => latest.values[c.key] != null && latest.values[c.key] !== '')
    .map((c) => {
      const v = latest.values[c.key];
      const bad = isBad(c, v);
      const rng = (c.min != null && c.min !== '') || (c.max != null && c.max !== '')
        ? `${c.min ?? ''}–${c.max ?? ''}${c.unit ? ' ' + c.unit : ''}` : (c.unit || '');
      return `<div class="lab-val ${bad ? 'bad' : ''}">
        <div class="k">${TC.esc(c.label)}</div>
        <div class="v">${TC.esc(String(v))}</div>
        <div class="rng">${TC.esc(rng)}</div>
      </div>`;
    }).join('');

  // 2) ตัวเลือกค่าไว้พล็อตกราฟแนวโน้ม (ค่าที่มีตัวเลขตั้งแต่ 2 ครั้งขึ้นไป)
  const plottable = cfgs.filter((c) => rows.filter((r) => r.values[c.key] != null && r.values[c.key] !== '').length >= 2);

  body.innerHTML = `
    <div class="lab-latest">${cards}</div>
    <div class="lab-latest-date">ผลล่าสุด ${TC.thDate(latest.date)}</div>
    ${latest.note ? `<div class="lab-note">${TC.esc(latest.note)}</div>` : ''}
    ${plottable.length ? `
      <select class="lab-select" id="labSel-${panel.id}">
        ${plottable.map((c) => `<option value="${c.key}">${TC.esc(c.label)}</option>`).join('')}
      </select>
      <div class="lab-chart-box"><canvas id="labChart-${panel.id}"></canvas></div>` : ''}
    <details class="lab-history">
      <summary>📋 ตารางทุกวันที่ (${rows.length} ครั้ง)</summary>
      <div id="labTbl-${panel.id}"></div>
    </details>
    ${ROLE.canEdit ? `<div class="inline-actions" style="margin-top:12px">
      <a class="act-edit" id="labEditLatest-${panel.id}">✏️ แก้ผลล่าสุด (${TC.thDateShort(latest.date)})</a>
    </div>` : ''}`;

  if (plottable.length) {
    const sel = document.getElementById(`labSel-${panel.id}`);
    const paint = () => drawLabChart(panel.id, sel.value);
    sel.onchange = paint;
    paint();
  }

  renderLabTable(panel.id, 0);

  if (ROLE.canEdit) {
    document.getElementById(`labEditLatest-${panel.id}`).onclick = () => {
      const gi = (PET.data.labs || []).findIndex((l) => l === latest);
      openLabForm(gi);
    };
  }
}

let labChartObj = {};
function drawLabChart(panelId, key) {
  const cfg = labConfigFor(panelId).find((c) => c.key === key);
  const rows = labsOf(panelId).filter((r) => r.values[key] != null && r.values[key] !== '')
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  const cv = document.getElementById(`labChart-${panelId}`);
  if (!cv) return;
  if (labChartObj[panelId]) labChartObj[panelId].destroy();

  labChartObj[panelId] = new Chart(cv, {
    type: 'line',
    data: {
      labels: rows.map((r) => TC.thDateShort(r.date)),
      datasets: [{
        data: rows.map((r) => Number(r.values[key])),
        borderColor: '#5b86bf', backgroundColor: 'rgba(169,196,232,0.22)',
        pointBackgroundColor: rows.map((r) => isBad(cfg, r.values[key]) ? '#d96a6a' : '#5b86bf'),
        pointRadius: 4, tension: 0.3, fill: true,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { title: (t) => t[0].label } } },
      scales: {
        y: { ticks: { color: '#8c7f6f' }, grid: { color: '#efe0cd' } },
        x: { ticks: { color: '#8c7f6f', font: { size: 10 } }, grid: { display: false } },
      },
    },
  });
}

function renderLabTable(panelId, page) {
  const holder = document.getElementById(`labTbl-${panelId}`);
  if (!holder) return;
  const cfgs = labConfigFor(panelId);
  const rows = labsOf(panelId);
  const pages = Math.ceil(rows.length / LAB_PAGE_SIZE);
  const slice = rows.slice(page * LAB_PAGE_SIZE, (page + 1) * LAB_PAGE_SIZE);

  holder.innerHTML = `
    <div class="lab-tbl-scroll">
      <table class="lab-tbl">
        <thead><tr><th>ค่า</th>${slice.map((r) => `<th>${TC.thDateShort(r.date)}</th>`).join('')}</tr></thead>
        <tbody>
          ${cfgs.map((c) => `<tr>
            <td>${TC.esc(c.label)}</td>
            ${slice.map((r) => {
              const v = r.values[c.key];
              const show = (v == null || v === '') ? '' : v;
              return `<td class="${isBad(c, v) ? 'bad' : ''}">${TC.esc(String(show))}</td>`;
            }).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    ${pages > 1 ? `<div class="lab-page">
      <button ${page === 0 ? 'disabled' : ''} data-pg="${page - 1}">‹ ก่อนหน้า</button>
      <span>${page + 1} / ${pages}</span>
      <button ${page >= pages - 1 ? 'disabled' : ''} data-pg="${page + 1}">ถัดไป ›</button>
    </div>` : ''}`;

  holder.querySelectorAll('[data-pg]').forEach((b) => {
    b.onclick = () => renderLabTable(panelId, Number(b.dataset.pg));
  });
}

/* ---------- เพิ่ม/แก้ผลตรวจ ---------- */

let LAB_EDIT = null;   // {panel, extraKeys:[{key,label,unit}...]}

function openLabForm(idx) {
  const d = PET.data || {};
  const panels = d.labPanels || [];
  if (!panels.length) { alert('ยังไม่มีหมวดผลเลือด — กด "➕ เพิ่มหมวด" ก่อน'); return; }

  const cur = idx == null ? null : d.labs[idx];
  const panel = cur ? cur.panel : (LAB_OPEN || panels[0].id);
  LAB_EDIT = { idx, extraKeys: [] };

  drawLabForm(panel, cur);
}

function drawLabForm(panelId, cur) {
  const d = PET.data || {};
  const panels = d.labPanels || [];
  const cfgs = labConfigFor(panelId);
  const today = new Date();
  const todayISO = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

  const inputRow = (c) => {
    const v = cur ? (cur.values[c.key] ?? '') : '';
    return `<div class="lab-input">
      <label>${TC.esc(c.label)}${c.unit ? ` <span style="color:var(--text-muted)">${TC.esc(c.unit)}</span>` : ''}</label>
      <input type="text" inputmode="decimal" data-key="${TC.esc(c.key)}" value="${TC.esc(String(v))}">
    </div>`;
  };

  document.getElementById('labForm').innerHTML = `
    <div class="edit-form">
      <h3>${cur ? '✏️ แก้ผลตรวจ' : '➕ เพิ่มผลตรวจ'}</h3>
      <div class="fld">
        <label>หมวด</label>
        <select id="lfPanel" ${cur ? 'disabled' : ''}>
          ${panels.map((p) => `<option value="${p.id}" ${p.id === panelId ? 'selected' : ''}>${TC.esc(p.name)}</option>`).join('')}
        </select>
      </div>
      <div class="fld">
        <label>วันที่ตรวจ</label>
        <input type="date" id="lfDate" value="${cur ? cur.date : todayISO}">
        <div id="lfDateHint"></div>
        ${(() => {
          const existing = labsOf(panelId).map((r) => r.date);   // เรียงใหม่สุดก่อนแล้ว
          if (!existing.length) return '';
          const SHOW = 12;
          const head = existing.slice(0, SHOW);
          const rest = existing.slice(SHOW);
          return `<div style="margin-top:8px;font-size:11.5px;color:var(--text-dim)">
            มีผลหมวดนี้แล้ว ${existing.length} วัน (กดเพื่อแก้):
            <div class="lab-date-chips">
              ${head.map((dt) => `<span class="lab-date-chip" data-dt="${dt}">${TC.thDateShort(dt)}</span>`).join('')}
              ${rest.length ? `<span class="lab-date-chip" id="lfMoreChips" style="border-style:dashed">+${rest.length} เพิ่มเติม</span>` : ''}
              <span class="lab-date-chips" id="lfRestChips" style="display:none">
                ${rest.map((dt) => `<span class="lab-date-chip" data-dt="${dt}">${TC.thDateShort(dt)}</span>`).join('')}
              </span>
            </div>
          </div>`;
        })()}
      </div>
      <div class="fld">
        <label>ค่าที่ตรวจได้ (กรอกเท่าที่มี เว้นว่างได้)</label>
        <div class="lab-input-grid" id="lfGrid">${cfgs.map(inputRow).join('')}</div>
        <button class="btn-ghost" id="lfAddParam" style="margin-top:10px">➕ เพิ่มค่าที่ไม่มีในรายการ</button>
      </div>
      <div class="fld">
        <label>หมายเหตุ (คำอธิบายจากใบแล็บ)</label>
        <textarea id="lfNote" placeholder="เช่น RBC: Codocyte · Blood parasite: Not Found">${cur ? TC.esc(cur.note || '') : ''}</textarea>
      </div>
      <div class="btns">
        <button class="btn" id="lfSave">บันทึก</button>
        <button class="btn-ghost" id="lfCancel">ยกเลิก</button>
      </div>
      <div class="saving" id="lfMsg" style="margin-top:8px"></div>
    </div>`;

  // เปลี่ยนหมวด (เฉพาะตอนเพิ่มใหม่) → วาดช่องกรอกใหม่ตาม labConfig ของหมวดนั้น
  if (!cur) document.getElementById('lfPanel').onchange = (e) => { LAB_EDIT.extraKeys = []; drawLabForm(e.target.value, null); };

  // ปุ่มกางชิปที่เหลือ (กันชิปพรืดเมื่อมีผลเยอะ)
  const moreBtn = document.getElementById('lfMoreChips');
  if (moreBtn) moreBtn.onclick = () => {
    document.getElementById('lfRestChips').style.display = 'inline';
    moreBtn.remove();
  };

  // ชิปวันที่: กดเพื่อแก้ผลของวันนั้น
  document.querySelectorAll('.lab-date-chip').forEach((chip) => {
    chip.onclick = () => {
      const gi = (PET.data.labs || []).findIndex((l) => l.panel === panelId && l.date === chip.dataset.dt);
      if (gi >= 0) { LAB_EDIT = { idx: gi, extraKeys: [] }; drawLabForm(panelId, PET.data.labs[gi]); }
    };
  });

  // เตือนถ้าพิมพ์วันที่ตรงกับผลที่มีอยู่แล้ว (ตอนเพิ่มใหม่)
  const dateInp = document.getElementById('lfDate');
  const checkDup = () => {
    const hint = document.getElementById('lfDateHint');
    if (!hint || cur) return;   // ตอนแก้อยู่แล้วไม่ต้องเตือน
    const dup = labsOf(panelId).find((r) => r.date === dateInp.value);
    hint.innerHTML = dup
      ? `<div class="msg msg-info" style="margin:8px 0 0;padding:8px 12px;font-size:12.5px">
           วันนี้มีผลหมวดนี้อยู่แล้ว — บันทึกจะเพิ่มเป็นอีกรายการ ถ้าต้องการแก้ให้กดชิปวันด้านล่าง</div>`
      : '';
  };
  dateInp.addEventListener('change', checkDup);
  checkDup();

  document.getElementById('lfAddParam').onclick = () => addLabParam(panelId);
  document.getElementById('lfCancel').onclick = () => { LAB_EDIT = null; document.getElementById('labForm').innerHTML = ''; };
  document.getElementById('lfSave').onclick = () => saveLab(panelId, cur);

  // วาดค่าที่เพิ่งเพิ่มระหว่างกรอก (กรณีกด addLabParam แล้ว re-draw)
  LAB_EDIT.extraKeys.forEach((ek) => appendParamInput(ek));

  document.getElementById('labForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function addLabParam(panelId) {
  const label = prompt('ชื่อค่าที่ต้องการเพิ่ม (เช่น Troponin, Cortisol)');
  if (!label) return;
  const unit = prompt('หน่วย (เว้นว่างได้ เช่น ng/mL)') || '';
  const key = 'p_' + Math.random().toString(36).slice(2, 8);
  const ek = { key, label: label.trim(), unit: unit.trim(), min: '', max: '', _new: true };
  LAB_EDIT.extraKeys.push(ek);
  appendParamInput(ek);
}

function appendParamInput(ek) {
  const grid = document.getElementById('lfGrid');
  if (!grid || grid.querySelector(`[data-key="${ek.key}"]`)) return;
  const div = document.createElement('div');
  div.className = 'lab-input';
  div.innerHTML = `
    <label>${TC.esc(ek.label)}${ek.unit ? ` <span style="color:var(--text-muted)">${TC.esc(ek.unit)}</span>` : ''}
      <span class="rm-param" title="เอาออก">×</span></label>
    <input type="text" inputmode="decimal" data-key="${TC.esc(ek.key)}">`;
  div.querySelector('.rm-param').onclick = () => {
    LAB_EDIT.extraKeys = LAB_EDIT.extraKeys.filter((x) => x.key !== ek.key);
    div.remove();
  };
  grid.appendChild(div);
}

async function saveLab(panelId, cur) {
  const btn = document.getElementById('lfSave');
  const msg = document.getElementById('lfMsg');
  const date = document.getElementById('lfDate').value;
  const note = document.getElementById('lfNote').value.trim();
  if (!date) { alert('กรุณาเลือกวันที่ตรวจ'); return; }

  // เก็บค่าจากทุกช่อง (เว้นว่าง = ไม่บันทึกค่านั้น)
  const values = {};
  document.querySelectorAll('#lfGrid [data-key]').forEach((inp) => {
    const v = inp.value.trim();
    if (v === '') return;
    const num = Number(v);
    values[inp.dataset.key] = Number.isNaN(num) ? v : num;   // ตัวเลขเก็บเป็น number, ที่เหลือเก็บ string
  });

  if (!Object.keys(values).length) { alert('กรุณากรอกค่าอย่างน้อยหนึ่งค่า'); return; }

  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    const d = PET.data || {};

    // ค่าใหม่ที่เพิ่งเพิ่ม → ผนวกเข้า labConfig ก่อน (ถ้ามีค่ากรอกจริง)
    const newCfgs = LAB_EDIT.extraKeys
      .filter((ek) => values[ek.key] != null)
      .map((ek) => ({ panel: panelId, key: ek.key, label: ek.label, unit: ek.unit, min: '', max: '' }));
    if (newCfgs.length) {
      const cfg = [...(d.labConfig || []), ...newCfgs];
      await TC.setPetPath(PET.id, ['labConfig'], cfg);
      d.labConfig = cfg;
    }

    const entry = { date, panel: panelId, values, note };
    const arr = [...(d.labs || [])];
    if (LAB_EDIT.idx != null) arr[LAB_EDIT.idx] = entry;
    else arr.push(entry);

    PET.data = await TC.setPetPath(PET.id, ['labs'], arr);
    LAB_OPEN = panelId;   // กางหมวดนี้ไว้หลังบันทึก
    LAB_EDIT = null;
    showTab('labs');
  } catch (err) {
    alert(err.message || 'บันทึกไม่สำเร็จ');
    btn.disabled = false; btn.textContent = 'บันทึก'; msg.textContent = '';
  }
}

function openPanelForm() {
  openForm('labForm', {
    title: '➕ เพิ่มหมวดผลเลือด',
    fields: [
      { key: 'name', label: 'ชื่อหมวด', type: 'text', placeholder: 'เช่น Urinalysis, Thyroid Panel' },
    ],
    onSave: async (v) => {
      if (!v.name) throw new Error('กรุณากรอกชื่อหมวด');
      const id = 'panel_' + Math.random().toString(36).slice(2, 7);
      const panels = [...((PET.data || {}).labPanels || []), { id, name: v.name }];
      PET.data = await TC.setPetPath(PET.id, ['labPanels'], panels);
      LAB_OPEN = id;
      showTab('labs');
    },
  });
}


/* ================= แท็บสรุป ================= */
function renderSummary(root) {
  const d = PET.data || {};
  const wrap = document.createElement('div');
  wrap.className = 'stack';

  const hidden = (d.display && d.display.hidden) || [];
  const show = (k) => !hidden.includes(k);

  if (show('leuco') && d.leucoPlus) wrap.appendChild(leucoBox(d));
  if (show('danger') && d.dangerSigns) { const el = dangerBox(d.dangerSigns); if (el) wrap.appendChild(el); }
  if (show('watch') && (d.watchList || []).length) wrap.appendChild(watchBox(d.watchList));

  const tumor = (d.vitals && d.vitals.liverTumor) || [];
  if (show('tumor') && tumor.length) wrap.appendChild(tumorChart(tumor));

  if (!wrap.children.length) wrap.innerHTML = '<div class="empty">ยังไม่มีข้อมูลสรุปสำหรับน้องตัวนี้</div>';
  root.appendChild(wrap);
}

/* ---- ไฟเตือน Leuco Plus (เทียบ WBC ดิบ 🔴<4000 / 🟡4000-4499 / 🟢≥4500) ---- */
function leucoBox(d) {
  const lp = d.leucoPlus;
  const labs = (d.labs || []).filter((l) => l.values && l.values.wbc != null);
  labs.sort((a, b) => new Date(b.date) - new Date(a.date));
  const latest = labs[0];

  let cls = 'lp-gray', verdict = 'ยังไม่มีผล WBC', detail = '';

  if (latest) {
    let wbc = Number(latest.values.wbc);
    if (lp.wbcInThousands) wbc = wbc * 1000;   // เผื่อโปรไฟล์ที่เก็บเป็นพัน
    const always = lp.alwaysBelow ?? 4000;
    const withSym = lp.withSymptomsBelow ?? 4500;

    if (wbc < always) { cls = 'lp-red'; verdict = `🔴 WBC ${wbc.toLocaleString()} — ต่ำกว่า ${always.toLocaleString()} ควรฉีด Leuco Plus แม้อาการปกติ`; }
    else if (wbc < withSym) { cls = 'lp-yellow'; verdict = `🟡 WBC ${wbc.toLocaleString()} — ต่ำกว่า ${withSym.toLocaleString()} ถ้ามีอาการอื่นร่วมด้วยควรฉีด`; }
    else { cls = 'lp-green'; verdict = `🟢 WBC ${wbc.toLocaleString()} — อยู่ในเกณฑ์ ยังไม่ต้องฉีด`; }

    detail = `ผลล่าสุด ${TC.thDate(latest.date)}`;
  }

  const el = document.createElement('div');
  el.className = `leuco-box ${cls}`;
  el.innerHTML = `
    <div class="lp-head">💉 ${TC.esc(lp.title || 'เกณฑ์ฉีด Leuco Plus')}</div>
    <div class="lp-verdict">${TC.esc(verdict)}</div>
    ${detail ? `<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;font-family:var(--mono)">${TC.esc(detail)}</div>` : ''}
    ${(lp.rules || []).length ? `<ul class="lp-rules">${lp.rules.map((r) => `<li>${TC.esc(r)}</li>`).join('')}</ul>` : ''}
  `;
  return el;
}

/* ---- กล่องแดง: สัญญาณต้องไปหาหมอทันที (liverFailure + wbc) ---- */
function dangerBox(ds) {
  const items = [...(ds.liverFailure || []), ...(ds.wbc || [])];
  if (!items.length) return null;
  const el = document.createElement('div');
  el.className = 'alert-box';
  el.innerHTML = `
    <div class="icon">🚨</div>
    <div style="flex:1">
      <div class="title">สัญญาณต้องไปหาหมอทันที</div>
      <ul>${items.map((t) => `<li>${TC.esc(t)}</li>`).join('')}</ul>
      ${ds.nosebleed ? `<div style="margin-top:10px;font-size:12.5px;color:#8a2b2b" class="pre-line"><b>เลือดกำเดา — ปฐมพยาบาล:</b>\n${TC.esc(ds.nosebleed)}</div>` : ''}
    </div>`;
  return el;
}

/* ---- สิ่งที่ต้องติดตาม ---- */
function watchBox(list) {
  const el = document.createElement('div');
  el.className = 'watch-box';
  el.innerHTML = `
    <div class="title">📋 สิ่งที่ต้องติดตาม</div>
    <ul>${list.map((t) => `<li>${TC.esc(t)}</li>`).join('')}</ul>`;
  return el;
}

/* ---- กราฟขนาดก้อนในตับ ---- */
function tumorChart(rows) {
  const el = document.createElement('div');
  el.className = 'chart-wrap';
  el.innerHTML = `
    <div class="section-label">📈 ขนาดก้อนในตับ (cm)</div>
    <div class="tumor-box"><canvas></canvas></div>
    <div class="tumor-note" id="tumorNotes"></div>`;

  const pts = rows.filter((r) => r.size != null)
                  .sort((a, b) => new Date(a.date) - new Date(b.date));

  setTimeout(() => {
    if (!pts.length) { el.querySelector('.tumor-box').innerHTML = '<div class="empty">ยังไม่มีค่าที่วัดได้</div>'; }
    else {
      new Chart(el.querySelector('canvas'), {
        type: 'line',
        data: {
          labels: pts.map((p) => TC.thDateShort(p.date)),
          datasets: [{
            data: pts.map((p) => p.size),
            borderColor: '#5b86bf', backgroundColor: 'rgba(169,196,232,0.25)',
            pointBackgroundColor: pts.map((p) => (p.alert ? '#d96a6a' : '#5b86bf')),
            pointRadius: 4, tension: 0.3, fill: true,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { color: '#8c7f6f' }, grid: { color: '#efe0cd' } },
            x: { ticks: { color: '#8c7f6f', font: { size: 10 } }, grid: { display: false } },
          },
        },
      });
    }
    // บันทึกล่าสุด 3 รายการ (รวมรายการที่ไม่มีตัวเลข เช่น "มีก้อนเพิ่ม")
    const notes = rows.filter((r) => r.note).slice(-3).reverse();
    el.querySelector('#tumorNotes').innerHTML = notes
      .map((n) => `<div>${n.alert ? '⚠️ ' : '· '}<b>${TC.thDateShort(n.date)}</b> — ${TC.esc(n.note)}</div>`)
      .join('');
  }, 0);

  return el;
}
</script>
