/* ================= แท็บ 🧪 ผลเลือด ================= */
/*
 * โครงข้อมูล 3 ชั้น:
 *   labPanels[]  = หมวด {id, name}                (เช่น cbc, chem, cardiac)
 *   labConfig[]  = นิยามค่า {panel, key, label, unit, min, max}  (ช่วงปกติ min/max เว้นได้)
 *   labs[]       = ผลแต่ละครั้ง {date, panel, values:{key:number}, note}
 *
 * ความยืดหยุ่น (โจทย์: หมาแต่ละตัวตรวจคนละที่ ค่าไม่เหมือนกัน):
 *   - ฟอร์มเพิ่มผลโชว์ทุกค่าใน labConfig ของหมวดนั้น กรอกเท่าที่มี เว้นว่างได้
 *   - "➕ เพิ่มค่าที่ไม่มีในรายการ" ระหว่างกรอกได้เลย → เพิ่มเข้า labConfig อัตโนมัติ
 *   - "➕ เพิ่มหมวดใหม่" สำหรับที่ตรวจที่มีชุดตรวจต่างไป
 */

const LAB_PAGE_SIZE = 8;

function labConfigFor(panel) {
  return ((PET.data || {}).labConfig || []).filter((c) => c.panel === panel);
}
// แยกค่าผลเลือดที่อาจมีเครื่องหมาย < > (เครื่องนับไม่ได้) ออกเป็น {op, n}
//   ">2000" = ค่าจริงสูงกว่า 2000 · "<200" = ค่าจริงต่ำกว่า 200
function parseLabVal(v) {
  if (typeof v === 'number') return { op: '', n: v };
  const s = String(v ?? '').trim();
  const m = s.match(/^([<>]=?)\s*(-?\d+\.?\d*)/);
  if (m) return { op: m[1][0], n: Number(m[2]) };
  const num = Number(s);
  return { op: '', n: Number.isNaN(num) ? null : num };
}

function isBad(cfg, v) {
  const p = parseLabVal(v);
  if (p.n == null) return false;
  const min = (cfg.min != null && cfg.min !== '') ? Number(cfg.min) : null;
  const max = (cfg.max != null && cfg.max !== '') ? Number(cfg.max) : null;

  if (p.op === '>') return max != null && p.n >= max;   // ">2000" เกิน max = อันตราย
  if (p.op === '<') return min != null && p.n <= min;    // "<200" ต่ำกว่า min = อันตราย
  if (min != null && p.n < min) return true;
  if (max != null && p.n > max) return true;
  return false;
}
function labsOf(panel) {
  return ((PET.data || {}).labs || [])
    .filter((l) => l.panel === panel)
    .sort((a, b) => new Date(b.date) - new Date(a.date));   // ใหม่สุดก่อน
}

let LAB_OPEN = null;   // จำหมวดที่กางไว้ ข้ามการ re-render

function renderLabs(root) {
  const d = PET.data || {};
  const panels = d.labPanels || [];

  root.innerHTML = `
    <div class="edit-bar">
      <span class="section-label" style="margin:0">🧪 ผลเลือด</span>
      ${ROLE.canEdit ? `
        <button class="btn-ghost" id="btnAddLab">➕ เพิ่มผลตรวจ</button>
        <button class="btn-ghost" id="btnAddPanel">➕ เพิ่มหมวด</button>` : ''}
    </div>
    <div id="labForm"></div>
    ${panels.length ? `<div id="labAccs"></div>` : '<div class="empty">ยังไม่มีผลเลือด</div>'}`;

  if (ROLE.canEdit) {
    document.getElementById('btnAddLab').onclick = () => openLabForm(null);
    document.getElementById('btnAddPanel').onclick = openPanelForm;
  }
  if (!panels.length) return;

  const wrap = document.getElementById('labAccs');
  panels.forEach((p) => wrap.appendChild(labAccordion(p)));

  // fill หมวดที่กางไว้ "หลัง" append เข้าหน้าแล้ว (element อยู่ใน document → getElementById เจอ)
  if (LAB_OPEN) {
    const openPanel = panels.find((p) => p.id === LAB_OPEN);
    const openAcc = [...wrap.children].find((el) => el.classList.contains('open'));
    if (openPanel && openAcc) fillLabBody(openAcc.querySelector('.lab-acc-body'), openPanel);
  }
}

function labAccordion(panel) {
  const cfgs = labConfigFor(panel.id);
  const rows = labsOf(panel.id);
  const latest = rows[0];

  // นับค่าผิดปกติของผลล่าสุด
  let warn = 0;
  if (latest) cfgs.forEach((c) => { if (isBad(c, latest.values[c.key])) warn++; });

  const el = document.createElement('div');
  el.className = 'lab-acc' + (LAB_OPEN === panel.id ? ' open' : '');
  el.innerHTML = `
    <div class="lab-acc-head">
      <span class="lab-acc-title">${TC.esc(panel.name)}</span>
      <span class="lab-acc-meta">
        ${latest ? (warn ? `<span class="lab-flag-warn">⚠️ ${warn} ค่าผิดปกติ</span>`
                          : '<span class="lab-flag-ok">✓ ปกติ</span>') : '<span style="color:var(--text-muted)">ยังไม่มีผล</span>'}
        <span class="chev">›</span>
      </span>
    </div>
    <div class="lab-acc-body"></div>`;

  const head = el.querySelector('.lab-acc-head');
  head.onclick = () => {
    const open = el.classList.toggle('open');
    LAB_OPEN = open ? panel.id : null;
    if (open) fillLabBody(el.querySelector('.lab-acc-body'), panel);
  };
  // ⚠️ ไม่ fill ตรงนี้ เพราะ el ยังไม่ถูกใส่เข้าหน้า (detached) — fillLabBody ใช้
  //    document.getElementById ข้างใน จะหา element ไม่เจอ → error null
  //    ให้ renderLabs เรียก fillLabBody หลัง append เข้าหน้าแล้ว
  return el;
}

function fillLabBody(body, panel) {
  const cfgs = labConfigFor(panel.id);
  const rows = labsOf(panel.id);
  const latest = rows[0];
  if (!latest) {
    body.innerHTML = `<div class="empty">ยังไม่มีผลตรวจในหมวดนี้</div>
      ${ROLE.canEdit ? `<div class="inline-actions" style="margin-top:10px">
        <a class="act-edit" id="labParams-${panel.id}">⚙️ ตั้งค่าที่ตรวจ + เกณฑ์ปกติ</a></div>
      <div id="paramForm-${panel.id}"></div>` : ''}`;
    if (ROLE.canEdit) document.getElementById(`labParams-${panel.id}`).onclick = () => openParamEditor(panel.id);
    return;
  }

  // ค่าที่พล็อตกราฟได้ (มีตัวเลขตั้งแต่ 2 ครั้งขึ้นไป) — การ์ดพวกนี้กดดูกราฟได้
  const plottableKeys = new Set(cfgs.filter((c) =>
    rows.filter((r) => parseLabVal(r.values[c.key]).n != null).length >= 2).map((c) => c.key));

  // 1) การ์ดค่าล่าสุด — กดการ์ดที่กราฟได้เพื่อดูแนวโน้ม
  const cards = cfgs.filter((c) => latest.values[c.key] != null && latest.values[c.key] !== '')
    .map((c) => {
      const v = latest.values[c.key];
      const bad = isBad(c, v);
      const canGraph = plottableKeys.has(c.key);
      const rng = (c.min != null && c.min !== '') || (c.max != null && c.max !== '')
        ? `${c.min ?? ''}–${c.max ?? ''}${c.unit ? ' ' + c.unit : ''}` : (c.unit || '');
      return `<div class="lab-val ${bad ? 'bad' : ''} ${canGraph ? 'clickable' : ''}" ${canGraph ? `data-gk="${TC.esc(c.key)}"` : ''}>
        <div class="k">${TC.esc(c.label)}${canGraph ? ' <span class="graph-hint">📈</span>' : ''}</div>
        <div class="v">${TC.esc(String(v))}</div>
        <div class="rng">${TC.esc(rng)}</div>
      </div>`;
    }).join('');

  body.innerHTML = `
    <div class="lab-latest">${cards}</div>
    <div class="lab-latest-date">ผลล่าสุด ${TC.thDate(latest.date)}</div>
    ${latest.note ? `<div class="lab-note">${TC.esc(latest.note)}</div>` : ''}
    ${plottableKeys.size ? `
      <div class="lab-graph-head" id="labGraphHead-${panel.id}"></div>
      <div class="lab-chart-box"><canvas id="labChart-${panel.id}"></canvas></div>` : ''}
    <details class="lab-history">
      <summary>📋 ตารางทุกวันที่ (${rows.length} ครั้ง)</summary>
      <div id="labTbl-${panel.id}"></div>
    </details>
    ${ROLE.canEdit ? `<div class="inline-actions" style="margin-top:12px;gap:14px">
      <a class="act-edit" id="labEditLatest-${panel.id}">✏️ แก้ผลล่าสุด (${TC.thDateShort(latest.date)})</a>
      <a class="act-edit" id="labParams-${panel.id}">⚙️ ค่าตรวจ + เกณฑ์ปกติ</a>
    </div>
    <div id="paramForm-${panel.id}"></div>` : ''}`;

  if (plottableKeys.size) {
    const head = document.getElementById(`labGraphHead-${panel.id}`);
    const paint = (key) => {
      const cfg = cfgs.find((c) => c.key === key);
      head.textContent = `📈 แนวโน้ม ${cfg ? cfg.label : ''}`;
      body.querySelectorAll('.lab-val.clickable').forEach((el) =>
        el.classList.toggle('sel', el.dataset.gk === key));
      drawLabChart(panel.id, key);
    };
    body.querySelectorAll('.lab-val[data-gk]').forEach((el) => {
      el.onclick = () => paint(el.dataset.gk);
    });
    // เปิดมาโชว์กราฟของค่าแรกที่กราฟได้ ให้ไม่ว่าง
    paint([...plottableKeys][0]);
  }

  renderLabTable(panel.id, 0);

  if (ROLE.canEdit) {
    document.getElementById(`labEditLatest-${panel.id}`).onclick = () => {
      const gi = (PET.data.labs || []).findIndex((l) => l === latest);
      openLabForm(gi);
    };
    document.getElementById(`labParams-${panel.id}`).onclick = () => openParamEditor(panel.id);
  }
}

/* ---------- จัดการค่าตรวจ + เกณฑ์ปกติ (labConfig) ของหมวด ---------- */
function openParamEditor(panelId) {
  const holder = document.getElementById(`paramForm-${panelId}`);
  const cfgs = labConfigFor(panelId);

  const rowHTML = (c, i) => `
    <div class="param-row" data-i="${i}">
      <input type="text" class="p-label" value="${TC.esc(c.label || '')}" placeholder="ชื่อค่า เช่น WBC">
      <input type="text" class="p-unit" value="${TC.esc(c.unit || '')}" placeholder="หน่วย">
      <input type="text" class="p-min" inputmode="decimal" value="${c.min ?? ''}" placeholder="ต่ำสุด">
      <input type="text" class="p-max" inputmode="decimal" value="${c.max ?? ''}" placeholder="สูงสุด">
      <a class="rm-param2" title="ลบค่านี้">×</a>
    </div>`;

  const panel = ((PET.data || {}).labPanels || []).find((p) => p.id === panelId) || { name: '' };

  holder.innerHTML = `
    <div class="edit-form">
      <h3>⚙️ ตั้งค่าหมวดผลเลือด</h3>
      <div class="fld">
        <label>ชื่อหมวด</label>
        <input type="text" id="pName-${panelId}" value="${TC.esc(panel.name || '')}" placeholder="เช่น CBC (Hematology)">
      </div>
      <label style="font-size:12.5px;color:var(--text-dim);display:block;margin-bottom:4px">ค่าที่ตรวจ + เกณฑ์ปกติ (เว้นเกณฑ์ว่างได้ · นอกช่วง = แดง)</label>
      <div class="param-head">
        <span>ชื่อค่า</span><span>หน่วย</span><span>ปกติต่ำสุด</span><span>ปกติสูงสุด</span><span></span>
      </div>
      <div id="paramRows-${panelId}">${cfgs.map(rowHTML).join('')}</div>
      <button class="btn-ghost" id="pAdd-${panelId}" style="margin-top:8px">➕ เพิ่มค่าตรวจ</button>
      <div class="btns"><button class="btn" id="pSave-${panelId}">บันทึก</button>
        <button class="btn-ghost" id="pCancel-${panelId}">ยกเลิก</button>
        <button class="btn-ghost" id="pDel-${panelId}" style="margin-left:auto;border-color:var(--red);color:var(--red)">🗑 ลบทั้งหมวด</button></div>
      <div class="saving" id="pMsg-${panelId}"></div>
    </div>`;

  document.getElementById(`pDel-${panelId}`).onclick = () => delPanel(panelId, panel.name);

  // เก็บ key เดิมไว้จับคู่ตอนบันทึก (ค่าใหม่ยังไม่มี key)
  const keys = cfgs.map((c) => c.key);
  const newKeys = [];

  const wireRm = () => holder.querySelectorAll('.rm-param2').forEach((x) => x.onclick = () => {
    x.closest('.param-row').remove();
  });
  wireRm();

  document.getElementById(`pAdd-${panelId}`).onclick = () => {
    const rows = document.getElementById(`paramRows-${panelId}`);
    const i = keys.length + newKeys.length;
    const nk = 'p_' + Math.random().toString(36).slice(2, 8);
    newKeys.push(nk);
    rows.insertAdjacentHTML('beforeend', rowHTML({ label: '', unit: '', min: '', max: '' }, i));
    // ผูก key ใหม่ให้แถวล่าสุด
    rows.lastElementChild.dataset.newkey = nk;
    wireRm();
  };

  document.getElementById(`pCancel-${panelId}`).onclick = () => { holder.innerHTML = ''; };

  document.getElementById(`pSave-${panelId}`).onclick = async () => {
    const btn = document.getElementById(`pSave-${panelId}`);
    btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    try {
      // อ่านทุกแถวที่เหลือ (ที่ไม่ถูกลบ) เป็น labConfig ใหม่ของหมวดนี้
      const newCfgForPanel = [];
      holder.querySelectorAll('.param-row').forEach((row) => {
        const label = row.querySelector('.p-label').value.trim();
        if (!label) return;   // ไม่มีชื่อ = ข้าม
        const i = Number(row.dataset.i);
        const key = row.dataset.newkey || keys[i] || ('p_' + Math.random().toString(36).slice(2, 8));
        const min = row.querySelector('.p-min').value.trim();
        const max = row.querySelector('.p-max').value.trim();
        newCfgForPanel.push({
          panel: panelId, key, label,
          unit: row.querySelector('.p-unit').value.trim(),
          min: min === '' ? '' : Number(min),
          max: max === '' ? '' : Number(max),
        });
      });

      // รวมกับ labConfig ของหมวดอื่น (แทนที่เฉพาะของหมวดนี้)
      const others = (PET.data.labConfig || []).filter((c) => c.panel !== panelId);
      let d = await TC.setPetPath(PET.id, ['labConfig'], [...others, ...newCfgForPanel]);

      // บันทึกชื่อหมวด (ถ้าเปลี่ยน)
      const newName = document.getElementById(`pName-${panelId}`).value.trim();
      if (newName && newName !== panel.name) {
        const panels = (d.labPanels || []).map((p) => p.id === panelId ? { ...p, name: newName } : p);
        d = await TC.setPetPath(PET.id, ['labPanels'], panels);
      }

      PET.data = d;
      LAB_OPEN = panelId;
      showTab('labs');
    } catch (e) {
      alert(e.message || 'บันทึกไม่สำเร็จ');
      btn.disabled = false; btn.textContent = 'บันทึก';
    }
  };

  holder.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function delPanel(panelId, name) {
  const n = ((PET.data || {}).labs || []).filter((l) => l.panel === panelId).length;
  if (!confirm(`ลบหมวด "${name}" ทั้งหมด?\n\nผลตรวจในหมวดนี้ ${n} ครั้ง จะถูกลบไปด้วย · กู้คืนไม่ได้`)) return;
  try {
    const d = PET.data;
    // ลบทั้ง panel + labConfig + labs ของหมวดนี้ (เขียนทีละ path)
    await TC.setPetPath(PET.id, ['labPanels'], (d.labPanels || []).filter((p) => p.id !== panelId));
    await TC.setPetPath(PET.id, ['labConfig'], (d.labConfig || []).filter((c) => c.panel !== panelId));
    PET.data = await TC.setPetPath(PET.id, ['labs'], (d.labs || []).filter((l) => l.panel !== panelId));
    LAB_OPEN = null;
    showTab('labs');
  } catch (e) { alert(e.message || 'ลบไม่สำเร็จ'); }
}

let labChartObj = {};
function drawLabChart(panelId, key) {
  const cfg = labConfigFor(panelId).find((c) => c.key === key);
  const rows = labsOf(panelId).filter((r) => r.values[key] != null && r.values[key] !== '')
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  const cv = document.getElementById(`labChart-${panelId}`);
  if (!cv) return;
  if (labChartObj[panelId]) labChartObj[panelId].destroy();

  labChartObj[panelId] = new Chart(cv, {
    type: 'line',
    data: {
      labels: rows.map((r) => TC.thDateShort(r.date)),
      datasets: [{
        data: rows.map((r) => parseLabVal(r.values[key]).n),   // ">2000" พล็อตที่ 2000
        borderColor: '#5b86bf', backgroundColor: 'rgba(169,196,232,0.22)',
        pointBackgroundColor: rows.map((r) => isBad(cfg, r.values[key]) ? '#d96a6a' : '#5b86bf'),
        pointRadius: 4, tension: 0.3, fill: true,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { title: (t) => t[0].label } } },
      scales: {
        y: { ticks: { color: '#8c7f6f' }, grid: { color: '#efe0cd' } },
        x: { ticks: { color: '#8c7f6f', font: { size: 10 } }, grid: { display: false } },
      },
    },
  });
}

function renderLabTable(panelId, page) {
  const holder = document.getElementById(`labTbl-${panelId}`);
  if (!holder) return;
  const cfgs = labConfigFor(panelId);
  const rows = labsOf(panelId);
  const pages = Math.ceil(rows.length / LAB_PAGE_SIZE);
  const slice = rows.slice(page * LAB_PAGE_SIZE, (page + 1) * LAB_PAGE_SIZE);

  holder.innerHTML = `
    <div class="lab-tbl-scroll">
      <table class="lab-tbl">
        <thead><tr><th>ค่า</th>${slice.map((r) => `<th>${TC.thDateShort(r.date)}</th>`).join('')}</tr></thead>
        <tbody>
          ${cfgs.map((c) => `<tr>
            <td>${TC.esc(c.label)}</td>
            ${slice.map((r) => {
              const v = r.values[c.key];
              const show = (v == null || v === '') ? '' : v;
              return `<td class="${isBad(c, v) ? 'bad' : ''}">${TC.esc(String(show))}</td>`;
            }).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    ${pages > 1 ? `<div class="lab-page">
      <button ${page === 0 ? 'disabled' : ''} data-pg="${page - 1}">‹ ก่อนหน้า</button>
      <span>${page + 1} / ${pages}</span>
      <button ${page >= pages - 1 ? 'disabled' : ''} data-pg="${page + 1}">ถัดไป ›</button>
    </div>` : ''}`;

  holder.querySelectorAll('[data-pg]').forEach((b) => {
    b.onclick = () => renderLabTable(panelId, Number(b.dataset.pg));
  });
}

/* ---------- เพิ่ม/แก้ผลตรวจ ---------- */

let LAB_EDIT = null;   // {panel, extraKeys:[{key,label,unit}...]}

function openLabForm(idx) {
  const d = PET.data || {};
  const panels = d.labPanels || [];
  if (!panels.length) { alert('ยังไม่มีหมวดผลเลือด — กด "➕ เพิ่มหมวด" ก่อน'); return; }

  const cur = idx == null ? null : d.labs[idx];
  const panel = cur ? cur.panel : (LAB_OPEN || panels[0].id);
  LAB_EDIT = { idx, extraKeys: [] };

  drawLabForm(panel, cur);
}

function drawLabForm(panelId, cur) {
  const d = PET.data || {};
  const panels = d.labPanels || [];
  const cfgs = labConfigFor(panelId);
  const today = new Date();
  const todayISO = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

  const inputRow = (c) => {
    const v = cur ? (cur.values[c.key] ?? '') : '';
    return `<div class="lab-input">
      <label>${TC.esc(c.label)}${c.unit ? ` <span style="color:var(--text-muted)">${TC.esc(c.unit)}</span>` : ''}</label>
      <input type="text" data-key="${TC.esc(c.key)}" value="${TC.esc(String(v))}">
    </div>`;
  };

  document.getElementById('labForm').innerHTML = `
    <div class="edit-form">
      <h3>${cur ? '✏️ แก้ผลตรวจ' : '➕ เพิ่มผลตรวจ'}</h3>
      <div class="fld">
        <label>หมวด</label>
        <select id="lfPanel" ${cur ? 'disabled' : ''}>
          ${panels.map((p) => `<option value="${p.id}" ${p.id === panelId ? 'selected' : ''}>${TC.esc(p.name)}</option>`).join('')}
        </select>
      </div>
      <div class="fld">
        <label>วันที่ตรวจ</label>
        <input type="date" id="lfDate" value="${cur ? cur.date : todayISO}">
        <div id="lfDateHint"></div>
        ${(() => {
          const existing = labsOf(panelId).map((r) => r.date);   // เรียงใหม่สุดก่อนแล้ว
          if (!existing.length) return '';
          const SHOW = 12;
          const head = existing.slice(0, SHOW);
          const rest = existing.slice(SHOW);
          return `<div style="margin-top:8px;font-size:11.5px;color:var(--text-dim)">
            มีผลหมวดนี้แล้ว ${existing.length} วัน (กดเพื่อแก้):
            <div class="lab-date-chips">
              ${head.map((dt) => `<span class="lab-date-chip" data-dt="${dt}">${TC.thDateShort(dt)}</span>`).join('')}
              ${rest.length ? `<span class="lab-date-chip" id="lfMoreChips" style="border-style:dashed">+${rest.length} เพิ่มเติม</span>` : ''}
              <span class="lab-date-chips" id="lfRestChips" style="display:none">
                ${rest.map((dt) => `<span class="lab-date-chip" data-dt="${dt}">${TC.thDateShort(dt)}</span>`).join('')}
              </span>
            </div>
          </div>`;
        })()}
      </div>
      <div class="fld">
        <label>ค่าที่ตรวจได้ (กรอกเท่าที่มี เว้นว่างได้)</label>
        <div class="lab-input-grid" id="lfGrid">${cfgs.map(inputRow).join('')}</div>
        <button class="btn-ghost" id="lfAddParam" style="margin-top:10px">➕ เพิ่มค่าที่ไม่มีในรายการ</button>
      </div>
      <div class="fld">
        <label>หมายเหตุ (คำอธิบายจากใบแล็บ)</label>
        <textarea id="lfNote" placeholder="เช่น RBC: Codocyte · Blood parasite: Not Found">${cur ? TC.esc(cur.note || '') : ''}</textarea>
      </div>
      <div class="btns">
        <button class="btn" id="lfSave">บันทึก</button>
        <button class="btn-ghost" id="lfCancel">ยกเลิก</button>
        ${cur ? '<button class="btn-ghost" id="lfDelete" style="margin-left:auto;border-color:var(--red);color:var(--red)">🗑 ลบผลนี้</button>' : ''}
      </div>
      <div class="saving" id="lfMsg" style="margin-top:8px"></div>
    </div>`;

  // เปลี่ยนหมวด (เฉพาะตอนเพิ่มใหม่) → วาดช่องกรอกใหม่ตาม labConfig ของหมวดนั้น
  if (!cur) document.getElementById('lfPanel').onchange = (e) => { LAB_EDIT.extraKeys = []; drawLabForm(e.target.value, null); };
  if (cur) document.getElementById('lfDelete').onclick = () => delLab(panelId, cur);

  // ปุ่มกางชิปที่เหลือ (กันชิปพรืดเมื่อมีผลเยอะ)
  const moreBtn = document.getElementById('lfMoreChips');
  if (moreBtn) moreBtn.onclick = () => {
    document.getElementById('lfRestChips').style.display = 'inline';
    moreBtn.remove();
  };

  // ชิปวันที่: กดเพื่อแก้ผลของวันนั้น
  document.querySelectorAll('.lab-date-chip').forEach((chip) => {
    chip.onclick = () => {
      const gi = (PET.data.labs || []).findIndex((l) => l.panel === panelId && l.date === chip.dataset.dt);
      if (gi >= 0) { LAB_EDIT = { idx: gi, extraKeys: [] }; drawLabForm(panelId, PET.data.labs[gi]); }
    };
  });

  // เตือนถ้าพิมพ์วันที่ตรงกับผลที่มีอยู่แล้ว (ตอนเพิ่มใหม่)
  const dateInp = document.getElementById('lfDate');
  const checkDup = () => {
    const hint = document.getElementById('lfDateHint');
    if (!hint || cur) return;   // ตอนแก้อยู่แล้วไม่ต้องเตือน
    const dup = labsOf(panelId).find((r) => r.date === dateInp.value);
    hint.innerHTML = dup
      ? `<div class="msg msg-info" style="margin:8px 0 0;padding:8px 12px;font-size:12.5px">
           วันนี้มีผลหมวดนี้อยู่แล้ว — บันทึกจะเพิ่มเป็นอีกรายการ ถ้าต้องการแก้ให้กดชิปวันด้านล่าง</div>`
      : '';
  };
  dateInp.addEventListener('change', checkDup);
  checkDup();

  document.getElementById('lfAddParam').onclick = () => addLabParam(panelId);
  document.getElementById('lfCancel').onclick = () => { LAB_EDIT = null; document.getElementById('labForm').innerHTML = ''; };
  document.getElementById('lfSave').onclick = () => saveLab(panelId, cur);

  // วาดค่าที่เพิ่งเพิ่มระหว่างกรอก (กรณีกด addLabParam แล้ว re-draw)
  LAB_EDIT.extraKeys.forEach((ek) => appendParamInput(ek));

  document.getElementById('labForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function addLabParam(panelId) {
  const label = prompt('ชื่อค่าที่ต้องการเพิ่ม (เช่น Troponin, Cortisol)');
  if (!label) return;
  const unit = prompt('หน่วย (เว้นว่างได้ เช่น ng/mL)') || '';
  const key = 'p_' + Math.random().toString(36).slice(2, 8);
  const ek = { key, label: label.trim(), unit: unit.trim(), min: '', max: '', _new: true };
  LAB_EDIT.extraKeys.push(ek);
  appendParamInput(ek);
}

function appendParamInput(ek) {
  const grid = document.getElementById('lfGrid');
  if (!grid || grid.querySelector(`[data-key="${ek.key}"]`)) return;
  const div = document.createElement('div');
  div.className = 'lab-input';
  div.innerHTML = `
    <label>${TC.esc(ek.label)}${ek.unit ? ` <span style="color:var(--text-muted)">${TC.esc(ek.unit)}</span>` : ''}
      <span class="rm-param" title="เอาออก">×</span></label>
    <input type="text" data-key="${TC.esc(ek.key)}">`;
  div.querySelector('.rm-param').onclick = () => {
    LAB_EDIT.extraKeys = LAB_EDIT.extraKeys.filter((x) => x.key !== ek.key);
    div.remove();
  };
  grid.appendChild(div);
}

async function saveLab(panelId, cur) {
  const btn = document.getElementById('lfSave');
  const msg = document.getElementById('lfMsg');
  const date = document.getElementById('lfDate').value;
  const note = document.getElementById('lfNote').value.trim();
  if (!date) { alert('กรุณาเลือกวันที่ตรวจ'); return; }

  // เก็บค่าจากทุกช่อง (เว้นว่าง = ไม่บันทึกค่านั้น)
  const values = {};
  document.querySelectorAll('#lfGrid [data-key]').forEach((inp) => {
    const v = inp.value.trim();
    if (v === '') return;
    const num = Number(v);
    values[inp.dataset.key] = Number.isNaN(num) ? v : num;   // ตัวเลขเก็บเป็น number, ที่เหลือเก็บ string
  });

  if (!Object.keys(values).length) { alert('กรุณากรอกค่าอย่างน้อยหนึ่งค่า'); return; }

  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    const d = PET.data || {};

    // ค่าใหม่ที่เพิ่งเพิ่ม → ผนวกเข้า labConfig ก่อน (ถ้ามีค่ากรอกจริง)
    const newCfgs = LAB_EDIT.extraKeys
      .filter((ek) => values[ek.key] != null)
      .map((ek) => ({ panel: panelId, key: ek.key, label: ek.label, unit: ek.unit, min: '', max: '' }));
    if (newCfgs.length) {
      const cfg = [...(d.labConfig || []), ...newCfgs];
      await TC.setPetPath(PET.id, ['labConfig'], cfg);
      d.labConfig = cfg;
    }

    const entry = { date, panel: panelId, values, note };
    const arr = [...(d.labs || [])];
    if (LAB_EDIT.idx != null) arr[LAB_EDIT.idx] = entry;
    else arr.push(entry);

    PET.data = await TC.setPetPath(PET.id, ['labs'], arr);
    LAB_OPEN = panelId;   // กางหมวดนี้ไว้หลังบันทึก
    LAB_EDIT = null;
    showTab('labs');
  } catch (err) {
    alert(err.message || 'บันทึกไม่สำเร็จ');
    btn.disabled = false; btn.textContent = 'บันทึก'; msg.textContent = '';
  }
}

async function delLab(panelId, cur) {
  if (!confirm(`ลบผลตรวจวันที่ ${TC.thDate(cur.date)} ?\n\nลบแล้วกู้คืนไม่ได้`)) return;
  const arr = (PET.data.labs || []).filter((l) => l !== cur);
  try {
    PET.data = await TC.setPetPath(PET.id, ['labs'], arr);
    LAB_OPEN = panelId;
    LAB_EDIT = null;
    showTab('labs');
  } catch (err) { alert(err.message || 'ลบไม่สำเร็จ'); }
}

function openPanelForm() {
  openForm('labForm', {
    title: '➕ เพิ่มหมวดผลเลือด',
    fields: [
      { key: 'name', label: 'ชื่อหมวด', type: 'text', placeholder: 'เช่น Urinalysis, Thyroid Panel' },
    ],
    onSave: async (v) => {
      if (!v.name) throw new Error('กรุณากรอกชื่อหมวด');
      const id = 'panel_' + Math.random().toString(36).slice(2, 7);
      const panels = [...((PET.data || {}).labPanels || []), { id, name: v.name }];
      PET.data = await TC.setPetPath(PET.id, ['labPanels'], panels);
      LAB_OPEN = id;
      showTab('labs');
      // เปิดตัวตั้งค่าที่ตรวจ + เกณฑ์ปกติ ให้เลย (หมวดใหม่ยังไม่มีค่าตรวจ)
      setTimeout(() => { const b = document.getElementById(`labParams-${id}`); if (b) openParamEditor(id); }, 60);
    },
  });
}


/* ================= แท็บสรุป ================= */

// section ทั้งหมดในหน้าสรุป + ตัวสร้างกล่อง (parent เลือกแสดง/ซ่อน/จัดลำดับได้)
const SUMMARY_SECTIONS = {
  leuco:  { label: '💉 เกณฑ์ฉีด Leuco Plus',      build: (d) => (d.leucoPlus ? leucoBox(d) : null) },
  danger: { label: '🚨 สัญญาณต้องไปหาหมอทันที',   build: (d) => dangerBox(d.dangerSigns || {}) },
  watch:  { label: '📋 สิ่งที่ต้องติดตาม',         build: (d) => watchBox(d.watchList || []) },
  tumor:  { label: '📈 ขนาดก้อนในตับ',            build: (d) => tumorChart((d.vitals && d.vitals.liverTumor) || []) },
};
const SUMMARY_DEFAULT_ORDER = ['leuco', 'danger', 'watch', 'tumor'];

function summaryOrder(d) {
  const saved = (d.display && d.display.order) || [];
  // ยึด order ที่บันทึกไว้ก่อน แล้วต่อด้วย section ที่ยังไม่เคยจัด
  const known = saved.filter((k) => SUMMARY_SECTIONS[k]);
  const rest = SUMMARY_DEFAULT_ORDER.filter((k) => !known.includes(k));
  return [...known, ...rest];
}

function renderSummary(root) {
  const d = PET.data || {};
  const hidden = (d.display && d.display.hidden) || [];

  const bar = document.createElement('div');
  bar.className = 'edit-bar';
  bar.style.justifyContent = 'flex-end';
  if (ROLE.canEdit) {
    bar.innerHTML = '<a class="sum-edit-toggle" id="tgSummaryCfg" style="margin:0">⚙️ ปรับหน้าสรุป</a>';
  }
  root.appendChild(bar);

  const cfgHolder = document.createElement('div');
  cfgHolder.id = 'summaryCfg';
  root.appendChild(cfgHolder);

  const wrap = document.createElement('div');
  wrap.className = 'stack';

  summaryOrder(d).forEach((key) => {
    if (hidden.includes(key)) return;
    const el = SUMMARY_SECTIONS[key].build(d);
    // ดูอย่างเดียว: ซ่อนกล่องที่ว่างเปล่า · แก้ได้: โชว์เพื่อกดเพิ่ม (ยกเว้น section ที่โปรไฟล์ไม่มีเลย)
    if (el) wrap.appendChild(el);
  });

  if (!wrap.children.length) wrap.innerHTML = '<div class="empty">ยังไม่มีข้อมูลสรุปสำหรับน้องตัวนี้</div>';
  root.appendChild(wrap);

  if (ROLE.canEdit) {
    document.getElementById('tgSummaryCfg').onclick = () => toggleSummaryCfg(d);
  }
}

let SUMMARY_CFG_OPEN = false;
function toggleSummaryCfg(d) {
  SUMMARY_CFG_OPEN = !SUMMARY_CFG_OPEN;
  const holder = document.getElementById('summaryCfg');
  if (!SUMMARY_CFG_OPEN) { holder.innerHTML = ''; return; }

  const hidden = (d.display && d.display.hidden) || [];
  const order = summaryOrder(d);

  holder.innerHTML = `
    <div class="edit-form">
      <h3>⚙️ ปรับหน้าสรุป</h3>
      <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px">เลือกว่าจะแสดง section ไหน และจัดลำดับ — น้องแต่ละตัวเน้นไม่เหมือนกัน</p>
      <div id="cfgRows">
        ${order.map((key, i) => `
          <div class="cfg-row" data-key="${key}">
            <label style="display:flex;align-items:center;gap:10px;flex:1;margin:0;cursor:pointer">
              <input type="checkbox" ${hidden.includes(key) ? '' : 'checked'} data-vis="${key}">
              <span>${SUMMARY_SECTIONS[key].label}</span>
            </label>
            <span style="display:flex;gap:4px">
              <button class="btn-ghost cfg-up" data-i="${i}" ${i === 0 ? 'disabled' : ''} style="padding:4px 10px">↑</button>
              <button class="btn-ghost cfg-dn" data-i="${i}" ${i === order.length - 1 ? 'disabled' : ''} style="padding:4px 10px">↓</button>
            </span>
          </div>`).join('')}
      </div>
      <div class="btns"><button class="btn" id="cfgSave">บันทึก</button>
        <button class="btn-ghost" id="cfgCancel">ปิด</button></div>
      <div class="saving" id="cfgMsg" style="margin-top:8px"></div>
    </div>`;

  let curOrder = [...order];

  const rerenderRows = () => {
    // จำสถานะ checkbox ปัจจุบันไว้ก่อนวาดใหม่
    const checked = {};
    holder.querySelectorAll('[data-vis]').forEach((c) => { checked[c.dataset.vis] = c.checked; });
    const rows = holder.querySelector('#cfgRows');
    rows.innerHTML = curOrder.map((key, i) => `
      <div class="cfg-row" data-key="${key}">
        <label style="display:flex;align-items:center;gap:10px;flex:1;margin:0;cursor:pointer">
          <input type="checkbox" ${checked[key] ? 'checked' : ''} data-vis="${key}">
          <span>${SUMMARY_SECTIONS[key].label}</span>
        </label>
        <span style="display:flex;gap:4px">
          <button class="btn-ghost cfg-up" data-i="${i}" ${i === 0 ? 'disabled' : ''} style="padding:4px 10px">↑</button>
          <button class="btn-ghost cfg-dn" data-i="${i}" ${i === curOrder.length - 1 ? 'disabled' : ''} style="padding:4px 10px">↓</button>
        </span>
      </div>`).join('');
    wireCfgBtns();
  };
  const wireCfgBtns = () => {
    holder.querySelectorAll('.cfg-up').forEach((b) => b.onclick = () => {
      const i = Number(b.dataset.i); [curOrder[i - 1], curOrder[i]] = [curOrder[i], curOrder[i - 1]]; rerenderRows();
    });
    holder.querySelectorAll('.cfg-dn').forEach((b) => b.onclick = () => {
      const i = Number(b.dataset.i); [curOrder[i + 1], curOrder[i]] = [curOrder[i], curOrder[i + 1]]; rerenderRows();
    });
  };
  wireCfgBtns();

  document.getElementById('cfgCancel').onclick = () => { SUMMARY_CFG_OPEN = false; holder.innerHTML = ''; };
  document.getElementById('cfgSave').onclick = async () => {
    const newHidden = [...holder.querySelectorAll('[data-vis]')].filter((c) => !c.checked).map((c) => c.dataset.vis);
    const display = JSON.parse(JSON.stringify(d.display || {}));
    display.hidden = newHidden;
    display.order = curOrder;
    try {
      PET.data = await TC.setPetPath(PET.id, ['display'], display);
      SUMMARY_CFG_OPEN = false;
      showTab('summary');
    } catch (e) { document.getElementById('cfgMsg').textContent = e.message; }
  };
}

/* ---- ไฟเตือน Leuco Plus (เทียบ WBC ดิบ 🔴<4000 / 🟡4000-4499 / 🟢≥4500) ---- */
function leucoBox(d) {
  const lp = d.leucoPlus;
  const labs = (d.labs || []).filter((l) => l.values && l.values.wbc != null);
  labs.sort((a, b) => new Date(b.date) - new Date(a.date));
  const latest = labs[0];

  let cls = 'lp-gray', verdict = 'ยังไม่มีผล WBC', detail = '';

  if (latest) {
    let wbc = Number(latest.values.wbc);
    if (lp.wbcInThousands) wbc = wbc * 1000;   // เผื่อโปรไฟล์ที่เก็บเป็นพัน
    const always = lp.alwaysBelow ?? 4000;
    const withSym = lp.withSymptomsBelow ?? 4500;

    if (wbc < always) { cls = 'lp-red'; verdict = `🔴 WBC ${wbc.toLocaleString()} — ต่ำกว่า ${always.toLocaleString()} ควรฉีด Leuco Plus แม้อาการปกติ`; }
    else if (wbc < withSym) { cls = 'lp-yellow'; verdict = `🟡 WBC ${wbc.toLocaleString()} — ต่ำกว่า ${withSym.toLocaleString()} ถ้ามีอาการอื่นร่วมด้วยควรฉีด`; }
    else { cls = 'lp-green'; verdict = `🟢 WBC ${wbc.toLocaleString()} — อยู่ในเกณฑ์ ยังไม่ต้องฉีด`; }

    detail = `ผลล่าสุด ${TC.thDate(latest.date)}`;
  }

  const el = document.createElement('div');
  el.className = `leuco-box ${cls}`;
  el.innerHTML = `
    <div class="edit-bar" style="margin-bottom:8px">
      <div class="lp-head" style="margin:0">💉 ${TC.esc(lp.title || 'เกณฑ์ฉีด Leuco Plus')}</div>
      ${ROLE.canEdit ? '<a class="sum-edit-toggle" id="editLeuco" style="color:var(--gold)">✏️ แก้เกณฑ์</a>' : ''}
    </div>
    <div class="lp-verdict">${TC.esc(verdict)}</div>
    ${detail ? `<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;font-family:var(--mono)">${TC.esc(detail)}</div>` : ''}
    ${(lp.rules || []).length ? `<ul class="lp-rules">${lp.rules.map((r) => `<li>${TC.esc(r)}</li>`).join('')}</ul>` : ''}
    <div id="leucoForm"></div>
  `;
  if (ROLE.canEdit) setTimeout(() => {
    el.querySelector('#editLeuco').onclick = () => editLeuco();
  }, 0);
  return el;
}

function editLeuco() {
  const lp = PET.data.leucoPlus || {};
  openForm('leucoForm', {
    title: '✏️ แก้เกณฑ์ฉีด Leuco Plus',
    fields: [
      { key: 'title', label: 'ชื่อหัวข้อ', type: 'text', placeholder: 'เกณฑ์ฉีด Leuco Plus' },
      { key: 'alwaysBelow', label: 'WBC ต่ำกว่าเท่าไร → ฉีดแม้อาการปกติ (🔴)', type: 'text', placeholder: '4000' },
      { key: 'withSymptomsBelow', label: 'WBC ต่ำกว่าเท่าไร + มีอาการ → ฉีด (🟡)', type: 'text', placeholder: '4500' },
      { key: 'rules', label: 'กฎ/หมายเหตุ (บรรทัดละข้อ)', type: 'textarea', placeholder: 'WBC ต่ำกว่า 4,500 + มีอาการอื่น → ฉีด\nWBC ต่ำกว่า 4,000 แม้อาการปกติ → ฉีด' },
    ],
    values: {
      title: lp.title || '', alwaysBelow: lp.alwaysBelow ?? '', withSymptomsBelow: lp.withSymptomsBelow ?? '',
      rules: (lp.rules || []).join('\n'),
    },
    onSave: async (v) => {
      const a = Number(v.alwaysBelow), w = Number(v.withSymptomsBelow);
      if (v.alwaysBelow && Number.isNaN(a)) throw new Error('ค่า 🔴 ต้องเป็นตัวเลข');
      if (v.withSymptomsBelow && Number.isNaN(w)) throw new Error('ค่า 🟡 ต้องเป็นตัวเลข');
      const lpNew = JSON.parse(JSON.stringify(lp));
      lpNew.title = v.title || 'เกณฑ์ฉีด Leuco Plus';
      if (v.alwaysBelow !== '') lpNew.alwaysBelow = a;
      if (v.withSymptomsBelow !== '') lpNew.withSymptomsBelow = w;
      lpNew.rules = v.rules.split('\n').map((s) => s.trim()).filter(Boolean);
      PET.data = await TC.setPetPath(PET.id, ['leucoPlus'], lpNew);
      showTab('summary');
    },
  });
}

// สถานะโหมดจัดการของแต่ละกล่องในแท็บสรุป (สลับด้วยปุ่ม ✏️ จัดการ)
let SUM_EDIT = { danger: false, watch: false, tumor: false };

/* ---- กล่องแดง: สัญญาณต้องไปหาหมอทันที (liverFailure + wbc) ---- */
function dangerBox(ds) {
  const editing = SUM_EDIT.danger;
  const el = document.createElement('div');
  el.className = 'alert-box';   // ไม่ใส่ form เป็น flex child แล้ว → ไม่บีบเนื้อหา
  const rows = [
    ...(ds.liverFailure || []).map((t, i) => ({ t, src: 'liverFailure', i })),
    ...(ds.wbc || []).map((t, i) => ({ t, src: 'wbc', i })),
  ];
  el.innerHTML = `
    <div class="icon">🚨</div>
    <div style="flex:1;min-width:0">
      <div class="edit-bar" style="margin-bottom:6px">
        <span class="title" style="margin:0">สัญญาณต้องไปหาหมอทันที</span>
        ${ROLE.canEdit ? `<a class="sum-edit-toggle" id="tgDanger">${editing ? 'เสร็จ' : '✏️ จัดการ'}</a>` : ''}
      </div>
      ${rows.length ? `<ul>${rows.map((r) => `<li>${TC.esc(r.t)}${editing ? `
        <span class="inline-actions"><a class="act-edit" data-e="${r.src}:${r.i}">แก้</a><a class="act-del" data-d="${r.src}:${r.i}">ลบ</a></span>` : ''}</li>`).join('')}</ul>`
        : '<div class="empty">ยังไม่มีรายการ</div>'}
      ${(ds.nosebleed || editing) ? `<div style="margin-top:10px;font-size:12.5px;color:#8a2b2b" class="pre-line"><b>เลือดกำเดา — ปฐมพยาบาล:</b>${editing ? ' <a class="act-edit" id="editNosebleed">แก้</a>' : ''}${ds.nosebleed ? '\n' + TC.esc(ds.nosebleed) : (editing ? '\n(ยังไม่มีข้อความ)' : '')}</div>
      <div id="nosebleedForm"></div>` : ''}
      ${editing ? '<button class="btn-ghost" id="btnAddDanger" style="margin-top:12px">➕ เพิ่มรายการ</button>' : ''}
      <div id="dangerForm"></div>
    </div>`;

  if (ROLE.canEdit) setTimeout(() => {
    el.querySelector('#tgDanger').onclick = () => { SUM_EDIT.danger = !SUM_EDIT.danger; showTab('summary'); };
    const add = el.querySelector('#btnAddDanger');
    if (add) add.onclick = () => editDanger(null, null);
    const nb = el.querySelector('#editNosebleed');
    if (nb) nb.onclick = () => editNosebleed();
    el.querySelectorAll('[data-e]').forEach((a) => a.onclick = () => { const [s, i] = a.dataset.e.split(':'); editDanger(s, Number(i)); });
    el.querySelectorAll('[data-d]').forEach((a) => a.onclick = () => { const [s, i] = a.dataset.d.split(':'); delDanger(s, Number(i)); });
  }, 0);
  return el;
}

function editNosebleed() {
  openForm('nosebleedForm', {
    title: '✏️ แก้ข้อความปฐมพยาบาลเลือดกำเดา',
    fields: [{ key: 'text', label: 'ขั้นตอนปฐมพยาบาล (ขึ้นหลายบรรทัดได้)', type: 'textarea',
      placeholder: 'เช่น เลือดกำเดาไม่หยุดใน 30 นาที: หักหลอดยา ดูดยา 1cc + น้ำ 2cc...' }],
    values: { text: (PET.data.dangerSigns || {}).nosebleed || '' },
    onSave: async (v) => {
      const dsNew = JSON.parse(JSON.stringify(PET.data.dangerSigns || {}));
      dsNew.nosebleed = v.text;
      PET.data = await TC.setPetPath(PET.id, ['dangerSigns'], dsNew);
      showTab('summary');
    },
  });
}

function editDanger(src, idx) {
  const ds = PET.data.dangerSigns || {};
  const cur = src ? (ds[src] || [])[idx] : '';
  openForm('dangerForm', {
    title: src ? '✏️ แก้สัญญาณอันตราย' : '➕ เพิ่มสัญญาณอันตราย',
    fields: [
      { key: 'group', label: 'กลุ่ม', type: 'select', options: [
        { value: 'liverFailure', label: 'ตับวาย' }, { value: 'wbc', label: 'เม็ดเลือดขาว (WBC)' }] },
      { key: 'text', label: 'ข้อความ', type: 'textarea', placeholder: 'เช่น BUN ต่ำมาก (ห้ามแตะ 10)' },
    ],
    values: { group: src || 'liverFailure', text: cur },
    onSave: async (v) => {
      if (!v.text) throw new Error('กรุณากรอกข้อความ');
      const data = PET.data;
      const dsNew = JSON.parse(JSON.stringify(data.dangerSigns || {}));
      dsNew.liverFailure = dsNew.liverFailure || []; dsNew.wbc = dsNew.wbc || [];
      if (src) dsNew[src].splice(idx, 1);            // ลบของเดิม (เผื่อย้ายกลุ่ม)
      dsNew[v.group] = dsNew[v.group] || [];
      dsNew[v.group].push(v.text);
      PET.data = await TC.setPetPath(PET.id, ['dangerSigns'], dsNew);
      showTab('summary');
    },
  });
}

async function delDanger(src, idx) {
  const ds = PET.data.dangerSigns || {};
  if (!confirm(`ลบ "${(ds[src] || [])[idx]}" ?`)) return;
  const dsNew = JSON.parse(JSON.stringify(ds));
  dsNew[src].splice(idx, 1);
  try { PET.data = await TC.setPetPath(PET.id, ['dangerSigns'], dsNew); showTab('summary'); }
  catch (e) { alert(e.message); }
}

/* ---- สิ่งที่ต้องติดตาม ---- */
function watchBox(list) {
  const editing = SUM_EDIT.watch;
  const el = document.createElement('div');
  el.className = 'watch-box';
  el.innerHTML = `
    <div class="edit-bar" style="margin-bottom:6px">
      <span class="title" style="margin:0">📋 สิ่งที่ต้องติดตาม</span>
      ${ROLE.canEdit ? `<a class="sum-edit-toggle" id="tgWatch">${editing ? 'เสร็จ' : '✏️ จัดการ'}</a>` : ''}
    </div>
    ${list.length ? `<ul>${list.map((t, i) => `<li>${TC.esc(t)}${editing ? `
      <span class="inline-actions"><a class="act-edit" data-e="${i}">แก้</a><a class="act-del" data-d="${i}">ลบ</a></span>` : ''}</li>`).join('')}</ul>`
      : '<div class="empty">ยังไม่มีรายการ</div>'}
    ${editing ? '<button class="btn-ghost" id="btnAddWatch" style="margin-top:8px">➕ เพิ่มรายการ</button>' : ''}
    <div id="watchForm"></div>`;

  if (ROLE.canEdit) setTimeout(() => {
    el.querySelector('#tgWatch').onclick = () => { SUM_EDIT.watch = !SUM_EDIT.watch; showTab('summary'); };
    const add = el.querySelector('#btnAddWatch');
    if (add) add.onclick = () => editWatch(null);
    el.querySelectorAll('[data-e]').forEach((a) => a.onclick = () => editWatch(Number(a.dataset.e)));
    el.querySelectorAll('[data-d]').forEach((a) => a.onclick = () => delWatch(Number(a.dataset.d)));
  }, 0);
  return el;
}

function editWatch(idx) {
  const list = PET.data.watchList || [];
  openForm('watchForm', {
    title: idx === null ? '➕ เพิ่มสิ่งที่ต้องติดตาม' : '✏️ แก้',
    fields: [{ key: 'text', label: 'ข้อความ', type: 'textarea', placeholder: 'เช่น ก้อนในตับ — ซาวด์ทุก 1-2 เดือน' }],
    values: { text: idx === null ? '' : list[idx] },
    onSave: async (v) => {
      if (!v.text) throw new Error('กรุณากรอกข้อความ');
      const arr = [...list];
      if (idx === null) arr.push(v.text); else arr[idx] = v.text;
      PET.data = await TC.setPetPath(PET.id, ['watchList'], arr);
      showTab('summary');
    },
  });
}

async function delWatch(idx) {
  const list = PET.data.watchList || [];
  if (!confirm(`ลบ "${list[idx]}" ?`)) return;
  const arr = [...list]; arr.splice(idx, 1);
  try { PET.data = await TC.setPetPath(PET.id, ['watchList'], arr); showTab('summary'); }
  catch (e) { alert(e.message); }
}

/* ---- กราฟขนาดก้อนในตับ (+ แก้ไข) ---- */
function tumorChart(rows) {
  const el = document.createElement('div');
  el.className = 'chart-wrap';
  const editing = SUM_EDIT.tumor;
  el.innerHTML = `
    <div class="edit-bar">
      <span class="section-label" style="margin:0">📈 ขนาดก้อนในตับ (cm)</span>
      ${ROLE.canEdit ? `<a class="sum-edit-toggle" id="tgTumor">${editing ? 'เสร็จ' : '✏️ จัดการ'}</a>` : ''}
    </div>
    <div id="tumorForm"></div>
    <div class="tumor-box"><canvas></canvas></div>
    <div class="tumor-note" id="tumorNotes"></div>
    ${editing ? '<button class="btn-ghost" id="btnAddTumor" style="margin-top:12px">➕ เพิ่มบันทึก</button><div id="tumorList" style="margin-top:10px"></div>' : ''}`;

  if (ROLE.canEdit) setTimeout(() => {
    el.querySelector('#tgTumor').onclick = () => { SUM_EDIT.tumor = !SUM_EDIT.tumor; showTab('summary'); };
    if (!editing) return;
    el.querySelector('#btnAddTumor').onclick = () => editTumor(null);
    // ลิสต์รายการทั้งหมด (เรียงใหม่สุดก่อน) พร้อมแก้/ลบ
    const sorted = rows.map((r, i) => ({ ...r, _i: i })).sort((a, b) => new Date(b.date) - new Date(a.date));
    el.querySelector('#tumorList').innerHTML = sorted.map((r) => `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:6px;background:var(--surface2)">
        <span style="font-size:12.5px">${r.alert ? '⚠️ ' : ''}<b>${TC.thDateShort(r.date)}</b> · ${r.size != null ? r.size + ' cm' : '—'}${r.note ? ' · ' + TC.esc(r.note) : ''}</span>
        <span class="inline-actions" style="margin:0;white-space:nowrap">
          <a class="act-edit" data-e="${r._i}">แก้</a><a class="act-del" data-d="${r._i}">ลบ</a></span>
      </div>`).join('');
    el.querySelectorAll('#tumorList [data-e]').forEach((a) => a.onclick = () => editTumor(Number(a.dataset.e)));
    el.querySelectorAll('#tumorList [data-d]').forEach((a) => a.onclick = () => delTumor(Number(a.dataset.d)));
  }, 0);

  const pts = rows.filter((r) => r.size != null)
                  .sort((a, b) => new Date(a.date) - new Date(b.date));

  setTimeout(() => {
    if (!pts.length) { el.querySelector('.tumor-box').innerHTML = '<div class="empty">ยังไม่มีค่าที่วัดได้</div>'; }
    else {
      new Chart(el.querySelector('canvas'), {
        type: 'line',
        data: {
          labels: pts.map((p) => TC.thDateShort(p.date)),
          datasets: [{
            data: pts.map((p) => p.size),
            borderColor: '#5b86bf', backgroundColor: 'rgba(169,196,232,0.25)',
            pointBackgroundColor: pts.map((p) => (p.alert ? '#d96a6a' : '#5b86bf')),
            pointRadius: 4, tension: 0.3, fill: true,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { color: '#8c7f6f' }, grid: { color: '#efe0cd' } },
            x: { ticks: { color: '#8c7f6f', font: { size: 10 } }, grid: { display: false } },
          },
        },
      });
    }
    // บันทึกล่าสุด 3 รายการ (รวมรายการที่ไม่มีตัวเลข เช่น "มีก้อนเพิ่ม")
    const notes = rows.filter((r) => r.note).slice(-3).reverse();
    el.querySelector('#tumorNotes').innerHTML = notes
      .map((n) => `<div>${n.alert ? '⚠️ ' : '· '}<b>${TC.thDateShort(n.date)}</b> — ${TC.esc(n.note)}</div>`)
      .join('');
  }, 0);

  return el;
}

function editTumor(idx) {
  const rows = (PET.data.vitals && PET.data.vitals.liverTumor) || [];
  const cur = idx === null ? {} : rows[idx];
  openForm('tumorForm', {
    title: idx === null ? '➕ เพิ่มบันทึกก้อนในตับ' : '✏️ แก้บันทึก',
    fields: [
      { key: 'date', label: 'วันที่', type: 'date' },
      { key: 'size', label: 'ขนาด (cm) — เว้นว่างได้ถ้าไม่ได้วัด', type: 'text', placeholder: 'เช่น 1.4' },
      { key: 'note', label: 'หมายเหตุ', type: 'textarea', placeholder: 'เช่น มีก้อนเพิ่ม รวม 4 ก้อน' },
      { key: 'alert', label: 'ทำเครื่องหมายเตือน (⚠️)', type: 'select', options: [
        { value: '', label: 'ไม่' }, { value: '1', label: 'ใช่ — เน้นเป็นจุดเตือน' }] },
    ],
    values: { date: cur.date || '', size: cur.size ?? '', note: cur.note || '', alert: cur.alert ? '1' : '' },
    onSave: async (v) => {
      if (!v.date) throw new Error('กรุณาเลือกวันที่');
      const entry = { date: v.date };
      if (v.size !== '') entry.size = Number(v.size);
      else entry.size = null;
      if (v.note) entry.note = v.note;
      if (v.alert) entry.alert = true;

      const vitals = JSON.parse(JSON.stringify(PET.data.vitals || {}));
      vitals.liverTumor = vitals.liverTumor || [];
      if (idx === null) vitals.liverTumor.push(entry); else vitals.liverTumor[idx] = entry;
      vitals.liverTumor.sort((a, b) => new Date(a.date) - new Date(b.date));
      PET.data = await TC.setPetPath(PET.id, ['vitals'], vitals);
      showTab('summary');
    },
  });
}

async function delTumor(idx) {
  const rows = (PET.data.vitals && PET.data.vitals.liverTumor) || [];
  const r = rows[idx];
  if (!confirm(`ลบบันทึก ${TC.thDateShort(r.date)} ?`)) return;
  const vitals = JSON.parse(JSON.stringify(PET.data.vitals || {}));
  vitals.liverTumor.splice(idx, 1);
  try { PET.data = await TC.setPetPath(PET.id, ['vitals'], vitals); showTab('summary'); }
  catch (e) { alert(e.message); }
}
</script>
</body>
