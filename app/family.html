<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการครอบครัว 🐾 · Tammie Care</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#fdf4eb">
<link rel="stylesheet" href="theme.css?v=36">
<style>
  .mrow { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 10px;
          padding: 11px 14px; background: var(--surface); margin-bottom: 8px; flex-wrap: wrap; }
  .mrow .who { flex: 1; min-width: 0; }
  .mrow .who .nm { font-weight: 600; }
  .mrow .who .em { font-size: 12px; color: var(--text-dim); font-family: var(--mono); word-break: break-all; }
  .mrow select { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-family: 'Sarabun', sans-serif; font-size: 13px; }
  .mrow .rm { color: var(--red); cursor: pointer; font-size: 12.5px; font-family: var(--mono); }
  .you-tag { font-size: 10.5px; color: var(--sky); border: 1px solid var(--sky-soft); border-radius: 20px; padding: 2px 8px; }
  .pet-row { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 10px;
             padding: 10px 14px; background: var(--surface); margin-bottom: 8px; }
  .pet-row.arch { opacity: .55; }
  .pet-row .nm { flex: 1; font-weight: 600; text-decoration: none; min-width: 0; }
  .pet-actions { display: flex; gap: 8px; }
  .pet-btn {
    font-family: 'Sarabun', sans-serif; font-size: 12.5px; font-weight: 500;
    border: 1px solid var(--border); border-radius: 16px; padding: 6px 13px;
    cursor: pointer; background: var(--surface2); color: var(--text-dim); white-space: nowrap;
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 3px;
  }
  /* มือถือ: ชื่ออยู่บรรทัดบน · 3 ปุ่มเรียงเท่ากันบรรทัดล่าง */
  @media (max-width: 560px) {
    .pet-row { flex-direction: column; align-items: stretch; gap: 8px; }
    .pet-actions { display: grid; grid-template-columns: repeat(3, 1fr); }
    .pet-btn { padding: 8px 4px; font-size: 12px; }
  }
  .pet-btn { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  .pet-btn:hover { border-color: var(--sky); color: var(--sky); }
  .pet-btn.edit { color: var(--gold); border-color: var(--gold-dim); }
  .pet-btn.edit:hover { background: rgba(217,158,62,0.12); }
  .pet-btn.show { color: var(--sky); border-color: var(--sky-soft); }
  .pet-btn.danger { color: var(--red); border-color: #f0c3c3; }
  .pet-btn.danger:hover { background: var(--red-dim); }
  .add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-top: 10px; }
  .add-row .field { margin: 0; flex: 1; min-width: 160px; }
  .card + .card { margin-top: 18px; }
  h2.sec { font-family: var(--cute); font-size: 17px; color: var(--blue); margin-bottom: 12px; }
</style>
</head>
<body>

<header class="tc-header">
  <a class="back" href="index.html">←</a>
  <div><h1>จัดการครอบครัว</h1>
    <div class="sub"><span id="famName"></span> <a id="editFamName" style="color:var(--sky);cursor:pointer;font-family:'Sarabun',sans-serif" title="แก้ชื่อครอบครัว">✏️ แก้ชื่อ</a></div>
  </div>
  <div class="spacer"></div>
  <button class="btn-ghost" onclick="TC.signOut()">ออก</button>
</header>

<div class="container" id="content"><div class="loading">กำลังโหลด...</div></div>

<footer>🐾 Tammie Care · <a href="index.html">หน้าแรก</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="lib.js?v=36"></script>
<script>
let FID = null, ME = null, ROLE = null;

(async function main() {
  ME = await TC.requireAuth();
  if (!ME) return;

  ROLE = await TC.getMyRole();
  const c = document.getElementById('content');

  if (ROLE.role !== 'parent' || !ROLE.isAdmin) {
    c.innerHTML = '<div class="empty">หน้านี้สำหรับผู้ดูแลครอบครัว (admin) เท่านั้น<br>' +
      '<a href="index.html">← กลับหน้าแรก</a></div>';
    return;
  }

  // Phase 1: รองรับครอบครัวเดียว (ใช้ครอบครัวแรกที่เป็น admin)
  const fams = await TC.myFamilies();
  if (!fams.length) { c.innerHTML = '<div class="empty">ไม่พบครอบครัว</div>'; return; }
  FID = fams[0].id;
  let famName = fams[0].name;
  document.getElementById('famName').textContent = famName;

  // แก้ชื่อครอบครัว (admin)
  document.getElementById('editFamName').onclick = async () => {
    const n = await TC.prompt('ชื่อครอบครัว', famName);
    if (n === null || !n.trim() || n.trim() === famName) return;
    try {
      await TC.renameFamily(FID, n);
      famName = n.trim();
      document.getElementById('famName').textContent = famName;
    } catch (e) { alert(e.message); }
  };

  render();
})();

async function render() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading">กำลังโหลด...</div>';

  let ov, pets;
  try {
    [ov, pets] = await Promise.all([
      TC.familyOverview(FID),
      TC.sb.from('pets').select('id,name,archived').order('sort_order').then((r) => r.data || []),
    ]);
  } catch (e) { c.innerHTML = `<div class="msg msg-err">${TC.esc(e.message)}</div>`; return; }

  const permLabel = { view: 'ดูอย่างเดียว', edit: 'แก้ไขได้', admin: 'ผู้ดูแล (admin)' };

  c.innerHTML = `
    <div class="card">
      <h2 class="sec">👪 สมาชิกครอบครัว (${ov.members.length})</h2>
      <div id="members"></div>
      <div class="add-row">
        <div class="field"><label>เพิ่มด้วยอีเมล (ต้องสมัครไว้ก่อน)</label>
          <input type="email" id="addMemEmail" placeholder="name@email.com" inputmode="email"></div>
        <div class="field" style="flex:0 0 150px"><label>สิทธิ์</label>
          <select id="addMemPerm">
            <option value="view">ดูอย่างเดียว</option>
            <option value="edit" selected>แก้ไขได้</option>
            <option value="admin">ผู้ดูแล</option>
          </select></div>
        <button class="btn" id="btnAddMem">เพิ่ม</button>
      </div>
      <div id="memMsg"></div>
    </div>

    <div class="card">
      <h2 class="sec">🩺 สัตวแพทย์ที่เข้าถึงได้ (${ov.vets.length})</h2>
      <div id="vets"></div>
      <div class="add-row">
        <div class="field"><label>ให้สิทธิ์หมอด้วยอีเมล (ดูอย่างเดียว)</label>
          <input type="email" id="addVetEmail" placeholder="vet@email.com" inputmode="email"></div>
        <button class="btn" id="btnAddVet">เพิ่ม</button>
      </div>
      <div id="vetMsg"></div>
    </div>

    <div class="card">
      <h2 class="sec">🐾 สัตว์เลี้ยง (${pets.filter((p) => !p.archived).length})</h2>
      <div id="pets"></div>
      <div class="add-row">
        <div class="field"><label>เพิ่มสัตว์ใหม่</label>
          <input type="text" id="addPetName" placeholder="ชื่อน้อง"></div>
        <button class="btn" id="btnAddPet">เพิ่ม</button>
      </div>
      <div id="petMsg"></div>
    </div>`;

  // ----- สมาชิก -----
  document.getElementById('members').innerHTML = ov.members.map((m) => {
    const isMe = m.user_id === ME.id;
    return `<div class="mrow">
      <div class="who"><div class="nm">${TC.esc(m.name || '—')} ${isMe ? '<span class="you-tag">คุณ</span>' : ''}</div>
        <div class="em">${TC.esc(m.email || '')}</div></div>
      <select data-perm="${m.user_id}">
        ${['view', 'edit', 'admin'].map((p) => `<option value="${p}" ${m.permission === p ? 'selected' : ''}>${permLabel[p]}</option>`).join('')}
      </select>
      <a class="rm" data-rmmem="${m.user_id}">ถอด</a>
    </div>`;
  }).join('');

  document.querySelectorAll('[data-perm]').forEach((sel) => {
    sel.onchange = () => guard('memMsg', () => TC.setMemberPermission(FID, sel.dataset.perm, sel.value));
  });
  document.querySelectorAll('[data-rmmem]').forEach((a) => {
    a.onclick = async () => { if (await TC.confirm('ถอดสมาชิกคนนี้ออกจากครอบครัว?', { okLabel: 'ถอด', danger: true })) guard('memMsg', () => TC.removeMember(FID, a.dataset.rmmem)); };
  });
  document.getElementById('btnAddMem').onclick = () => {
    const email = document.getElementById('addMemEmail').value.trim();
    if (!email) return;
    guard('memMsg', () => TC.addMember(FID, email, document.getElementById('addMemPerm').value));
  };

  // ----- หมอ -----
  document.getElementById('vets').innerHTML = ov.vets.length
    ? ov.vets.map((v) => `<div class="mrow">
        <div class="who"><div class="nm">${TC.esc(v.name || '—')}</div><div class="em">${TC.esc(v.email || '')}</div></div>
        <a class="rm" data-rmvet="${v.user_id}">ถอนสิทธิ์</a></div>`).join('')
    : '<div class="empty">ยังไม่มีสัตวแพทย์</div>';
  document.querySelectorAll('[data-rmvet]').forEach((a) => {
    a.onclick = async () => { if (await TC.confirm('ถอนสิทธิ์หมอคนนี้?', { okLabel: 'ถอนสิทธิ์', danger: true })) guard('vetMsg', () => TC.removeVet(FID, a.dataset.rmvet)); };
  });
  document.getElementById('btnAddVet').onclick = () => {
    const email = document.getElementById('addVetEmail').value.trim();
    if (!email) return;
    guard('vetMsg', () => TC.addVet(FID, email));
  };

  // ----- สัตว์ -----
  document.getElementById('pets').innerHTML = pets.map((p) => `
    <div class="pet-row ${p.archived ? 'arch' : ''}">
      <a class="nm" href="pet.html?id=${p.id}" title="ดูข้อมูลสุขภาพของน้อง">${TC.esc(p.name)}${p.archived ? ' <span style="font-size:11px;color:var(--text-muted)">(ซ่อนอยู่)</span>' : ''}</a>
      <div class="pet-actions">
        <a class="pet-btn edit" href="pet.html?id=${p.id}&edit=profile" title="แก้ชื่อ/พันธุ์/วันเกิด/รูป/สถานะของน้อง">✏️ แก้โปรไฟล์</a>
        ${p.archived
          ? `<button class="pet-btn show" data-unarch="${p.id}" title="เอากลับมาแสดงในหน้าแรก">👁 แสดง</button>`
          : `<button class="pet-btn" data-arch="${p.id}" title="ซ่อนจากหน้าแรก (ข้อมูลไม่หาย กดแสดงกลับได้)">🙈 ซ่อน</button>`}
        <button class="pet-btn danger" data-del="${p.id}" data-nm="${TC.esc(p.name)}" title="ลบน้องและข้อมูลทั้งหมดถาวร (กู้คืนไม่ได้)">🗑 ลบถาวร</button>
      </div>
    </div>`).join('') || '<div class="empty">ยังไม่มีสัตว์</div>';
  document.querySelectorAll('[data-arch]').forEach((a) => {
    a.onclick = async () => { if (await TC.confirm('ซ่อนสัตว์ตัวนี้จากรายการ? (ข้อมูลไม่หาย กดแสดงกลับมาได้)', { okLabel: 'ซ่อน' })) guard('petMsg', () => TC.setPetArchived(a.dataset.arch, true)); };
  });
  document.querySelectorAll('[data-unarch]').forEach((a) => {
    a.onclick = () => guard('petMsg', () => TC.setPetArchived(a.dataset.unarch, false));
  });
  document.querySelectorAll('[data-del]').forEach((a) => {
    a.onclick = async () => {
      const name = a.dataset.nm;

      // เตือน 3 ชั้น กันลบพลาด (ลบแล้วกู้คืนไม่ได้)
      // ชั้นที่ 1 — อธิบายว่าลบหมดจริง ๆ
      if (!await TC.confirm(
        `⚠️ ลบ "${name}" ออกจากระบบถาวร\n\n` +
        `ข้อมูลทั้งหมดของน้องจะถูกลบทิ้ง — ผลเลือด ประวัติการรักษา อาการ นัดหมาย ` +
        `รวมถึงรูปโปรไฟล์และรูปทุกใบที่เคยอัปโหลด จะหายทั้งหมดและกู้คืนไม่ได้เลย\n\n` +
        `ถ้าแค่อยากเอาออกจากหน้าแรกชั่วคราว ให้ใช้ "ซ่อน" แทน\n\nดำเนินการต่อ?`,
        { okLabel: 'ดำเนินการต่อ', danger: true }
      )) return;

      // ชั้นที่ 2 — ย้ำอีกครั้งว่าถาวรจริง
      if (!await TC.confirm(
        `แน่ใจแล้วใช่ไหม?\n\n"${name}" และข้อมูลสุขภาพทั้งหมดจะหายถาวร ` +
        `ไม่มีถังขยะ ไม่มีย้อนกลับ`,
        { okLabel: 'ลบถาวร', danger: true }
      )) return;

      // ชั้นที่ 3 — พิมพ์ชื่อให้ตรงเพื่อยืนยันครั้งสุดท้าย
      const typed = await TC.prompt(
        `ยืนยันครั้งสุดท้าย — กำลังจะลบ "${name}" ถาวร\n\n` +
        `พิมพ์ชื่อน้องให้ตรง (${name}) แล้วกดตกลง เพื่อลบ:`
      );
      if (typed === null) return;
      if (typed.trim() !== name) { alert('ชื่อไม่ตรง — ยกเลิกการลบ ปลอดภัยไว้ก่อน'); return; }

      guard('petMsg', () => TC.deletePet(a.dataset.del));
    };
  });
  document.getElementById('btnAddPet').onclick = () => {
    const name = document.getElementById('addPetName').value.trim();
    if (!name) return;
    guard('petMsg', () => TC.createPet(FID, name));
  };
}

// เรียก action แล้วโชว์ผล/แจ้ง error ในกล่องที่ระบุ · สำเร็จ → โหลดใหม่
async function guard(msgId, fn) {
  const box = document.getElementById(msgId);
  box.innerHTML = '<div class="saving">กำลังบันทึก...</div>';
  try { await fn(); render(); }
  catch (e) { box.innerHTML = `<div class="msg msg-err">${TC.esc(e.message)}</div>`; }
}
</script>
</body>
</html>
