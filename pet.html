<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard 🐾</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/favicon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0f1117">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root {
    --bg: #0f1117; --surface: #181c27; --surface2: #1e2334;
    --border: #2a3050; --gold: #e8b84b; --gold-dim: #9b7a2a;
    --red: #e85555; --red-dim: #5c2020; --green: #4ec994; --green-dim: #1a4535;
    --blue: #5b9cf6; --blue-dim: #1a2d5c;
    --text: #e8eaf0; --text-dim: #8892a4; --text-muted: #4a5568;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; }
  a { color: var(--gold); text-decoration: none; }

  header {
    border-bottom: 1px solid var(--border); padding: 16px 28px;
    display: flex; align-items: center; gap: 14px; background: var(--surface);
    position: sticky; top: 0; z-index: 10;
  }
  .back { font-size: 20px; color: var(--text-dim); }
  .paw { font-size: 26px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); flex-shrink: 0; }
  header h1 { font-size: 20px; font-weight: 700; }
  header .sub { font-size: 12px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .age-badge {
    margin-left: auto; background: var(--gold-dim); color: var(--gold);
    font-size: 12px; font-family: 'IBM Plex Mono', monospace;
    padding: 4px 12px; border-radius: 20px; font-weight: 500;
  }

  .main { display: grid; grid-template-columns: 1fr; min-height: calc(100vh - 65px); }
  .left { border-right: 1px solid var(--border); overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 24px; }

  .section-label { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .stat-card .label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .stat-card .value { font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
  .stat-card .note { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .stat-red .value { color: var(--red); } .stat-green .value { color: var(--green); } .stat-gold .value { color: var(--gold); }

  .alert-box { background: var(--red-dim); border: 1px solid var(--red); border-radius: 10px; padding: 14px 16px; display: flex; gap: 12px; }
  .alert-box .icon { font-size: 18px; flex-shrink: 0; }
  .alert-box .title { font-weight: 600; color: var(--red); font-size: 14px; margin-bottom: 6px; }
  .alert-box ul { padding-left: 16px; font-size: 13px; color: #e8c0c0; line-height: 1.8; }

  .watch-box { background: var(--blue-dim); border: 1px solid var(--blue); border-radius: 10px; padding: 14px 16px; }
  .watch-box .title { font-weight: 600; color: var(--blue); font-size: 14px; margin-bottom: 8px; }
  .watch-box ul { padding-left: 16px; font-size: 13px; color: #b8c8f0; line-height: 1.8; }

  .leuco-box { border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: 10px; padding: 14px 16px; background: var(--surface); }
  .leuco-box .lp-head { font-weight: 600; font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .leuco-box .lp-verdict { font-size: 14px; font-weight: 600; padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; line-height: 1.5; }
  .leuco-box .lp-rules { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--text-dim); line-height: 1.7; }
  .leuco-box.lp-red { border-left-color: var(--red); } .leuco-box.lp-red .lp-verdict { background: var(--red-dim); color: #ffb3b3; }
  .leuco-box.lp-yellow { border-left-color: var(--gold); } .leuco-box.lp-yellow .lp-verdict { background: var(--gold-dim); color: #ffe39a; }
  .leuco-box.lp-green { border-left-color: var(--green); } .leuco-box.lp-green .lp-verdict { background: var(--green-dim); color: #9be9c4; }
  .leuco-box.lp-gray .lp-verdict { background: var(--surface2); color: var(--text-muted); }

  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }

  /* nosebleed calendar */
  .legend { display: flex; gap: 16px; margin-bottom: 14px; font-size: 12px; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .dot-left { background: var(--blue); } .dot-right { background: var(--gold); } .dot-unknown { background: var(--text-muted); }
  .dot-any { background: var(--red); }
  .cal-row { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
  .chart-col { flex: 0 0 300px; max-width: 300px; }
  .tumor-box { width: 300px; height: 250px; }
  .tumor-box canvas { width: 300px !important; height: 250px !important; }
  .lab-acc { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; background: var(--surface); }
  .lab-acc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 16px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text); user-select: none; }
  .lab-acc-head:hover { background: var(--surface2); }
  .lab-acc-meta { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .lab-acc-meta .chev { transition: transform 0.2s; font-size: 18px; color: var(--text-muted); }
  .lab-acc.open .lab-acc-meta .chev { transform: rotate(90deg); }
  .lab-acc-body { display: none; padding: 0 16px 16px; }
  .lab-acc.open .lab-acc-body { display: block; }
  .lab-note { font-size: 12px; color: var(--text-dim); margin-top: 10px; line-height: 1.6; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
  .lab-chart-box { width: 100%; max-width: 520px; height: 240px; }
  .lab-chart-box canvas { width: 100% !important; height: 240px !important; }
  .lab-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 9px; font-family: 'Sarabun', sans-serif; font-size: 12px; outline: none; }
  details.lab-history { margin-top: 12px; }
  details.lab-history > summary { cursor: pointer; font-size: 12px; color: var(--gold); font-family: 'IBM Plex Mono', monospace; user-select: none; }
  .lab-tbl { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 10px; }
  .lab-tbl th, .lab-tbl td { border: 1px solid var(--border); padding: 6px 12px; text-align: center; white-space: nowrap; }
  .lab-tbl th { color: var(--text-dim); font-weight: 500; background: var(--surface); }
  .lab-tbl td:first-child, .lab-tbl th:first-child { position: sticky; left: 0; background: var(--surface2); }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; max-width: 300px; margin-bottom: 10px; }
  .cal-nav button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .cal-nav button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .cal-nav button:disabled { opacity: 0.3; cursor: default; }
  .cal-title { font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--gold); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; max-width: 300px; }
  .cal-empty { font-size: 12px; color: var(--text-muted); padding: 8px 0; }
  .cal-cell { aspect-ratio: 1; border-radius: 5px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-muted); position: relative; border: 1px solid transparent; }
  .cal-cell.has-event { font-weight: 600; color: var(--text); }
  .cal-cell.ev-left { background: var(--blue-dim); border-color: var(--blue); }
  .cal-cell.ev-right { background: rgba(232,184,75,0.2); border-color: var(--gold-dim); }
  .cal-cell.ev-unknown { background: var(--surface); border-color: var(--text-muted); }
  .cal-cell.ev-any { background: rgba(232,85,85,0.18); border-color: var(--red); }
  .cal-cell .tip { display: none; position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%); background: #000; border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 12px; color: var(--text); white-space: normal; width: 180px; z-index: 20; font-weight: 400; line-height: 1.4; }
  .cal-cell:hover .tip { display: block; }

  .timeline { display: flex; flex-direction: column; }
  .tl-date-group { margin-bottom: 18px; }
  .tl-date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--gold); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .tl-date::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .tl-items { display: flex; flex-direction: column; gap: 8px; }
  .tl-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 13px; }
  .tl-item .doctor { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--gold); margin-bottom: 6px; font-weight: 500; }
  .tl-item p { color: var(--text-dim); line-height: 1.7; }
  .photo-link { color: var(--gold); cursor: pointer; font-size: 12px; white-space: nowrap; border-bottom: 1px dashed var(--gold-dim); }
  .photo-link:hover { border-bottom-style: solid; }

  .lightbox { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.88); align-items: center; justify-content: center; padding: 20px; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 88vh; width: auto; height: auto; object-fit: contain; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
  .lightbox .lb-close { position: fixed; top: 16px; right: 20px; font-size: 26px; color: #fff; cursor: pointer; line-height: 1; opacity: 0.8; }
  .lightbox .lb-close:hover { opacity: 1; }

  .tl-acc { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; background: var(--surface); }
  .tl-acc-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--gold); user-select: none; }
  .tl-acc-head:hover { background: var(--surface2); }
  .tl-acc-head .chev { margin-left: auto; transition: transform 0.2s; color: var(--text-muted); font-size: 16px; }
  .tl-acc.open .tl-acc-head .chev { transform: rotate(90deg); }
  .tl-acc-body { display: none; padding: 0 14px 12px; }
  .tl-acc.open .tl-acc-body { display: block; }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { padding: 7px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; cursor: pointer; color: var(--text-dim); }
  .tab.active { background: var(--gold-dim); color: var(--gold); border-color: var(--gold-dim); }
  .tab-content { display: none; } .tab-content.active { display: block; }

  .dash-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
  .dtab { padding: 9px 20px; border-radius: 9px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; font-weight: 500; cursor: pointer; color: var(--text-dim); }
  .dtab.active { background: var(--gold); color: #0f1117; border-color: var(--gold); }
  .dtab-panel { display: none; } .dtab-panel.active { display: block; }
  .nb-top { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .nb-cal { flex: 0 0 300px; max-width: 300px; }
  .nb-detail { flex: 1; min-width: 200px; }
  .nb-detail-empty { color: var(--text-muted); font-size: 13px; padding: 10px 0; }
  .nb-detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-bottom: 8px; }
  .nb-detail-card .nb-detail-date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--gold); margin-bottom: 6px; }
  .nb-detail-card p { color: var(--text-dim); line-height: 1.7; }
  .nb-list { margin-top: 18px; }
  .cal-cell.has-event { cursor: pointer; }
  .med-box { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); overflow-x: auto; }
  .med-tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
  .med-tbl th, .med-tbl td { border-top: 1px solid var(--border); padding: 8px 12px; text-align: center; }
  .med-tbl th { color: var(--text-dim); font-weight: 500; font-size: 12px; }
  .med-tbl .med-name { text-align: left; font-weight: 500; white-space: nowrap; }
  .med-tbl .med-note { text-align: left; color: var(--text-dim); font-size: 12px; }
  footer { text-align: center; padding: 24px; color: var(--text-muted); font-size: 12px; border-top: 1px solid var(--border); margin-top: 8px; }
  footer a { color: var(--gold); }
  .dtab-panel > div { margin-bottom: 22px; }


  .loading-full { padding: 60px; text-align: center; color: var(--text-dim); }

  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .left { padding: 16px; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading-full">กำลังโหลด...</div></div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <span class="lb-close">✕</span>
  <img id="lightboxImg" src="" alt="" onclick="event.stopPropagation()">
</div>

<footer>Tammie Care · <a href="index.html">หน้าแรก</a> · <a href="admin.html">จัดการข้อมูล</a></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
const petId = params.get('id') || 'frappe';
const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

// ค่า default — override ได้ต่อตัวผ่าน key `display` ใน data/<id>.json
// display: { order:[...], hidden:[...], calendar:{source,title}, tabs:[{source,label}], stats:[{key,label,note,color,check}] }
const DEFAULT_STATS = [
  { key:'ischemiaValue', label:'ค่าหัวใจขาดเลือด', color:'red', note:'⚠️ ไม่ควรเกิน {ischemiaNormalMax}' },
  { key:'heartRate', label:'อัตราการเต้นหัวใจ', color:'green', note:'ครั้ง/นาที' },
  { key:'heartSize', label:'ขนาดหัวใจ', color:'gold' },
  { key:'lungXray', label:'X-Ray ปอด', color:'green', check:true },
  { key:'nervous', label:'ระบบประสาท', color:'green' }
];
const DEFAULT_TABS = [
  { source:'treatments', label:'การรักษา' },
  { source:'diarrhea', label:'ท้องเสีย' },
  { source:'general', label:'อาการทั่วไป' },
  { source:'nosebleed', label:'เลือดกำเดา' }
];

function calcAge(b) { const d=new Date(b),n=new Date(); let y=n.getFullYear()-d.getFullYear(); if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))y--; return y; }
function fmtDate(s) { const d=new Date(s); return `${d.getDate()} ${TH_MONTHS[d.getMonth()]} ${(d.getFullYear()+543)%100}`; }

let petData = null;

async function load() {
  try {
    const res = await fetch(`data/${petId}.json`);
    petData = await res.json();
    render();
  } catch(e) {
    document.getElementById('app').innerHTML = '<div class="loading-full">ไม่พบข้อมูลสัตว์เลี้ยงนี้ · <a href="index.html">กลับหน้าแรก</a></div>';
  }
}

function render() {
  const p = petData;
  const v = (p.vitals && p.vitals.latest) || {};
  const app = document.getElementById('app');

  // ---- เตรียมข้อมูลแบบปลอดภัย (ไม่มี = ว่าง ไม่พัง) ----
  const disp = p.display || {};
  const statDefs = disp.stats || DEFAULT_STATS;
  const hasStats = statDefs.some(d => v[d.key] != null);
  const danger = [ ...((p.dangerSigns && p.dangerSigns.liverFailure) || []), ...((p.dangerSigns && p.dangerSigns.wbc) || []) ];
  const watch = p.watchList || [];
  const meds = p.meds || [];
  const calCfg = disp.calendar || {};
  const calSource = calCfg.source || 'nosebleed';
  const calEvents = (p.symptoms && p.symptoms[calSource]) || [];
  const calTitle = calCfg.title || (calSource === 'nosebleed' ? 'ปฏิทินเลือดกำเดา' : 'ปฏิทินอาการ');
  const calHasSide = calEvents.some(e => e.side);
  const tumor = ((p.vitals && p.vitals.liverTumor) || []).filter(x => x.size != null);
  const labConfig = p.labConfig || [];
  const labs = p.labs || [];
  const labPanels = p.labPanels || [];
  const cbcWbc = labs.filter(r => r.panel==='cbc' && r.values && r.values.wbc != null).sort((a,b)=>b.date.localeCompare(a.date));
  const treatments = p.treatments || [];
  const tabsDef = (disp.tabs || DEFAULT_TABS)
    .map(t => ({ ...t, items: t.source === 'treatments' ? treatments : ((p.symptoms && p.symptoms[t.source]) || []) }))
    .filter(t => t.items.length);

  // ---- ประกอบแต่ละส่วน เฉพาะที่มีข้อมูล ----
  const statusBlock = hasStats ? `
        <div>
          <div class="section-label">สถานะล่าสุด${v.date ? ` — ${fmtDate(v.date)}` : ''}</div>
          <div class="stats-grid" id="stats"></div>
        </div>` : '';

  const dangerBlock = danger.length ? `
        <div class="alert-box">
          <div class="icon">🚨</div>
          <div>
            <div class="title">สัญญาณที่ต้องไปหาหมอทันที</div>
            <ul>${danger.map(x=>`<li>${x}</li>`).join('')}</ul>
          </div>
        </div>` : '';

  const lp = p.leucoPlus;
  const wbcForLeuco = cbcWbc.length ? cbcWbc[0].values.wbc : v.wbc;
  const leucoBlock = lp ? (() => {
    const ver = leucoVerdict(lp, { wbc: wbcForLeuco });
    return `
        <div class="leuco-box ${ver.cls}">
          <div class="lp-head">💉 ${lp.title || 'เกณฑ์ฉีด Leuco Plus'}</div>
          <div class="lp-verdict">${ver.icon} ${ver.text}</div>
          <ul class="lp-rules">${(lp.rules||[]).map(r=>`<li>${r}</li>`).join('')}</ul>
        </div>`;
  })() : '';

  const watchBlock = watch.length ? `
        <div class="watch-box">
          <div class="title">📋 สิ่งที่ต้องติดตาม</div>
          <ul>${watch.map(x=>`<li>${x}</li>`).join('')}</ul>
        </div>` : '';

  const labsBlock = (labConfig.length && labs.length) ? `<div id="labsWrap"></div>` : '';

  const medsBlock = meds.length ? `
        <div>
          <div class="section-label">💊 ยาประจำ · ${meds.length} รายการ</div>
          <div class="med-box"><table class="med-tbl">
            <thead><tr><th>ยา</th><th>เช้า</th><th>เย็น</th><th>หมายเหตุ</th></tr></thead>
            <tbody>${meds.map(m=>`<tr><td class="med-name">${m.name}</td><td>${m.am||'–'}</td><td>${m.pm||'–'}</td><td class="med-note">${m.note||''}</td></tr>`).join('')}</tbody>
          </table></div>
        </div>` : '';

  const legend = calHasSide ? `
            <div class="legend">
              <span><i class="dot dot-left"></i> รูจมูกซ้าย</span>
              <span><i class="dot dot-right"></i> รูจมูกขวา</span>
              <span><i class="dot dot-unknown"></i> ไม่ระบุ</span>
            </div>` : `
            <div class="legend"><span><i class="dot dot-any"></i> วันที่มีอาการ</span></div>`;
  const calCol = calEvents.length ? `
          <div class="chart-wrap chart-col">
            <div class="section-label">${calTitle}</div>
            ${legend}
            <div class="cal-nav">
              <button id="calPrev" title="เดือนก่อนหน้า">‹</button>
              <div class="cal-title" id="calTitle"></div>
              <button id="calNext" title="เดือนถัดไป">›</button>
            </div>
            <div id="calMonths"></div>
          </div>` : '';

  const tumorCol = tumor.length ? `
          <div class="chart-wrap chart-col">
            <div class="section-label">ขนาดก้อนในตับ (cm)</div>
            <div class="tumor-box"><canvas id="tumorChart"></canvas></div>
          </div>` : '';

  const tabsBlock = tabsDef.length ? `
        <div>
          <div class="tabs">${tabsDef.map((t,i)=>`<div class="tab${i===0?' active':''}" data-tab="${t.source}">${t.label}</div>`).join('')}</div>
          ${tabsDef.map((t,i)=>`<div class="tab-content${i===0?' active':''}" id="tab-${t.source}"></div>`).join('')}
        </div>` : '';

  // ---- ประกอบตาม display.order / display.hidden แล้วจัดลงแท็บใหญ่ ----
  const blocks = { stats: statusBlock, leuco: leucoBlock, meds: medsBlock, labs: labsBlock, danger: dangerBlock, watch: watchBlock, calendar: calCol, tumor: tumorCol, tabs: tabsBlock };
  const hidden = new Set(disp.hidden || []);
  const order = (disp.order || []).filter(k => k in blocks);
  Object.keys(blocks).forEach(k => { if (!order.includes(k)) order.push(k); });

  // กลุ่มแท็บใหญ่ (override ได้ผ่าน display.dashGroups)
  const dashGroups = disp.dashGroups || [
    { id:'overview', label:'สรุป', keys:['stats','leuco','danger','watch','tumor'] },
    { id:'meds', label:'💊 ยา', keys:['meds'] },
    { id:'labs', label:'ผลเลือด', keys:['labs'] },
    { id:'track', label:'ติดตามอาการ', keys:['tabs'] },
  ];
  const buildGroup = keys => {
    const ks = order.filter(k => keys.includes(k) && !hidden.has(k) && blocks[k]);
    const out = []; let charts = [];
    const flush = () => { if (charts.length) { out.push(`<div class="cal-row">${charts.join('')}</div>`); charts = []; } };
    ks.forEach(k => { if (k==='calendar'||k==='tumor') charts.push(blocks[k]); else { flush(); out.push(blocks[k]); } });
    flush();
    return out.join('\n        ');
  };
  const groups = dashGroups.map(g => ({ ...g, html: buildGroup(g.keys) })).filter(g => g.html.trim());
  const dashBar = groups.length > 1 ? `<div class="dash-tabs">${groups.map((g,i)=>`<div class="dtab${i===0?' active':''}" data-dtab="${g.id}">${g.label}</div>`).join('')}</div>` : '';
  const dashPanels = groups.map((g,i)=>`<div class="dtab-panel${i===0?' active':''}" id="dpanel-${g.id}">${g.html}</div>`).join('');

  app.innerHTML = `
    <header>
      <a href="index.html" class="back">←</a>
      ${p.profile.photo ? `<img class="avatar" src="${p.profile.photo}" alt="${p.profile.name}">` : `<div class="paw">${p.profile.emoji}</div>`}
      <div>
        <h1>${p.profile.name} <span style="color:var(--gold);font-size:14px">${p.profile.nickname}</span></h1>
        <div class="sub">${p.profile.breed} · เกิด ${fmtDate(p.profile.birthDate)}</div>
      </div>
      <div class="age-badge">อายุ ${calcAge(p.profile.birthDate)} ปี</div>
    </header>
    <div class="main">
      <div class="left">
        ${dashBar}
        ${dashPanels}
      </div>
    </div>
  `;

  const show = k => !hidden.has(k);
  if (show('stats') && hasStats) renderStats(v, statDefs);
  if (show('labs') && labConfig.length && labs.length) renderLabs(labPanels, labConfig, labs);
  if (show('tumor') && tumor.length) renderTumorChart(tumor);
  if (show('tabs')) tabsDef.forEach(t => {
    if (t.source === 'treatments') renderTreatments('tab-treatments', t.items);
    else if (t.source === 'nosebleed') renderNosebleedTab('tab-nosebleed', t.items);
    else renderSymptomTimeline('tab-' + t.source, t.items);
  });
  setupTabs();
  setupDashTabs();
}

function setupDashTabs() {
  document.querySelectorAll('.dtab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.dtab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.dtab-panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('dpanel-' + t.dataset.dtab).classList.add('active');
    Object.values(labCharts).forEach(c => c && c.resize());
    if (tumorChartRef) tumorChartRef.resize();
  });
}

function leucoVerdict(lp, v) {
  const raw = (v.wbc == null) ? null : (lp.wbcInThousands ? v.wbc * 1000 : v.wbc);
  if (raw == null) return { cls:'lp-gray', icon:'⚪', text:'ยังไม่มีค่า WBC ล่าสุด — กรอกค่าเพื่อให้ประเมินอัตโนมัติ' };
  const f = n => n.toLocaleString('en-US');
  if (raw < lp.alwaysBelow)
    return { cls:'lp-red', icon:'🔴', text:`WBC = ${f(raw)} → ถึงเกณฑ์ฉีด Leuco Plus (ต่ำกว่า ${f(lp.alwaysBelow)} แม้อาการปกติ)` };
  if (raw < lp.withSymptomsBelow)
    return { cls:'lp-yellow', icon:'🟡', text:`WBC = ${f(raw)} → ถ้ามีอาการอื่นร่วม ให้ฉีด Leuco Plus (อยู่ระหว่าง ${f(lp.alwaysBelow)}–${f(lp.withSymptomsBelow)})` };
  return { cls:'lp-green', icon:'🟢', text:`WBC = ${f(raw)} → ยังไม่ถึงเกณฑ์ฉีด (ตั้งแต่ ${f(lp.withSymptomsBelow)} ขึ้นไป)` };
}

function renderStats(v, defs) {
  document.getElementById('stats').innerHTML = (defs || DEFAULT_STATS)
    .filter(d => v[d.key] != null)
    .map(d => {
      const value = d.check ? '✓' : v[d.key];
      const note = d.check ? v[d.key] : (d.note || '&nbsp;').replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
      return `<div class="stat-card stat-${d.color || 'gold'}"><div class="label">${d.label}</div><div class="value">${value}</div><div class="note">${note}</div></div>`;
    }).join('');
}

let tumorChartRef = null;
function renderTumorChart(data) {
  const ctx = document.getElementById('tumorChart');
  if (tumorChartRef) tumorChartRef.destroy();
  tumorChartRef = new Chart(ctx, {
    type: 'line',
    data: { labels: data.map(x=>fmtDate(x.date)), datasets: [{ data: data.map(x=>x.size), borderColor:'#e8b84b', backgroundColor:'rgba(232,184,75,0.08)', pointBackgroundColor:'#e8b84b', pointRadius:5, tension:0.3, fill:true }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.parsed.y} cm`}}}, scales:{ x:{ticks:{color:'#8892a4',font:{size:10}},grid:{color:'#2a3050'}}, y:{ticks:{color:'#8892a4',font:{size:11}},grid:{color:'#2a3050'}} } }
  });
}

let labCharts = {};
function labBlank(v) { return v == null || v === 0; }
function labRange(c) {
  if (c.min != null && c.max != null) return `ปกติ ${c.min}–${c.max}`;
  if (c.max != null) return `ปกติ ≤${c.max}`;
  if (c.min != null) return `ปกติ ≥${c.min}`;
  return '';
}
function labFlag(c, v) {
  if (labBlank(v)) return null;
  if (c.min != null && v < c.min) return 'low';
  if (c.max != null && v > c.max) return 'high';
  return 'ok';
}
function renderLabs(panels, cfg, labs) {
  // จัดลำดับหมวด: ตาม labPanels ก่อน แล้วต่อด้วยหมวดอื่นที่พบในข้อมูล
  const order = panels.map(p => p.id);
  [...new Set(cfg.map(c => c.panel || '_'))].forEach(pid => { if (!order.includes(pid)) order.push(pid); });
  const nameOf = pid => (panels.find(p=>p.id===pid)||{}).name || 'ผลเลือด';
  labCharts = {};
  const sections = [];
  const toDraw = [];
  order.forEach(pid => {
    const pcfg = cfg.filter(c => (c.panel||'_') === pid);
    const recs = labs.filter(r => (r.panel||'_') === pid);
    if (!pcfg.length || !recs.length) return;
    const latest = [...recs].sort((a,b)=>b.date.localeCompare(a.date))[0];
    const cards = pcfg.filter(c => !labBlank(latest.values[c.key])).map(c => {
      const v = latest.values[c.key];
      const fl = labFlag(c, v);
      const cls = fl==='low'||fl==='high' ? 'red' : (fl==='ok' ? 'green' : 'gold');
      const rt = labRange(c);
      let note;
      if (fl==='low') note = `⤓ ต่ำกว่าปกติ${rt?` (${rt})`:''} · ${c.unit||''}`;
      else if (fl==='high') note = `⤒ สูงกว่าปกติ${rt?` (${rt})`:''} · ${c.unit||''}`;
      else if (rt) note = `${rt} ${c.unit||''}`;
      else note = c.unit || '&nbsp;';
      return `<div class="stat-card stat-${cls}"><div class="label">${c.label}</div><div class="value">${v}</div><div class="note">${note}</div></div>`;
    }).join('');
    const abn = pcfg.filter(c => { const fl = labFlag(c, latest.values[c.key]); return fl==='low'||fl==='high'; }).length;
    const meta = abn > 0 ? `<span style="color:var(--red)">⚠️ ${abn} ค่าผิดปกติ</span>` : `<span style="color:var(--green)">✓ ปกติ</span>`;
    sections.push(`
        <div class="lab-acc">
          <div class="lab-acc-head" onclick="toggleLabAcc(this,'${pid}')">
            <span>🧪 ${nameOf(pid)} <span style="color:var(--text-dim);font-weight:400">· ${fmtDate(latest.date)}</span></span>
            <span class="lab-acc-meta">${meta} <span class="chev">›</span></span>
          </div>
          <div class="lab-acc-body">
            <div class="stats-grid">${cards}</div>
            <div class="chart-wrap" style="margin-top:12px">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
                <span class="section-label" style="margin:0">แนวโน้ม</span>
                <select id="labParam-${pid}" class="lab-select"></select>
              </div>
              <div class="lab-chart-box"><canvas id="labChart-${pid}"></canvas></div>
            </div>
          </div>
        </div>`);
    toDraw.push({ pid, pcfg, recs });
  });
  document.getElementById('labsWrap').innerHTML = sections.join('');
  toDraw.forEach(({pid, pcfg, recs}) => {
    const sel = document.getElementById('labParam-'+pid);
    sel.innerHTML = pcfg.map(c => `<option value="${c.key}">${c.label}</option>`).join('');
    sel.onchange = () => drawLabChart(pid, pcfg, recs, sel.value);
    if (pcfg.length) drawLabChart(pid, pcfg, recs, pcfg[0].key);
  });
}
function toggleLabAcc(head, pid) {
  const acc = head.parentElement;
  acc.classList.toggle('open');
  if (acc.classList.contains('open') && labCharts[pid]) labCharts[pid].resize();
}
function drawLabChart(pid, cfg, recs, key) {
  if (!key) return;
  const c = cfg.find(x=>x.key===key) || {};
  const asc = [...recs].sort((a,b)=>a.date.localeCompare(b.date)).filter(r => !labBlank(r.values[key]));
  if (labCharts[pid]) labCharts[pid].destroy();
  labCharts[pid] = new Chart(document.getElementById('labChart-'+pid), {
    type: 'line',
    data: { labels: asc.map(r=>fmtDate(r.date)), datasets: [{ data: asc.map(r=>r.values[key]), borderColor:'#5b9cf6', backgroundColor:'rgba(91,156,246,0.08)', pointBackgroundColor:'#5b9cf6', pointRadius:5, tension:0.3, fill:true }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:cx=>`${cx.parsed.y} ${c.unit||''}`}}}, scales:{ x:{ticks:{color:'#8892a4',font:{size:10}},grid:{color:'#2a3050'}}, y:{ticks:{color:'#8892a4',font:{size:11}},grid:{color:'#2a3050'}} } }
  });
}

let calMonths = [], calIdx = 0;
function renderCalendar(events) {
  const byMonth = {};
  events.forEach(e => { const k = e.date.slice(0,7); (byMonth[k]=byMonth[k]||[]).push(e); });
  calMonths = Object.keys(byMonth).sort().reverse().map(mk => ({ mk, evs: byMonth[mk] }));
  calIdx = 0;
  document.getElementById('calPrev').onclick = () => { if (calIdx < calMonths.length-1) { calIdx++; drawMonth(); } };
  document.getElementById('calNext').onclick = () => { if (calIdx > 0) { calIdx--; drawMonth(); } };
  drawMonth();
}

function drawMonth() {
  const titleEl = document.getElementById('calTitle');
  const gridEl = document.getElementById('calMonths');
  if (!calMonths.length) { titleEl.textContent = '—'; gridEl.innerHTML = '<div class="cal-empty">ไม่มีข้อมูล</div>'; document.getElementById('calPrev').disabled = document.getElementById('calNext').disabled = true; return; }
  const { mk, evs } = calMonths[calIdx];
  const [y,m] = mk.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstDay = new Date(y, m-1, 1).getDay();
  const evMap = {}; evs.forEach(e => { evMap[new Date(e.date).getDate()] = e; });
  let cells = '';
  for (let i=0;i<firstDay;i++) cells += '<div></div>';
  for (let d=1; d<=daysInMonth; d++) {
    const ev = evMap[d];
    if (ev) {
      const cls = ev.side==='left'?'ev-left':ev.side==='right'?'ev-right':(ev.side?'ev-unknown':'ev-any');
      cells += `<div class="cal-cell has-event ${cls}" onclick="showNbDetail('${ev.date}')">${d}</div>`;
    } else cells += `<div class="cal-cell">${d}</div>`;
  }
  titleEl.textContent = `${TH_MONTHS[m-1]} ${y+543}`;
  gridEl.innerHTML = `<div class="cal-grid">${cells}</div>`;
  document.getElementById('calPrev').disabled = calIdx >= calMonths.length-1;
  document.getElementById('calNext').disabled = calIdx <= 0;
}

function renderTreatments(elId, treatments) {
  document.getElementById(elId).innerHTML = treatments.map(t =>
    `<div class="tl-acc"><div class="tl-acc-head" onclick="this.parentElement.classList.toggle('open')">📅 ${fmtDate(t.date)}<span class="chev">›</span></div><div class="tl-acc-body"><div class="tl-items">${t.entries.map(e=>`<div class="tl-item"><div class="doctor">${e.doctor} — ${e.specialty}</div><p>${e.notes}</p></div>`).join('')}</div></div></div>`
  ).join('');
}

function photoLinks(photos) {
  if (!photos || !photos.length) return '';
  return ' ' + photos.map((src,i) =>
    `<span class="photo-link" onclick="openLightbox('${encodeURI(src)}')">📷 photo${i+1}</span>`
  ).join(' ');
}

function renderSymptomTimeline(elId, items) {
  document.getElementById(elId).innerHTML = '<div class="timeline"><div class="tl-items">' + items.map(d =>
    `<div class="tl-item"><div class="doctor">${fmtDate(d.date)}</div><p>${d.detail}${photoLinks(d.photos)}</p></div>`
  ).join('') + '</div></div>';
}

function sideLabel(s) { return s==='left' ? 'รูจมูกซ้าย' : s==='right' ? 'รูจมูกขวา' : s ? 'ไม่ระบุ' : ''; }
let nbEvents = [];
function renderNosebleedTab(elId, events) {
  nbEvents = events;
  const hasSide = events.some(e => e.side);
  const legend = hasSide
    ? `<div class="legend"><span><i class="dot dot-left"></i> รูจมูกซ้าย</span><span><i class="dot dot-right"></i> รูจมูกขวา</span><span><i class="dot dot-unknown"></i> ไม่ระบุ</span></div>`
    : `<div class="legend"><span><i class="dot dot-any"></i> วันที่มีอาการ</span></div>`;
  const list = '<div class="timeline"><div class="tl-items">' + [...events].sort((a,b)=>b.date.localeCompare(a.date)).map(d =>
    `<div class="tl-item"><div class="doctor">${fmtDate(d.date)}${d.side?' · '+sideLabel(d.side):''}</div><p>${d.detail||''}${photoLinks(d.photos)}</p></div>`
  ).join('') + '</div></div>';
  document.getElementById(elId).innerHTML = `
    <div class="nb-top">
      <div class="nb-cal">
        ${legend}
        <div class="cal-nav">
          <button id="calPrev" title="เดือนก่อนหน้า">‹</button>
          <div class="cal-title" id="calTitle"></div>
          <button id="calNext" title="เดือนถัดไป">›</button>
        </div>
        <div id="calMonths"></div>
      </div>
      <div class="nb-detail" id="nbDetail"><div class="nb-detail-empty">จิ้มวันที่มีจุดสี เพื่อดูรายละเอียด</div></div>
    </div>
    <div class="nb-list">${list}</div>`;
  renderCalendar(events);
}
function showNbDetail(date) {
  const el = document.getElementById('nbDetail');
  if (!el) return;
  const evs = nbEvents.filter(e => e.date === date);
  el.innerHTML = evs.map(e =>
    `<div class="nb-detail-card"><div class="nb-detail-date">${fmtDate(e.date)}${e.side?' · '+sideLabel(e.side):''}</div><p>${e.detail||''}${photoLinks(e.photos)}</p></div>`
  ).join('');
}

function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = decodeURI(src);
  lb.classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightboxImg').src = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function setupTabs() {
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-'+t.dataset.tab).classList.add('active');
  });
}

load();
</script>
