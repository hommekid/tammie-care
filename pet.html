<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard 🐾</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root {
    --bg: #0f1117; --surface: #181c27; --surface2: #1e2334;
    --border: #2a3050; --gold: #e8b84b; --gold-dim: #9b7a2a;
    --red: #e85555; --red-dim: #5c2020; --green: #4ec994; --green-dim: #1a4535;
    --blue: #5b9cf6; --blue-dim: #1a2d5c;
    --text: #e8eaf0; --text-dim: #8892a4; --text-muted: #4a5568;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; }
  a { color: var(--gold); text-decoration: none; }

  header {
    border-bottom: 1px solid var(--border); padding: 16px 28px;
    display: flex; align-items: center; gap: 14px; background: var(--surface);
    position: sticky; top: 0; z-index: 10;
  }
  .back { font-size: 20px; color: var(--text-dim); }
  .paw { font-size: 26px; }
  header h1 { font-size: 20px; font-weight: 700; }
  header .sub { font-size: 12px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .age-badge {
    margin-left: auto; background: var(--gold-dim); color: var(--gold);
    font-size: 12px; font-family: 'IBM Plex Mono', monospace;
    padding: 4px 12px; border-radius: 20px; font-weight: 500;
  }

  .main { display: grid; grid-template-columns: 1fr; min-height: calc(100vh - 65px); }
  .left { border-right: 1px solid var(--border); overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 24px; }

  .section-label { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .stat-card .label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .stat-card .value { font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
  .stat-card .note { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .stat-red .value { color: var(--red); } .stat-green .value { color: var(--green); } .stat-gold .value { color: var(--gold); }

  .alert-box { background: var(--red-dim); border: 1px solid var(--red); border-radius: 10px; padding: 14px 16px; display: flex; gap: 12px; }
  .alert-box .icon { font-size: 18px; flex-shrink: 0; }
  .alert-box .title { font-weight: 600; color: var(--red); font-size: 14px; margin-bottom: 6px; }
  .alert-box ul { padding-left: 16px; font-size: 13px; color: #e8c0c0; line-height: 1.8; }

  .watch-box { background: var(--blue-dim); border: 1px solid var(--blue); border-radius: 10px; padding: 14px 16px; }
  .watch-box .title { font-weight: 600; color: var(--blue); font-size: 14px; margin-bottom: 8px; }
  .watch-box ul { padding-left: 16px; font-size: 13px; color: #b8c8f0; line-height: 1.8; }

  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }

  /* nosebleed calendar */
  .legend { display: flex; gap: 16px; margin-bottom: 14px; font-size: 12px; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .dot-left { background: var(--blue); } .dot-right { background: var(--gold); } .dot-unknown { background: var(--text-muted); }
  .cal-row { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
  .chart-col { flex: 0 0 300px; max-width: 300px; }
  .tumor-box { width: 300px; height: 250px; }
  .tumor-box canvas { width: 300px !important; height: 250px !important; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; max-width: 300px; margin-bottom: 10px; }
  .cal-nav button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .cal-nav button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .cal-nav button:disabled { opacity: 0.3; cursor: default; }
  .cal-title { font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--gold); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; max-width: 300px; }
  .cal-empty { font-size: 12px; color: var(--text-muted); padding: 8px 0; }
  .cal-cell { aspect-ratio: 1; border-radius: 5px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-muted); position: relative; border: 1px solid transparent; }
  .cal-cell.has-event { font-weight: 600; color: var(--text); }
  .cal-cell.ev-left { background: var(--blue-dim); border-color: var(--blue); }
  .cal-cell.ev-right { background: rgba(232,184,75,0.2); border-color: var(--gold-dim); }
  .cal-cell.ev-unknown { background: var(--surface); border-color: var(--text-muted); }
  .cal-cell .tip { display: none; position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%); background: #000; border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 12px; color: var(--text); white-space: normal; width: 180px; z-index: 20; font-weight: 400; line-height: 1.4; }
  .cal-cell:hover .tip { display: block; }

  .timeline { display: flex; flex-direction: column; }
  .tl-date-group { margin-bottom: 18px; }
  .tl-date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--gold); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .tl-date::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .tl-items { display: flex; flex-direction: column; gap: 8px; }
  .tl-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 13px; }
  .tl-item .doctor { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--gold); margin-bottom: 6px; font-weight: 500; }
  .tl-item p { color: var(--text-dim); line-height: 1.7; }

  .tl-acc { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; background: var(--surface); }
  .tl-acc-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--gold); user-select: none; }
  .tl-acc-head:hover { background: var(--surface2); }
  .tl-acc-head .chev { margin-left: auto; transition: transform 0.2s; color: var(--text-muted); font-size: 16px; }
  .tl-acc.open .tl-acc-head .chev { transform: rotate(90deg); }
  .tl-acc-body { display: none; padding: 0 14px 12px; }
  .tl-acc.open .tl-acc-body { display: block; }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { padding: 7px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; cursor: pointer; color: var(--text-dim); }
  .tab.active { background: var(--gold-dim); color: var(--gold); border-color: var(--gold-dim); }
  .tab-content { display: none; } .tab-content.active { display: block; }


  .loading-full { padding: 60px; text-align: center; color: var(--text-dim); }

  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .left { padding: 16px; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading-full">กำลังโหลด...</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
const petId = params.get('id') || 'frappe';
const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function calcAge(b) { const d=new Date(b),n=new Date(); let y=n.getFullYear()-d.getFullYear(); if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))y--; return y; }
function fmtDate(s) { const d=new Date(s); return `${d.getDate()} ${TH_MONTHS[d.getMonth()]} ${(d.getFullYear()+543)%100}`; }

let petData = null;

async function load() {
  try {
    const res = await fetch(`data/${petId}.json`);
    petData = await res.json();
    render();
  } catch(e) {
    document.getElementById('app').innerHTML = '<div class="loading-full">ไม่พบข้อมูลสัตว์เลี้ยงนี้ · <a href="index.html">กลับหน้าแรก</a></div>';
  }
}

function render() {
  const p = petData;
  const v = p.vitals.latest;
  const app = document.getElementById('app');

  app.innerHTML = `
    <header>
      <a href="index.html" class="back">←</a>
      <div class="paw">${p.profile.emoji}</div>
      <div>
        <h1>${p.profile.name} <span style="color:var(--gold);font-size:14px">${p.profile.nickname}</span></h1>
        <div class="sub">${p.profile.breed} · เกิด ${fmtDate(p.profile.birthDate)}</div>
      </div>
      <div class="age-badge">อายุ ${calcAge(p.profile.birthDate)} ปี</div>
    </header>
    <div class="main">
      <div class="left">
        <div>
          <div class="section-label">สถานะล่าสุด — ${fmtDate(v.date)}</div>
          <div class="stats-grid" id="stats"></div>
        </div>
        <div class="alert-box">
          <div class="icon">🚨</div>
          <div>
            <div class="title">สัญญาณที่ต้องไปหาหมอทันที</div>
            <ul>${p.dangerSigns.liverFailure.map(x=>`<li>${x}</li>`).join('')}${p.dangerSigns.wbc.map(x=>`<li>${x}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="watch-box">
          <div class="title">📋 สิ่งที่ต้องติดตาม</div>
          <ul>${p.watchList.map(x=>`<li>${x}</li>`).join('')}</ul>
        </div>
        <div class="cal-row">
          <div class="chart-wrap chart-col">
            <div class="section-label">ปฏิทินเลือดกำเดา</div>
            <div class="legend">
              <span><i class="dot dot-left"></i> รูจมูกซ้าย</span>
              <span><i class="dot dot-right"></i> รูจมูกขวา</span>
              <span><i class="dot dot-unknown"></i> ไม่ระบุ</span>
            </div>
            <div class="cal-nav">
              <button id="calPrev" title="เดือนก่อนหน้า">‹</button>
              <div class="cal-title" id="calTitle"></div>
              <button id="calNext" title="เดือนถัดไป">›</button>
            </div>
            <div id="calMonths"></div>
          </div>
          <div class="chart-wrap chart-col">
            <div class="section-label">ขนาดก้อนในตับ (cm)</div>
            <div class="tumor-box"><canvas id="tumorChart"></canvas></div>
          </div>
        </div>
        <div>
          <div class="tabs">
            <div class="tab active" data-tab="treatments">การรักษา</div>
            <div class="tab" data-tab="diarrhea">ท้องเสีย/Smecta</div>
          </div>
          <div class="tab-content active" id="tab-treatments"></div>
          <div class="tab-content" id="tab-diarrhea"></div>
        </div>
      </div>
    </div>
  `;

  renderStats(v);
  renderTumorChart();
  renderCalendar();
  renderTreatments();
  renderDiarrhea();
  setupTabs();
}

function renderStats(v) {
  const cards = [];
  if (v.ischemiaValue != null) cards.push(`<div class="stat-card stat-red"><div class="label">ค่าหัวใจขาดเลือด</div><div class="value">${v.ischemiaValue}</div><div class="note">⚠️ ไม่ควรเกิน ${v.ischemiaNormalMax}</div></div>`);
  if (v.heartRate != null) cards.push(`<div class="stat-card stat-green"><div class="label">อัตราการเต้นหัวใจ</div><div class="value">${v.heartRate}</div><div class="note">ครั้ง/นาที</div></div>`);
  if (v.heartSize != null) cards.push(`<div class="stat-card stat-gold"><div class="label">ขนาดหัวใจ</div><div class="value">${v.heartSize}</div><div class="note">&nbsp;</div></div>`);
  if (v.wbc != null) cards.push(`<div class="stat-card stat-red"><div class="label">WBC</div><div class="value">${v.wbc}</div><div class="note">× 10³</div></div>`);
  if (v.lungXray) cards.push(`<div class="stat-card stat-green"><div class="label">X-Ray ปอด</div><div class="value">✓</div><div class="note">${v.lungXray}</div></div>`);
  if (v.nervous) cards.push(`<div class="stat-card stat-green"><div class="label">ระบบประสาท</div><div class="value">${v.nervous}</div><div class="note">&nbsp;</div></div>`);
  document.getElementById('stats').innerHTML = cards.join('');
}

function renderTumorChart() {
  const data = petData.vitals.liverTumor.filter(x => x.size != null);
  const ctx = document.getElementById('tumorChart');
  new Chart(ctx, {
    type: 'line',
    data: { labels: data.map(x=>fmtDate(x.date)), datasets: [{ data: data.map(x=>x.size), borderColor:'#e8b84b', backgroundColor:'rgba(232,184,75,0.08)', pointBackgroundColor:'#e8b84b', pointRadius:5, tension:0.3, fill:true }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.parsed.y} cm`}}}, scales:{ x:{ticks:{color:'#8892a4',font:{size:10}},grid:{color:'#2a3050'}}, y:{ticks:{color:'#8892a4',font:{size:11}},grid:{color:'#2a3050'}} } }
  });
}

let calMonths = [], calIdx = 0;
function renderCalendar() {
  const events = petData.symptoms.nosebleed;
  const byMonth = {};
  events.forEach(e => { const k = e.date.slice(0,7); (byMonth[k]=byMonth[k]||[]).push(e); });
  calMonths = Object.keys(byMonth).sort().reverse().map(mk => ({ mk, evs: byMonth[mk] }));
  calIdx = 0;
  document.getElementById('calPrev').onclick = () => { if (calIdx < calMonths.length-1) { calIdx++; drawMonth(); } };
  document.getElementById('calNext').onclick = () => { if (calIdx > 0) { calIdx--; drawMonth(); } };
  drawMonth();
}

function drawMonth() {
  const titleEl = document.getElementById('calTitle');
  const gridEl = document.getElementById('calMonths');
  if (!calMonths.length) { titleEl.textContent = '—'; gridEl.innerHTML = '<div class="cal-empty">ไม่มีข้อมูล</div>'; document.getElementById('calPrev').disabled = document.getElementById('calNext').disabled = true; return; }
  const { mk, evs } = calMonths[calIdx];
  const [y,m] = mk.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstDay = new Date(y, m-1, 1).getDay();
  const evMap = {}; evs.forEach(e => { evMap[new Date(e.date).getDate()] = e; });
  let cells = '';
  for (let i=0;i<firstDay;i++) cells += '<div></div>';
  for (let d=1; d<=daysInMonth; d++) {
    const ev = evMap[d];
    if (ev) {
      const cls = ev.side==='left'?'ev-left':ev.side==='right'?'ev-right':'ev-unknown';
      cells += `<div class="cal-cell has-event ${cls}">${d}<span class="tip">${fmtDate(ev.date)}: ${ev.detail}</span></div>`;
    } else cells += `<div class="cal-cell">${d}</div>`;
  }
  titleEl.textContent = `${TH_MONTHS[m-1]} ${y+543}`;
  gridEl.innerHTML = `<div class="cal-grid">${cells}</div>`;
  document.getElementById('calPrev').disabled = calIdx >= calMonths.length-1;
  document.getElementById('calNext').disabled = calIdx <= 0;
}

function renderTreatments() {
  document.getElementById('tab-treatments').innerHTML = petData.treatments.map(t =>
    `<div class="tl-acc"><div class="tl-acc-head" onclick="this.parentElement.classList.toggle('open')">📅 ${fmtDate(t.date)}<span class="chev">›</span></div><div class="tl-acc-body"><div class="tl-items">${t.entries.map(e=>`<div class="tl-item"><div class="doctor">${e.doctor} — ${e.specialty}</div><p>${e.notes}</p></div>`).join('')}</div></div></div>`
  ).join('');
}

function renderDiarrhea() {
  document.getElementById('tab-diarrhea').innerHTML = '<div class="timeline"><div class="tl-items">' + petData.symptoms.diarrhea.map(d =>
    `<div class="tl-item"><div class="doctor">${fmtDate(d.date)}</div><p>${d.detail}</p></div>`
  ).join('') + '</div></div>';
}

function setupTabs() {
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-'+t.dataset.tab).classList.add('active');
  });
}

load();
</script>
</body>
</html>
